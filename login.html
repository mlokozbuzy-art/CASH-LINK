<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>LINKCASH - Secure Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:radial-gradient(circle at top,#1c1607 0,#090909 32%,#050505 65%);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-wrap{
    width:100%;
    max-width:410px;
}

.login-card{
    background:rgba(15,15,15,.96);
    border:1px solid #292929;
    border-radius:28px;
    padding:30px 22px 24px;
    box-shadow:0 25px 80px rgba(0,0,0,.65);
}

.brand{
    text-align:center;
    margin-bottom:27px;
}

.logo{
    width:64px;
    height:64px;
    margin:0 auto 15px;
    border-radius:18px;
    background:linear-gradient(145deg,#ffe082,#d4a72c,#8f6b12);
    color:#050505;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:900;
}

.brand h1{
    font-size:25px;
    letter-spacing:1px;
}

.brand p{
    color:#666;
    font-size:10px;
    margin-top:7px;
}

.secure-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:12px;
    padding:7px 11px;
    border-radius:20px;
    background:rgba(88,216,138,.06);
    border:1px solid rgba(88,216,138,.18);
    color:#58d88a;
    font-size:8px;
    font-weight:900;
}

.message{
    display:none;
    padding:12px;
    border-radius:11px;
    font-size:10px;
    text-align:center;
    margin-bottom:15px;
}

.message.error{
    display:block;
    color:#ff7777;
    background:rgba(255,70,70,.07);
    border:1px solid rgba(255,70,70,.22);
}

.message.success{
    display:block;
    color:#58d88a;
    background:rgba(88,216,138,.07);
    border:1px solid rgba(88,216,138,.22);
}

.field{
    margin-bottom:16px;
}

.field-head{
    margin-bottom:7px;
}

label{
    color:#aaa;
    font-size:9px;
    font-weight:900;
    letter-spacing:.7px;
}

.input-wrap{
    position:relative;
}

input{
    width:100%;
    height:51px;
    border-radius:12px;
    border:1px solid #292929;
    background:#080808;
    color:#fff;
    padding:0 45px 0 14px;
    outline:none;
    font-size:12px;
}

input::placeholder{
    color:#4f4f4f;
}

input:focus{
    border-color:#d4a72c;
    box-shadow:0 0 0 3px rgba(212,167,44,.07);
}

.input-icon{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    color:#666;
    font-size:15px;
    pointer-events:none;
}

.password-toggle{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    width:32px;
    height:32px;
    border:0;
    background:transparent;
    color:#777;
    cursor:pointer;
    font-size:14px;
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:3px 0 18px;
}

.remember{
    display:flex;
    align-items:center;
    gap:7px;
    color:#666;
    font-size:9px;
    cursor:pointer;
}

.remember input{
    width:15px;
    height:15px;
    margin:0;
    padding:0;
    accent-color:#d4a72c;
}

.forgot{
    color:#d4a72c;
    text-decoration:none;
    font-size:9px;
}

.login-btn{
    width:100%;
    height:51px;
    border:1px solid #d4a72c;
    border-radius:12px;
    background:linear-gradient(135deg,rgba(255,224,130,.16),rgba(212,167,44,.07));
    color:#d4a72c;
    font-size:11px;
    font-weight:900;
    cursor:pointer;
}

.login-btn.loading{
    opacity:.65;
    pointer-events:none;
}

.divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:22px 0;
}

.divider span{
    height:1px;
    flex:1;
    background:#222;
}

.divider small{
    color:#555;
    font-size:8px;
}

.register-box{
    text-align:center;
    padding:15px;
    border-radius:13px;
    background:#0b0b0b;
    border:1px solid #202020;
}

.register-box p{
    color:#666;
    font-size:9px;
}

.register-box a{
    display:inline-block;
    margin-top:7px;
    color:#d4a72c;
    text-decoration:none;
    font-size:10px;
    font-weight:900;
}

.footer{
    text-align:center;
    color:#444;
    font-size:8px;
    margin-top:18px;
    line-height:1.7;
}

.loading-dot{
    display:inline-block;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%,100%{opacity:.3}
    50%{opacity:1}
}

@media(max-width:360px){
    .login-card{
        padding:25px 17px 21px;
    }
}
</style>
</head>

<body>

<div class="login-wrap">

<div class="login-card">

<div class="brand">

<div class="logo">LC</div>

<h1>Welcome Back</h1>

<p>Secure access to your LINKCASH account</p>

<div class="secure-badge">
🔒 SECURE LOGIN
</div>

</div>

<div id="message" class="message"></div>

<form id="loginForm" autocomplete="on">

<div class="field">

<div class="field-head">
<label for="username">USERNAME</label>
</div>

<div class="input-wrap">

<input
id="username"
name="username"
type="text"
autocomplete="username"
placeholder="Enter your username"
maxlength="50"
required
>

<div class="input-icon">👤</div>

</div>

</div>

<div class="field">

<div class="field-head">
<label for="password">PASSWORD</label>
</div>

<div class="input-wrap">

<input
id="password"
name="password"
type="password"
autocomplete="current-password"
placeholder="Enter your password"
maxlength="100"
required
>

<button
type="button"
class="password-toggle"
id="togglePassword"
aria-label="Show password"
>👁</button>

</div>

</div>

<div class="options">

<label class="remember">

<input type="checkbox" id="remember">

<span>Remember me</span>

</label>

<a
href="#"
class="forgot"
onclick="forgotPassword(event)"
>
Forgot password?
</a>

</div>

<button
type="submit"
class="login-btn"
id="loginBtn"
>
LOGIN TO LINKCASH
</button>

</form>

<div class="divider">

<span></span>
<small>LINKCASH</small>
<span></span>

</div>

<div class="register-box">

<p>Don't have a LINKCASH account?</p>

<a href="register.html">
CREATE ACCOUNT
</a>

</div>

</div>

<div class="footer">
© 2026 LINKCASH<br>
Member access portal
</div>

</div>

<script>

/* =========================================
   CEO
========================================= */

const CEO_USERNAME = "ceo";
const CEO_PASSWORD = "CEO12345";


/* =========================================
   ELEMENTS
========================================= */

const loginForm =
    document.getElementById("loginForm");

const usernameInput =
    document.getElementById("username");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const message =
    document.getElementById("message");

const remember =
    document.getElementById("remember");


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type){

    message.className =
        "message " + type;

    message.textContent =
        text;

}

function hideMessage(){

    message.className =
        "message";

    message.textContent =
        "";

}


/* =========================================
   GET REGISTERED ACCOUNT
========================================= */

function getAccount(){

    try{

        const data =
            localStorage.getItem("linkcashAccount");

        if(!data){
            return null;
        }

        const account =
            JSON.parse(data);

        if(
            !account ||
            typeof account !== "object"
        ){

            return null;
        }

        return account;

    }catch(error){

        return null;

    }

}


/* =========================================
   FIND REGISTERED USER
========================================= */

function findUser(username,password){

    const account =
        getAccount();

    if(!account){
        return null;
    }

    const savedUsername =
        String(account.username || "")
        .trim()
        .toLowerCase();

    const enteredUsername =
        String(username || "")
        .trim()
        .toLowerCase();

    const savedPassword =
        String(account.password || "");

    const enteredPassword =
        String(password || "");

    if(
        savedUsername === enteredUsername &&
        savedPassword === enteredPassword
    ){

        return account;

    }

    return null;

}


/* =========================================
   CEO LOGIN
========================================= */

function loginCEO(username){

    localStorage.setItem(
        "linkcashCEOLoggedIn",
        "true"
    );

    localStorage.setItem(
        "linkcashCEO",
        JSON.stringify({
            username:CEO_USERNAME,
            role:"ceo",
            loginAt:new Date().toISOString()
        })
    );

    localStorage.setItem(
        "linkcashLoggedIn",
        "true"
    );

    localStorage.setItem(
        "linkcashLoggedInUser",
        JSON.stringify({
            username:username,
            role:"ceo"
        })
    );

    window.location.replace(
        "ceodashboard.html"
    );

}


/* =========================================
   NORMAL USER LOGIN
========================================= */

function loginUser(user){

    localStorage.setItem(
        "linkcashLoggedInUser",
        JSON.stringify(user)
    );

    localStorage.setItem(
        "linkcashUser",
        JSON.stringify(user)
    );

    localStorage.setItem(
        "linkcashAccount",
        JSON.stringify(user)
    );

    const status =
        String(
            user.status || "pending"
        )
        .trim()
        .toLowerCase();


    /* =====================================
       ACTIVE
    ===================================== */

    if(
        status === "active" ||
        status === "activated"
    ){

        localStorage.setItem(
            "linkcashLoggedIn",
            "true"
        );

        showMessage(
            "Login successful. Opening dashboard...",
            "success"
        );

        setTimeout(function(){

            window.location.replace(
                "dashboard.html"
            );

        },500);

        return;
    }


    /* =====================================
       PENDING OR REJECTED
       GO TO EXACT FILE:
       pending-dashboard.html
    ===================================== */

    localStorage.removeItem(
        "linkcashLoggedIn"
    );

    localStorage.setItem(
        "linkcashPendingUser",
        JSON.stringify(user)
    );

    showMessage(
        status === "rejected"
        ? "Your account requires attention. Opening account status..."
        : "Your account is still pending activation...",
        status === "rejected"
        ? "error"
        : "success"
    );

    setTimeout(function(){

        window.location.href =
            "./pending-dashboard.html";

    },700);

}


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
    "submit",
    function(event){

        event.preventDefault();

        hideMessage();

        const username =
            usernameInput.value.trim();

        const password =
            passwordInput.value;


        if(!username){

            showMessage(
                "Please enter your username.",
                "error"
            );

            usernameInput.focus();

            return;
        }


        if(!password){

            showMessage(
                "Please enter your password.",
                "error"
            );

            passwordInput.focus();

            return;
        }


        loginBtn.classList.add("loading");

        loginBtn.innerHTML =
            '<span class="loading-dot">●</span> SIGNING IN...';


        setTimeout(function(){


            /* =================================
               CEO LOGIN
            ================================= */

            if(
                username.toLowerCase() ===
                CEO_USERNAME.toLowerCase() &&
                password === CEO_PASSWORD
            ){

                loginCEO(username);

                return;
            }


            /* =================================
               NORMAL USER
            ================================= */

            const user =
                findUser(
                    username,
                    password
                );


            if(!user){

                loginBtn.classList.remove(
                    "loading"
                );

                loginBtn.textContent =
                    "LOGIN TO LINKCASH";

                showMessage(
                    "Username or password is incorrect.",
                    "error"
                );

                return;
            }


            /* =================================
               REMEMBER USERNAME
            ================================= */

            if(remember.checked){

                localStorage.setItem(
                    "linkcashRememberedUsername",
                    username
                );

            }else{

                localStorage.removeItem(
                    "linkcashRememberedUsername"
                );

            }


            loginUser(user);

        },350);

    }
);


/* =========================================
   SHOW / HIDE PASSWORD
========================================= */

document
.getElementById("togglePassword")
.addEventListener(
    "click",
    function(){

        if(
            passwordInput.type === "password"
        ){

            passwordInput.type = "text";

            this.textContent = "🙈";

            this.setAttribute(
                "aria-label",
                "Hide password"
            );

        }else{

            passwordInput.type = "password";

            this.textContent = "👁";

            this.setAttribute(
                "aria-label",
                "Show password"
            );

        }

    }
);


/* =========================================
   FORGOT PASSWORD
========================================= */

function forgotPassword(event){

    event.preventDefault();

    showMessage(
        "Password recovery is not connected yet. Please contact LINKCASH support.",
        "error"
    );

}


/* =========================================
   REMEMBERED USERNAME
========================================= */

const remembered =
    localStorage.getItem(
        "linkcashRememberedUsername"
    );

if(remembered){

    usernameInput.value =
        remembered;

    remember.checked =
        true;

    passwordInput.focus();

}else{

    usernameInput.focus();

}

</script>

</body>
</html>
