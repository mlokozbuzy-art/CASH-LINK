<script>

/* ==============================
   ELEMENTS
============================== */

const form =
    document.getElementById("loginForm");

const username =
    document.getElementById("username");

const password =
    document.getElementById("password");

const showPassword =
    document.getElementById("showPassword");

const message =
    document.getElementById("message");


/* ==============================
   SHOW / HIDE PASSWORD
============================== */

showPassword.addEventListener(
    "click",
    function(){

        if(password.type === "password"){

            password.type = "text";
            showPassword.textContent = "HIDE";

        }else{

            password.type = "password";
            showPassword.textContent = "SHOW";

        }

    }
);


/* ==============================
   MESSAGE
============================== */

function showMessage(text,type){

    message.className =
        "message " + type;

    message.textContent =
        text;

    message.style.display =
        "block";

}


/* ==============================
   LOGIN
============================== */

form.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        const user =
            username.value.trim().toLowerCase();

        const pass =
            password.value;


        /* ==========================
           VALIDATION
        ========================== */

        if(!user){

            showMessage(
                "Please enter your username.",
                "error"
            );

            username.focus();

            return;
        }


        if(!pass){

            showMessage(
                "Please enter your password.",
                "error"
            );

            password.focus();

            return;
        }


        /* ==========================
           GET SAVED ACCOUNT
        ========================== */

        const savedAccount =
            localStorage.getItem(
                "linkcashAccount"
            );


        if(!savedAccount){

            showMessage(
                "No account found. Please create an account first.",
                "error"
            );

            return;
        }


        let account;


        try{

            account =
                JSON.parse(savedAccount);

        }catch(error){

            showMessage(
                "Account data is invalid. Please create a new account.",
                "error"
            );

            return;
        }


        /* ==========================
           CHECK USERNAME
        ========================== */

        const savedUsername =
            String(
                account.username || ""
            )
            .trim()
            .toLowerCase();


        if(savedUsername !== user){

            showMessage(
                "Username or password is incorrect.",
                "error"
            );

            return;
        }


        /* ==========================
           CHECK PASSWORD
        ========================== */

        if(
            String(account.password || "") !==
            String(pass)
        ){

            showMessage(
                "Username or password is incorrect.",
                "error"
            );

            return;
        }


        /* ==========================
           SAVE LOGIN SESSION
        ========================== */

        localStorage.setItem(
            "linkcashLoggedIn",
            "true"
        );


        localStorage.setItem(
            "linkcashUser",
            JSON.stringify(account)
        );


        /* ==========================
           SUCCESS
        ========================== */

        showMessage(
            "Login successful ✓ Opening dashboard...",
            "success"
        );


        /* ==========================
           GO TO DASHBOARD
        ========================== */

        setTimeout(function(){

            window.location.href =
                "dashboard.html";

        },700);

    }
);

</script>
