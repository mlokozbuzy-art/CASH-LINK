<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | LINKCASH</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #eef6ff, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      color: #1167d8;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .card {
      background: #ffffff;
      padding: 30px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      color: #172033;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      color: #344054;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      outline: none;
      margin-bottom: 18px;
      font-size: 15px;
    }

    input:focus {
      border-color: #1167d8;
    }

    button {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 11px;
      background: #1167d8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .register {
      text-align: center;
      margin-top: 20px;
      color: #667085;
      font-size: 14px;
    }

    .register a {
      color: #1167d8;
      font-weight: bold;
      text-decoration: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #667085;
      text-decoration: none;
      font-size: 14px;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 18px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      LINKCASH
    </div>

    <div class="card">

      <h1>Welcome Back</h1>

      <p class="subtitle">
        Login to your LINKCASH account
      </p>

      <div id="message" class="message"></div>

      <form id="loginForm">

        <label>Email</label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

        <label>Password</label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >

        <button type="submit">
          Login
        </button>

      </form>

      <div class="register">

        Don't have an account?

        <a href="register.html">
          Create Account
        </a>

      </div>

      <a href="index.html" class="back">
        ← Back to Home
      </a>

    </div>

  </div>


  <script>

    const form =
      document.getElementById("loginForm");

    const message =
      document.getElementById("message");


    form.addEventListener("submit", function(event) {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      /*
        Temporary login.

        Real authentication will be connected
        to Supabase in the next stage.
      */

      const savedMember =
        JSON.parse(
          localStorage.getItem("pendingMember")
        );


      if (
        savedMember &&
        savedMember.email === email
      ) {

        localStorage.setItem(
          "loggedIn",
          "true"
        );

        localStorage.setItem(
          "currentMember",
          JSON.stringify(savedMember)
        );

        window.location.href =
          "dashboard.html";

      } else {

        message.style.display = "block";

        message.style.background = "#fff1f0";

        message.style.color = "#c62828";

        message.textContent =
          "Account not found. Please register first.";

      }

    });

  </script>

</body>
</html>
