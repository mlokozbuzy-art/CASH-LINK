<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LINKCASH - Login</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:#050505;
    color:#fff;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
}

.wrapper{
    width:100%;
    max-width:420px;
}

/* =========================
   BRAND
========================= */

.brand{
    text-align:center;
    margin-bottom:25px;
}

.logo{
    width:70px;
    height:70px;

    margin:auto;

    border-radius:20px;

    background:linear-gradient(
        145deg,
        #ffe082,
        #d4a72c,
        #8f6b12
    );

    display:flex;
    align-items:center;
    justify-content:center;

    color:#080808;

    font-size:24px;
    font-weight:900;

    box-shadow:
        0 0 30px rgba(212,167,44,.20);
}

.brand h1{
    margin-top:13px;

    font-size:28px;

    letter-spacing:3px;
}

.brand p{
    margin-top:7px;

    color:#777;

    font-size:12px;
}

/* =========================
   CARD
========================= */

.card{
    background:#101010;

    border:1px solid #292929;

    border-radius:22px;

    padding:28px 22px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.65);
}

.title{
    margin-bottom:22px;
}

.title h2{
    font-size:23px;

    margin-bottom:7px;
}

.title p{
    color:#777;

    font-size:13px;

    line-height:1.5;
}

/* =========================
   FIELD
========================= */

.field{
    margin-bottom:17px;
}

.field label{
    display:block;

    color:#ccc;

    font-size:13px;

    margin-bottom:8px;
}

input{
    width:100%;

    height:50px;

    background:#070707;

    border:1px solid #292929;

    border-radius:12px;

    color:#fff;

    outline:none;

    padding:0 15px;

    font-size:14px;
}

input::placeholder{
    color:#555;
}

input:focus{
    border-color:#d4a72c;

    box-shadow:
        0 0 0 2px rgba(212,167,44,.08);
}

/* =========================
   PASSWORD
========================= */

.password-wrap{
    position:relative;
}

.password-wrap input{
    padding-right:65px;
}

.show-password{
    position:absolute;

    right:12px;

    top:50%;

    transform:translateY(-50%);

    border:none;

    background:none;

    color:#d4a72c;

    font-size:11px;

    font-weight:bold;

    cursor:pointer;
}

/* =========================
   LOGIN BUTTON
========================= */

.login-btn{
    width:100%;

    height:52px;

    margin-top:5px;

    border:none;

    border-radius:13px;

    background:linear-gradient(
        135deg,
        #ffe082,
        #d4a72c,
        #a77b17
    );

    color:#080808;

    font-size:15px;

    font-weight:900;

    cursor:pointer;
}

.login-btn:active{
    transform:scale(.98);
}

.login-btn:disabled{
    opacity:.6;

    cursor:not-allowed;
}

/* =========================
   MESSAGE
========================= */

.message{
    display:none;

    margin-top:14px;

    padding:12px;

    border-radius:10px;

    text-align:center;

    font-size:12px;

    line-height:1.5;
}

.message.success{
    display:block;

    color:#62df91;

    background:rgba(40,180,100,.08);

    border:1px solid rgba(40,180,100,.25);
}

.message.error{
    display:block;

    color:#ff7777;

    background:rgba(220,60,60,.08);

    border:1px solid rgba(220,60,60,.25);
}

/* =========================
   REGISTER
========================= */

.register{
    text-align:center;

    margin-top:22px;

    padding-top:20px;

    border-top:1px solid #222;

    color:#777;

    font-size:13px;
}

.register a{
    color:#e0b83e;

    text-decoration:none;

    font-weight:bold;
}

/* =========================
   BACK
========================= */

.back{
    display:block;

    text-align:center;

    margin-top:18px;

    color:#666;

    text-decoration:none;

    font-size:12px;
}

.back:hover{
    color:#d4a72c;
}

/* =========================
   FOOTER
========================= */

.footer{
    text-align:center;

    margin-top:18px;

    color:#444;

    font-size:10px;
}

</style>

</head>


<body>

<div class="wrapper">


    <!-- BRAND -->

    <div class="brand">

        <div class="logo">
            LC
        </div>

        <h1>
            LINKCASH
        </h1>

        <p>
            Simple. Secure. Connected.
        </p>

    </div>


    <!-- LOGIN CARD -->

    <div class="card">


        <div class="title">

            <h2>
                Welcome Back
            </h2>

            <p>
                Login to your LINKCASH account.
            </p>

        </div>


        <form id="loginForm">


            <!-- USERNAME -->

            <div class="field">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="field">

                <label>
                    Password
                </label>

                <div class="password-wrap">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                    >
                        SHOW
                    </button>

                </div>

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                LOG IN
            </button>

        </form>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>


        <!-- REGISTER -->

        <div class="register">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </div>

    </div>


    <!-- BACK -->

    <a
        href="index.html"
        class="back"
    >
        ← Back to Home
    </a>


    <!-- FOOTER -->

    <div class="footer">
        © 2026 LINKCASH
    </div>


</div>


<script>

/* =========================================
   ELEMENTS
========================================= */

const form =
    document.getElementById("loginForm");

const username =
    document.getElementById("username");

const password =
    document.getElementById("password");

const showPassword =
    document.getElementById("showPassword");

const loginBtn =
    document.getElementById("loginBtn");

const message =
    document.getElementById("message");


/* =========================================
   SHOW / HIDE PASSWORD
========================================= */

showPassword.addEventListener(
    "click",
    function(){

        if(password.type === "password"){

            password.type = "text";

            showPassword.textContent =
                "HIDE";

        }else{

            password.type = "password";

            showPassword.textContent =
                "SHOW";

        }

    }
);


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type){

    message.className =
        "message " + type;

    message.textContent =
        text;

    message.style.display =
        "block";

}


/* =========================================
   LOGIN
========================================= */

form.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        const enteredUsername =
            username.value
            .trim()
            .toLowerCase();

        const enteredPassword =
            password.value;


        /* ===============================
           VALIDATION
        =============================== */

        if(!enteredUsername){

            showMessage(
                "Please enter your username.",
                "error"
            );

            username.focus();

            return;

        }


        if(!enteredPassword){

            showMessage(
                "Please enter your password.",
                "error"
            );

            password.focus();

            return;

        }


        /* ===============================
           GET ACCOUNT
        =============================== */

        const savedAccount =
            localStorage.getItem(
                "linkcashAccount"
            );


        if(!savedAccount){

            showMessage(
                "No account found. Please create an account first.",
                "error"
            );

            return;

        }


        let account;


        try{

            account =
                JSON.parse(savedAccount);

        }catch(error){

            showMessage(
                "Account data is invalid. Please create a new account.",
                "error"
            );

            return;

        }


        /* ===============================
           CHECK USERNAME
        =============================== */

        const savedUsername =
            String(
                account.username || ""
            )
            .trim()
            .toLowerCase();


        if(
            savedUsername !==
            enteredUsername
        ){

            showMessage(
                "Username or password is incorrect.",
                "error"
            );

            return;

        }


        /* ===============================
           CHECK PASSWORD
        =============================== */

        if(
            String(account.password || "") !==
            String(enteredPassword)
        ){

            showMessage(
                "Username or password is incorrect.",
                "error"
            );

            return;

        }


        /* ===============================
           SAVE LOGIN SESSION
        =============================== */

        localStorage.setItem(
            "linkcashLoggedIn",
            "true"
        );


        localStorage.setItem(
            "linkcashUser",
            JSON.stringify(account)
        );


        /* ===============================
           SUCCESS
        =============================== */

        loginBtn.disabled =
            true;

        loginBtn.textContent =
            "LOGIN SUCCESSFUL ✓";


        showMessage(
            "Login successful ✓ Opening dashboard...",
            "success"
        );


        /* ===============================
           DASHBOARD
        =============================== */

        setTimeout(
            function(){

                window.location.href =
                    "dashboard.html";

            },
            700
        );

    }
);

</script>

</body>

</html>
