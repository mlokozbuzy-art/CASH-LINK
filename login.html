<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LINKCASH - Login</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:#050505;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:390px;
  background:linear-gradient(145deg,#121212,#080808);
  border:1px solid #292929;
  border-radius:24px;
  padding:28px 20px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.logo-wrap{
  display:flex;
  justify-content:center;
  margin-bottom:18px;
}

.logo{
  width:62px;
  height:62px;
  border-radius:18px;
  background:linear-gradient(
    145deg,
    #ffe082,
    #d4a72c,
    #8f6b12
  );
  color:#050505;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:900;
  box-shadow:0 8px 25px rgba(212,167,44,.18);
}

h1{
  text-align:center;
  font-size:23px;
  letter-spacing:1px;
}

.subtitle{
  text-align:center;
  color:#666;
  font-size:10px;
  margin-top:7px;
  margin-bottom:25px;
}

.input-group{
  margin-bottom:14px;
}

label{
  display:block;
  color:#777;
  font-size:9px;
  font-weight:bold;
  margin-bottom:7px;
  letter-spacing:.5px;
}

.input{
  width:100%;
  height:47px;
  border-radius:12px;
  border:1px solid #292929;
  background:#090909;
  color:#fff;
  padding:0 14px;
  outline:none;
  font-size:12px;
}

.input::placeholder{
  color:#555;
}

.input:focus{
  border-color:#d4a72c;
  box-shadow:0 0 0 2px rgba(212,167,44,.06);
}

.password-wrap{
  position:relative;
}

.password-wrap .input{
  padding-right:50px;
}

.show-password{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:none;
  color:#777;
  cursor:pointer;
  font-size:15px;
}

.show-password:hover{
  color:#d4a72c;
}

.login-btn{
  width:100%;
  height:48px;
  margin-top:8px;
  border-radius:12px;
  border:1px solid rgba(212,167,44,.4);
  background:linear-gradient(
    145deg,
    #e6bd4b,
    #b88918
  );
  color:#080808;
  font-size:11px;
  font-weight:900;
  cursor:pointer;
}

.login-btn:active{
  transform:scale(.98);
}

.message{
  display:none;
  margin-top:13px;
  padding:11px;
  border-radius:10px;
  text-align:center;
  font-size:10px;
  line-height:1.4;
}

.message.error{
  display:block;
  color:#ff7777;
  background:rgba(255,80,80,.07);
  border:1px solid rgba(255,80,80,.18);
}

.message.success{
  display:block;
  color:#58d88a;
  background:rgba(88,216,138,.07);
  border:1px solid rgba(88,216,138,.18);
}

.register{
  text-align:center;
  margin-top:20px;
  color:#666;
  font-size:10px;
}

.register a{
  color:#d4a72c;
  text-decoration:none;
  font-weight:bold;
}

.register a:hover{
  text-decoration:underline;
}

.footer{
  text-align:center;
  color:#3f3f3f;
  font-size:8px;
  margin-top:22px;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo-wrap">
    <div class="logo">LC</div>
  </div>

  <h1>Welcome Back</h1>

  <div class="subtitle">
    Login to your LINKCASH account
  </div>

  <form id="loginForm">

    <div class="input-group">

      <label>
        USERNAME
      </label>

      <input
        id="username"
        class="input"
        type="text"
        placeholder="Enter username"
        autocomplete="username"
        required
      >

    </div>


    <div class="input-group">

      <label>
        PASSWORD
      </label>

      <div class="password-wrap">

        <input
          id="password"
          class="input"
          type="password"
          placeholder="Enter password"
          autocomplete="current-password"
          required
        >

        <button
          type="button"
          class="show-password"
          onclick="togglePassword()">
          👁
        </button>

      </div>

    </div>


    <button
      type="submit"
      class="login-btn">
      LOGIN
    </button>

  </form>


  <div
    id="message"
    class="message">
  </div>


  <div class="register">

    Don't have an account?

    <a href="register.html">
      Create Account
    </a>

  </div>


  <div class="footer">
    © 2026 LINKCASH
  </div>

</div>


<script>

/* =========================================
   CEO ACCOUNT
========================================= */

const CEO_USERNAME = "ceo";

const CEO_PASSWORD = "LINKCASH@2026";


/* =========================================
   ELEMENTS
========================================= */

const loginForm =
  document.getElementById("loginForm");

const usernameInput =
  document.getElementById("username");

const passwordInput =
  document.getElementById("password");

const message =
  document.getElementById("message");


/* =========================================
   MESSAGE
========================================= */

function showMessage(
  text,
  type
){

  message.textContent = text;

  message.className =
    "message " + type;

}


/* =========================================
   SHOW / HIDE PASSWORD
========================================= */

function togglePassword(){

  if(
    passwordInput.type === "password"
  ){

    passwordInput.type = "text";

  }else{

    passwordInput.type = "password";

  }

}


/* =========================================
   GET USERS
========================================= */

function getUsers(){

  try{

    const saved =
      localStorage.getItem(
        "linkcashUsers"
      );

    if(!saved){

      return [];

    }

    const users =
      JSON.parse(saved);

    return Array.isArray(users)
      ? users
      : [];

  }catch(error){

    return [];

  }

}


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
  "submit",
  function(event){

    event.preventDefault();


    const username =
      usernameInput.value.trim();

    const password =
      passwordInput.value;


    if(
      !username ||
      !password
    ){

      showMessage(
        "Please enter username and password.",
        "error"
      );

      return;

    }


    /* =====================================
       CEO LOGIN
    ===================================== */

    if(
      username.toLowerCase()
      === CEO_USERNAME.toLowerCase()
      &&
      password === CEO_PASSWORD
    ){

      localStorage.setItem(
        "linkcashCEOLoggedIn",
        "true"
      );

      localStorage.setItem(
        "linkcashCEO",
        JSON.stringify({

          username:"ceo",

          role:"CEO",

          loggedInAt:
            new Date().toISOString()

        })
      );


      showMessage(
        "Login successful...",
        "success"
      );


      setTimeout(
        function(){

          window.location.href =
            "ceodashboard.html";

        },
        500
      );

      return;

    }


    /* =====================================
       NORMAL USER
    ===================================== */

    const users =
      getUsers();


    const user =
      users.find(function(item){

        return String(
          item.username || ""
        ).toLowerCase()
        ===
        username.toLowerCase();

      });


    if(!user){

      showMessage(
        "No account found with this username.",
        "error"
      );

      return;

    }


    /* =====================================
       PASSWORD
    ===================================== */

    const savedPassword =
      String(
        user.password || ""
      );


    if(
      savedPassword !==
      String(password)
    ){

      showMessage(
        "Incorrect password.",
        "error"
      );

      return;

    }


    /* =====================================
       USER STATUS
    ===================================== */

    const status =
      String(
        user.status || "pending"
      ).toLowerCase();


    if(
      status === "pending"
    ){

      localStorage.setItem(
        "linkcashUser",
        JSON.stringify(user)
      );

      showMessage(
        "Your account is still pending activation.",
        "error"
      );


      setTimeout(
        function(){

          window.location.href =
            "pending.html";

        },
        700
      );

      return;

    }


    if(
      status === "rejected"
    ){

      showMessage(
        "Your account/payment request was rejected.",
        "error"
      );

      return;

    }


    /* =====================================
       USER LOGIN SUCCESS
    ===================================== */

    localStorage.setItem(
      "linkcashLoggedIn",
      "true"
    );


    localStorage.setItem(
      "linkcashUser",
      JSON.stringify(user)
    );


    showMessage(
      "Login successful...",
      "success"
    );


    setTimeout(
      function(){

        window.location.href =
          "dashboard.html";

      },
      500
    );

  }
);

</script>

</body>
</html>
