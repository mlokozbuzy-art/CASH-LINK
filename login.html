<script>

/* =========================================
   CEO ACCOUNT
========================================= */

const CEO_USERNAME = "ceo";
const CEO_PASSWORD = "CEO12345";


/* =========================================
   ELEMENTS
========================================= */

const loginForm =
    document.getElementById("loginForm");

const usernameInput =
    document.getElementById("username");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const message =
    document.getElementById("message");

const remember =
    document.getElementById("remember");


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type){

    message.className =
        "message " + type;

    message.textContent =
        text;

}

function hideMessage(){

    message.className =
        "message";

    message.textContent =
        "";

}


/* =========================================
   GET REGISTERED ACCOUNT
   REGISTER.HTML SAVES:
   linkcashAccount
========================================= */

function getRegisteredAccount(){

    try{

        const data =
            localStorage.getItem(
                "linkcashAccount"
            );

        if(!data){
            return null;
        }

        const account =
            JSON.parse(data);

        if(
            !account ||
            typeof account !== "object"
        ){

            return null;

        }

        return account;

    }catch(error){

        console.log(
            "Account read error:",
            error
        );

        return null;

    }

}


/* =========================================
   FIND USER
========================================= */

function findUser(username,password){

    const account =
        getRegisteredAccount();

    if(!account){
        return null;
    }


    const savedUsername =
        String(
            account.username || ""
        )
        .trim()
        .toLowerCase();


    const enteredUsername =
        String(
            username || ""
        )
        .trim()
        .toLowerCase();


    const savedPassword =
        String(
            account.password || ""
        );


    const enteredPassword =
        String(
            password || ""
        );


    if(
        savedUsername ===
        enteredUsername
        &&
        savedPassword ===
        enteredPassword
    ){

        return account;

    }


    return null;

}


/* =========================================
   CEO LOGIN
========================================= */

function loginCEO(username){

    localStorage.setItem(
        "linkcashCEOLoggedIn",
        "true"
    );


    localStorage.setItem(
        "linkcashCEO",
        JSON.stringify({

            username:
                CEO_USERNAME,

            role:
                "ceo",

            loginAt:
                new Date().toISOString()

        })
    );


    localStorage.setItem(
        "linkcashLoggedIn",
        "true"
    );


    localStorage.setItem(
        "linkcashLoggedInUser",
        JSON.stringify({

            username:
                username,

            role:
                "ceo"

        })
    );


    window.location.replace(
        "ceodashboard.html"
    );

}


/* =========================================
   NORMAL USER LOGIN
========================================= */

function loginUser(user){

    /*
       SAVE CURRENT LOGGED USER
    */

    localStorage.setItem(
        "linkcashLoggedIn",
        "true"
    );


    localStorage.setItem(
        "linkcashLoggedInUser",
        JSON.stringify(user)
    );


    localStorage.setItem(
        "linkcashUser",
        JSON.stringify(user)
    );


    /*
       KEEP ACCOUNT DATA UPDATED
    */

    localStorage.setItem(
        "linkcashAccount",
        JSON.stringify(user)
    );


    const status =
        String(
            user.status || "pending"
        )
        .trim()
        .toLowerCase();


    /* =====================================
       ACTIVE ACCOUNT
    ===================================== */

    if(
        status === "active"
        ||
        status === "activated"
    ){

        showMessage(
            "Login successful. Opening dashboard...",
            "success"
        );


        setTimeout(function(){

            window.location.replace(
                "dashboard.html"
            );

        },500);


        return;

    }


    /* =====================================
       REJECTED ACCOUNT
    ===================================== */

    if(
        status === "rejected"
    ){

        showMessage(
            "Your account requires attention. Opening account status...",
            "error"
        );


        setTimeout(function(){

            window.location.replace(
                "pending.html"
            );

        },700);


        return;

    }


    /* =====================================
       PENDING ACCOUNT
    ===================================== */

    showMessage(
        "Your account is still pending activation...",
        "success"
    );


    setTimeout(function(){

        window.location.replace(
            "pending.html"
        );

    },700);

}


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        hideMessage();


        const username =
            usernameInput.value.trim();


        const password =
            passwordInput.value;


        /* =================================
           VALIDATION
        ================================= */

        if(!username){

            showMessage(
                "Please enter your username.",
                "error"
            );

            usernameInput.focus();

            return;

        }


        if(!password){

            showMessage(
                "Please enter your password.",
                "error"
            );

            passwordInput.focus();

            return;

        }


        /* =================================
           LOADING
        ================================= */

        loginBtn.classList.add(
            "loading"
        );


        loginBtn.innerHTML =
            '<span class="loading-dot">●</span> SIGNING IN...';


        setTimeout(function(){


            /* =================================
               CEO LOGIN
            ================================= */

            if(
                username.toLowerCase()
                ===
                CEO_USERNAME.toLowerCase()
                &&
                password ===
                CEO_PASSWORD
            ){

                loginCEO(username);

                return;

            }


            /* =================================
               NORMAL USER
            ================================= */

            const user =
                findUser(
                    username,
                    password
                );


            /* =================================
               USER NOT FOUND
            ================================= */

            if(!user){

                loginBtn.classList.remove(
                    "loading"
                );


                loginBtn.textContent =
                    "LOGIN TO LINKCASH";


                showMessage(
                    "Username or password is incorrect.",
                    "error"
                );


                return;

            }


            /* =================================
               REMEMBER USERNAME
            ================================= */

            if(
                remember.checked
            ){

                localStorage.setItem(
                    "linkcashRememberedUsername",
                    username
                );

            }else{

                localStorage.removeItem(
                    "linkcashRememberedUsername"
                );

            }


            /* =================================
               LOGIN USER
            ================================= */

            loginUser(user);


        },350);

    }
);


/* =========================================
   SHOW / HIDE PASSWORD
========================================= */

document
.getElementById("togglePassword")
.addEventListener(
    "click",
    function(){

        if(
            passwordInput.type ===
            "password"
        ){

            passwordInput.type =
                "text";


            this.textContent =
                "🙈";


            this.setAttribute(
                "aria-label",
                "Hide password"
            );

        }else{

            passwordInput.type =
                "password";


            this.textContent =
                "👁";


            this.setAttribute(
                "aria-label",
                "Show password"
            );

        }

    }
);


/* =========================================
   FORGOT PASSWORD
========================================= */

function forgotPassword(event){

    event.preventDefault();


    showMessage(
        "Password recovery is not connected yet. Please contact LINKCASH support.",
        "error"
    );

}


/* =========================================
   LOAD REMEMBERED USERNAME
========================================= */

const remembered =
    localStorage.getItem(
        "linkcashRememberedUsername"
    );


if(remembered){

    usernameInput.value =
        remembered;


    remember.checked =
        true;


    passwordInput.focus();

}else{

    usernameInput.focus();

}

</script>
