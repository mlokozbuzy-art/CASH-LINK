<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LINKCASH - CEO Dashboard</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:#050505;
  color:#fff;
}

.topbar{
  height:68px;
  background:#0b0b0b;
  border-bottom:1px solid #242424;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 17px;
  position:sticky;
  top:0;
  z-index:10;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:41px;
  height:41px;
  border-radius:12px;
  background:linear-gradient(
    145deg,
    #ffe082,
    #d4a72c,
    #8f6b12
  );
  color:#050505;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:900;
}

.brand-name{
  font-size:16px;
  font-weight:900;
  letter-spacing:1.5px;
}

.ceo-badge{
  padding:8px 11px;
  border-radius:20px;
  background:rgba(212,167,44,.08);
  border:1px solid rgba(212,167,44,.25);
  color:#e0b83e;
  font-size:10px;
  font-weight:bold;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:25px 16px 50px;
}

.welcome{
  margin-bottom:20px;
}

.welcome small{
  color:#777;
  font-size:10px;
  letter-spacing:1px;
}

.welcome h1{
  margin-top:7px;
  font-size:26px;
}

.welcome p{
  margin-top:7px;
  color:#777;
  font-size:12px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:22px;
}

.stat{
  background:#101010;
  border:1px solid #292929;
  border-radius:16px;
  padding:16px;
}

.stat-label{
  color:#777;
  font-size:10px;
}

.stat-value{
  margin-top:7px;
  font-size:24px;
  font-weight:900;
}

.section{
  margin-top:22px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.section-title h2{
  font-size:17px;
}

.refresh{
  border:1px solid #292929;
  background:#101010;
  color:#aaa;
  padding:8px 11px;
  border-radius:9px;
  cursor:pointer;
  font-size:10px;
}

.request{
  background:#101010;
  border:1px solid #292929;
  border-radius:18px;
  padding:17px;
  margin-bottom:11px;
}

.request-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.user-name{
  font-size:15px;
  font-weight:bold;
}

.username{
  margin-top:4px;
  color:#777;
  font-size:10px;
}

.pending{
  padding:6px 9px;
  height:max-content;
  border-radius:15px;
  background:rgba(255,193,7,.08);
  border:1px solid rgba(255,193,7,.2);
  color:#e0b83e;
  font-size:9px;
  font-weight:bold;
}

.details{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
  margin-top:15px;
}

.detail{
  background:#080808;
  border:1px solid #222;
  border-radius:10px;
  padding:10px;
}

.detail-label{
  color:#666;
  font-size:9px;
}

.detail-value{
  margin-top:5px;
  color:#ddd;
  font-size:11px;
  word-break:break-word;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:14px;
}

.approve,
.reject{
  height:42px;
  border-radius:10px;
  border:0;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
}

.approve{
  background:#58d88a;
  color:#06100a;
}

.reject{
  background:#201010;
  border:1px solid #472323;
  color:#ff7777;
}

.empty{
  text-align:center;
  padding:35px 15px;
  background:#101010;
  border:1px solid #292929;
  border-radius:18px;
  color:#666;
  font-size:12px;
}

.logout{
  width:100%;
  height:43px;
  margin-top:25px;
  border:1px solid #292929;
  border-radius:10px;
  background:#101010;
  color:#888;
  cursor:pointer;
}

.footer{
  text-align:center;
  margin-top:20px;
  color:#444;
  font-size:10px;
}

@media(max-width:600px){

  .stats{
    grid-template-columns:1fr;
  }

  .details{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<header class="topbar">

  <div class="brand">

    <div class="logo">
      LC
    </div>

    <div class="brand-name">
      LINKCASH
    </div>

  </div>

  <div class="ceo-badge">
    CEO / ADMIN
  </div>

</header>


<main class="container">

  <section class="welcome">

    <small>
      MANAGEMENT PANEL
    </small>

    <h1>
      CEO Dashboard
    </h1>

    <p>
      Manage account activation and payment verification.
    </p>

  </section>


  <section class="stats">

    <div class="stat">

      <div class="stat-label">
        TOTAL USERS
      </div>

      <div
        class="stat-value"
        id="totalUsers"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        PAYMENT PENDING
      </div>

      <div
        class="stat-value"
        id="pendingPayments"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        ACTIVATED
      </div>

      <div
        class="stat-value"
        id="activeUsers"
      >
        0
      </div>

    </div>

  </section>


  <section class="section">

    <div class="section-title">

      <h2>
        Payment Verification
      </h2>

      <button
        class="refresh"
        onclick="loadDashboard()"
      >
        REFRESH
      </button>

    </div>


    <div id="requests"></div>

  </section>


  <button
    class="logout"
    onclick="logoutCEO()"
  >
    LOG OUT CEO
  </button>


  <div class="footer">
    © 2026 LINKCASH
  </div>

</main>


<script>

/* =========================================
   CEO SECURITY CHECK
========================================= */

if(
  localStorage.getItem(
    "linkcashCEOLoggedIn"
  ) !== "true"
){

  window.location.href =
    "ceo-login.html";

}


/* =========================================
   GET USERS
========================================= */

function getUsers(){

  try{

    const data =
      JSON.parse(
        localStorage.getItem(
          "linkcashUsers"
        ) || "[]"
      );

    return Array.isArray(data)
      ? data
      : [];

  }catch{

    return [];

  }

}


/* =========================================
   SAVE USERS
========================================= */

function saveUsers(users){

  localStorage.setItem(
    "linkcashUsers",
    JSON.stringify(users)
  );

}


/* =========================================
   DASHBOARD
========================================= */

function loadDashboard(){

  const users =
    getUsers();


  const total =
    users.length;


  const active =
    users.filter(
      user =>
        user.status === "active" ||
        user.status === "activated"
    ).length;


  const pending =
    users.filter(
      user =>
        user.paymentStatus ===
        "pending"
    ).length;


  document.getElementById(
    "totalUsers"
  ).textContent =
    total;


  document.getElementById(
    "activeUsers"
  ).textContent =
    active;


  document.getElementById(
    "pendingPayments"
  ).textContent =
    pending;


  renderRequests(users);

}


/* =========================================
   PAYMENT REQUESTS
========================================= */

function renderRequests(users){

  const box =
    document.getElementById(
      "requests"
    );


  const pendingUsers =
    users.filter(
      user =>
        user.paymentStatus ===
        "pending"
    );


  if(!pendingUsers.length){

    box.innerHTML = `
      <div class="empty">
        No payment requests are waiting for verification.
      </div>
    `;

    return;

  }


  box.innerHTML =
    pendingUsers
      .map(
        function(user){

          return `

            <div class="request">

              <div class="request-top">

                <div>

                  <div class="user-name">
                    ${escapeHTML(
                      user.fullname || "Unknown User"
                    )}
                  </div>

                  <div class="username">
                    @${escapeHTML(
                      user.username || ""
                    )}
                  </div>

                </div>

                <div class="pending">
                  PAYMENT PENDING
                </div>

              </div>


              <div class="details">

                <div class="detail">

                  <div class="detail-label">
                    AMOUNT
                  </div>

                  <div class="detail-value">
                    TZS ${Number(
                      user.activationFee || 14500
                    ).toLocaleString()}
                  </div>

                </div>


                <div class="detail">

                  <div class="detail-label">
                    METHOD
                  </div>

                  <div class="detail-value">
                    ${escapeHTML(
                      user.paymentMethod || "—"
                    )}
                  </div>

                </div>


                <div class="detail">

                  <div class="detail-label">
                    TRANSACTION
                  </div>

                  <div class="detail-value">
                    ${escapeHTML(
                      user.paymentReference || "—"
                    )}
                  </div>

                </div>


                <div class="detail">

                  <div class="detail-label">
                    PHONE
                  </div>

                  <div class="detail-value">
                    ${escapeHTML(
                      user.phone || "—"
                    )}
                  </div>

                </div>

              </div>


              <div class="actions">

                <button
                  class="approve"
                  onclick="approveUser('${escapeJS(
                    user.username
                  )}')"
                >
                  ✓ APPROVE
                </button>


                <button
                  class="reject"
                  onclick="rejectUser('${escapeJS(
                    user.username
                  )}')"
                >
                  ✕ REJECT
                </button>

              </div>

            </div>

          `;

        }
      )
      .join("");

}


/* =========================================
   APPROVE
========================================= */

function approveUser(username){

  if(
    !confirm(
      "Approve this payment and activate the account?"
    )
  ){

    return;

  }


  const users =
    getUsers();


  const updated =
    users.map(
      function(user){

        if(
          String(
            user.username
          ).toLowerCase()
          ===
          String(
            username
          ).toLowerCase()
        ){

          return {

            ...user,

            status:
              "active",

            paymentStatus:
              "verified",

            activatedAt:
              new Date().toISOString()

          };

        }

        return user;

      }
    );


  saveUsers(updated);


  loadDashboard();


  alert(
    "Account activated successfully."
  );

}


/* =========================================
   REJECT
========================================= */

function rejectUser(username){

  if(
    !confirm(
      "Reject this payment verification?"
    )
  ){

    return;

  }


  const users =
    getUsers();


  const updated =
    users.map(
      function(user){

        if(
          String(
            user.username
          ).toLowerCase()
          ===
          String(
            username
          ).toLowerCase()
        ){

          return {

            ...user,

            status:
              "pending",

            paymentStatus:
              "rejected"

          };

        }

        return user;

      }
    );


  saveUsers(updated);


  loadDashboard();


  alert(
    "Payment rejected."
  );

}


/* =========================================
   LOGOUT
========================================= */

function logoutCEO(){

  localStorage.removeItem(
    "linkcashCEOLoggedIn"
  );

  localStorage.removeItem(
    "linkcashCEO"
  );


  window.location.href =
    "ceo-login.html";

}


/* =========================================
   HTML SAFETY
========================================= */

function escapeHTML(value){

  return String(
    value || ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function escapeJS(value){

  return String(
    value || ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  );

}


/* =========================================
   START
========================================= */

loadDashboard();

</script>

</body>
</html>
