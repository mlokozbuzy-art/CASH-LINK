<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LINKCASH - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:#050505;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.wrapper{
  width:100%;
  max-width:430px;
}

.brand{
  text-align:center;
  margin-bottom:25px;
}

.logo{
  width:70px;
  height:70px;
  margin:auto;
  border-radius:20px;
  background:linear-gradient(145deg,#ffe082,#d4a72c,#8f6b12);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#090909;
  font-size:24px;
  font-weight:900;
  box-shadow:0 0 25px rgba(212,167,44,.25);
}

.brand h1{
  margin-top:13px;
  font-size:28px;
  letter-spacing:3px;
}

.brand p{
  margin-top:7px;
  color:#8d8d8d;
  font-size:13px;
}

.card{
  background:#101010;
  border:1px solid #292929;
  border-radius:24px;
  padding:28px 22px;
  box-shadow:0 25px 70px rgba(0,0,0,.6);
}

.title{
  margin-bottom:23px;
}

.title h2{
  font-size:23px;
  margin-bottom:7px;
}

.title p{
  color:#858585;
  font-size:13px;
  line-height:1.5;
}

.field{
  margin-bottom:17px;
}

.field label{
  display:block;
  color:#cfcfcf;
  font-size:13px;
  margin-bottom:8px;
}

input{
  width:100%;
  height:50px;
  background:#070707;
  border:1px solid #292929;
  border-radius:12px;
  color:#fff;
  outline:none;
  padding:0 15px;
  font-size:14px;
}

input::placeholder{
  color:#555;
}

input:focus{
  border-color:#d4a72c;
  box-shadow:0 0 0 2px rgba(212,167,44,.08);
}

.password-wrap{
  position:relative;
}

.password-wrap input{
  padding-right:65px;
}

.show-password{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  background:none;
  border:none;
  color:#d4a72c;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
}

.login-btn{
  width:100%;
  height:53px;
  margin-top:5px;
  border:none;
  border-radius:13px;
  background:linear-gradient(135deg,#ffe082,#d4a72c,#a77b17);
  color:#080808;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
}

.login-btn:active{
  transform:scale(.98);
}

.login-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  margin-top:15px;
  padding:13px;
  border-radius:10px;
  text-align:center;
  font-size:12px;
  line-height:1.5;
}

.message.success{
  display:block;
  background:rgba(40,180,100,.10);
  border:1px solid rgba(40,180,100,.3);
  color:#62df91;
}

.message.error{
  display:block;
  background:rgba(220,60,60,.10);
  border:1px solid rgba(220,60,60,.3);
  color:#ff7777;
}

.message.pending{
  display:block;
  background:rgba(212,167,44,.08);
  border:1px solid rgba(212,167,44,.25);
  color:#e6c65c;
}

.message.rejected{
  display:block;
  background:rgba(220,60,60,.10);
  border:1px solid rgba(220,60,60,.3);
  color:#ff7777;
}

.register{
  text-align:center;
  margin-top:23px;
  padding-top:20px;
  border-top:1px solid #222;
  color:#777;
  font-size:13px;
}

.register a{
  color:#e0b83e;
  text-decoration:none;
  font-weight:bold;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#686868;
  text-decoration:none;
  font-size:12px;
}

.footer{
  text-align:center;
  margin-top:18px;
  color:#444;
  font-size:11px;
}

.connection{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  margin-top:13px;
  color:#555;
  font-size:9px;
}

.connection-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#777;
}

.connection-dot.online{
  background:#58d88a;
  box-shadow:0 0 8px rgba(88,216,138,.5);
}

.connection-dot.error{
  background:#ff5555;
}
</style>

</head>

<body>

<div class="wrapper">

  <div class="brand">

    <div class="logo">
      LC
    </div>

    <h1>LINKCASH</h1>

    <p>Simple. Secure. Connected.</p>

  </div>


  <div class="card">

    <div class="title">

      <h2>Welcome Back</h2>

      <p>
        Login to your LINKCASH account.
      </p>

    </div>


    <form id="loginForm" novalidate>

      <div class="field">

        <label>Username</label>

        <input
          type="text"
          id="username"
          placeholder="Enter your username"
          autocomplete="username"
          required
        >

      </div>


      <div class="field">

        <label>Password</label>

        <div class="password-wrap">

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="show-password"
            id="showPassword"
          >
            SHOW
          </button>

        </div>

      </div>


      <button
        type="submit"
        class="login-btn"
        id="loginBtn"
      >
        LOGIN
      </button>

    </form>


    <div
      class="message"
      id="message"
    ></div>


    <div class="connection">

      <div
        class="connection-dot"
        id="connectionDot"
      ></div>

      <span id="connectionText">
        CHECKING SUPABASE...
      </span>

    </div>


    <div class="register">

      Don't have an account?

      <a href="register.html">
        Create Account
      </a>

    </div>

  </div>


  <a href="index.html" class="back">
    ← Back to Home
  </a>


  <div class="footer">
    © 2026 LINKCASH
  </div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://vrrglcpixeqnqqdlqtot.supabase.co";

const SUPABASE_KEY =
"sb_publishable_CyKL7kpQ2K5AdosXfebJCg_k-uF8OpV";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================
   ELEMENTS
========================================= */

const form =
document.getElementById("loginForm");

const usernameInput =
document.getElementById("username");

const passwordInput =
document.getElementById("password");

const button =
document.getElementById("loginBtn");

const message =
document.getElementById("message");

const showPassword =
document.getElementById("showPassword");

const connectionDot =
document.getElementById("connectionDot");

const connectionText =
document.getElementById("connectionText");


/* =========================================
   SHOW PASSWORD
========================================= */

showPassword.addEventListener("click",function(){

  if(passwordInput.type === "password"){

    passwordInput.type = "text";

    showPassword.textContent = "HIDE";

  }else{

    passwordInput.type = "password";

    showPassword.textContent = "SHOW";

  }

});


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type){

  message.className =
    "message " + type;

  message.textContent =
    text;

  message.style.display =
    "block";

}


function clearMessage(){

  message.className =
    "message";

  message.textContent =
    "";

  message.style.display =
    "none";

}


/* =========================================
   CONNECTION CHECK
========================================= */

async function checkConnection(){

  try{

    const { error } =
      await supabaseClient
      .from("users")
      .select("id")
      .limit(1);

    if(error){

      connectionDot.className =
        "connection-dot error";

      connectionText.textContent =
        "DATABASE CONNECTION ERROR";

      console.error(error);

      return;

    }

    connectionDot.className =
      "connection-dot online";

    connectionText.textContent =
      "SUPABASE CONNECTED";

  }catch(error){

    connectionDot.className =
      "connection-dot error";

    connectionText.textContent =
      "SUPABASE CONNECTION FAILED";

    console.error(error);

  }

}


/* =========================================
   SAVE USER
========================================= */

function saveUser(user){

  const cleanUser = {

    id:
      user.id || "",

    fullname:
      user.fullname ||
      user.full_name ||
      "",

    username:
      user.username ||
      "",

    phone:
      user.phone ||
      "",

    email:
      user.email ||
      "",

    referrer:
      user.referrer ||
      null,

    status:
      String(
        user.status || "pending"
      )
      .trim()
      .toLowerCase(),

    balance:
      Number(
        user.balance || 0
      ),

    commission:
      Number(
        user.commission || 0
      )

  };


  localStorage.setItem(
    "linkcashUser",
    JSON.stringify(cleanUser)
  );

  localStorage.setItem(
    "linkcashLoggedIn",
    "true"
  );

}


/* =========================================
   LOGIN
========================================= */

form.addEventListener(
"submit",
async function(event){

  event.preventDefault();

  clearMessage();

  const username =
    usernameInput.value
    .trim()
    .toLowerCase();

  const password =
    passwordInput.value;


  /* ==============================
     VALIDATION
  ============================== */

  if(!username){

    showMessage(
      "Please enter your username.",
      "error"
    );

    usernameInput.focus();

    return;
  }


  if(!password){

    showMessage(
      "Please enter your password.",
      "error"
    );

    passwordInput.focus();

    return;
  }


  button.disabled = true;

  button.textContent =
    "LOGGING IN...";


  try{


    /* ==============================
       CEO LOGIN
    ============================== */

    if(
      username === "ceo" &&
      password === "CEO@2026"
    ){

      localStorage.setItem(
        "linkcashCEOLoggedIn",
        "true"
      );

      localStorage.setItem(
        "linkcashCEO",
        JSON.stringify({
          username:"CEO",
          role:"CEO"
        })
      );


      showMessage(
        "CEO login successful ✓",
        "success"
      );

      button.textContent =
        "LOGIN SUCCESSFUL ✓";


      setTimeout(function(){

        window.location.href =
          "ceodashboard.html";

      },600);


      return;
    }


    /* ==============================
       SEARCH USER
    ============================== */

    const result =
      await supabaseClient
      .from("users")
      .select("*")
      .eq("username",username)
      .maybeSingle();


    if(result.error){

      console.error(
        "SUPABASE ERROR:",
        result.error
      );

      throw new Error(
        "Database error: " +
        result.error.message
      );

    }


    /* ==============================
       USER NOT FOUND
    ============================== */

    if(!result.data){

      throw new Error(
        "Incorrect username or password."
      );

    }


    const user =
      result.data;


    /* ==============================
       PASSWORD
    ============================== */

    if(
      String(user.password || "") !==
      String(password)
    ){

      throw new Error(
        "Incorrect username or password."
      );

    }


    /* ==============================
       STATUS
    ============================== */

    const status =
      String(
        user.status || "pending"
      )
      .trim()
      .toLowerCase();


    /* ==============================
       REJECTED
    ============================== */

    if(status === "rejected"){

      saveUser(user);

      showMessage(
        "Your account has been rejected. Please contact LINKCASH support.",
        "rejected"
      );

      button.disabled = false;

      button.textContent =
        "LOGIN";

      return;
    }


    /* ==============================
       PENDING
    ============================== */

    if(
      status === "pending" ||
      status === "payment_pending" ||
      status === "inactive" ||
      status === "non-active" ||
      status === "not_activated"
    ){

      saveUser(user);

      showMessage(
        "Your account is waiting for CEO approval.",
        "pending"
      );

      button.textContent =
        "ACCOUNT PENDING";


      setTimeout(function(){

        window.location.href =
          "pending-dashboard.html";

      },900);


      return;
    }


    /* ==============================
       ACTIVE
    ============================== */

    if(
      status === "active" ||
      status === "activated"
    ){

      saveUser(user);

      showMessage(
        "Login successful ✓",
        "success"
      );

      button.textContent =
        "LOGIN SUCCESSFUL ✓";


      setTimeout(function(){

        window.location.href =
          "dashboard.html";

      },700);


      return;
    }


    /* ==============================
       UNKNOWN STATUS
    ============================== */

    saveUser(user);

    showMessage(
      "Your account is waiting for approval.",
      "pending"
    );

    button.textContent =
      "ACCOUNT PENDING";


    setTimeout(function(){

      window.location.href =
        "pending-dashboard.html";

    },900);


  }catch(error){

    console.error(
      "LOGIN ERROR:",
      error
    );

    showMessage(
      error.message ||
      "Login failed. Please try again.",
      "error"
    );

    button.disabled = false;

    button.textContent =
      "LOGIN";

  }

});


/* =========================================
   START
========================================= */

checkConnection();

</script>

</body>
</html>
