<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>LINKCASH - Create Account</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:#050505;
  color:#fff;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:20px;
}

.wrapper{
  width:100%;
  max-width:430px;
}

.brand{
  text-align:center;
  margin-bottom:22px;
}

.logo{
  width:68px;
  height:68px;

  margin:auto;

  border-radius:19px;

  background:
    linear-gradient(
      145deg,
      #ffe082,
      #d4a72c,
      #8f6b12
    );

  display:flex;
  align-items:center;
  justify-content:center;

  color:#090909;

  font-size:23px;
  font-weight:900;

  box-shadow:
    0 0 25px
    rgba(212,167,44,.25);
}

.brand h1{
  margin-top:12px;

  font-size:27px;

  letter-spacing:3px;
}

.brand p{
  margin-top:6px;

  color:#888;

  font-size:13px;
}

.card{
  background:#101010;

  border:1px solid #292929;

  border-radius:24px;

  padding:26px 22px;

  box-shadow:
    0 25px 70px
    rgba(0,0,0,.65);
}

.title{
  margin-bottom:22px;
}

.title h2{
  font-size:23px;

  margin-bottom:7px;
}

.title p{
  color:#858585;

  font-size:13px;

  line-height:1.5;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;

  color:#cfcfcf;

  font-size:13px;

  margin-bottom:7px;
}

input{
  width:100%;

  height:49px;

  background:#070707;

  border:1px solid #292929;

  border-radius:12px;

  color:#fff;

  outline:none;

  padding:0 14px;

  font-size:14px;

  transition:.2s;
}

input::placeholder{
  color:#555;
}

input:focus{
  border-color:#d4a72c;

  box-shadow:
    0 0 0 2px
    rgba(212,167,44,.08);
}

.password-wrap{
  position:relative;
}

.password-wrap input{
  padding-right:65px;
}

.show-password{
  position:absolute;

  right:11px;

  top:50%;

  transform:translateY(-50%);

  background:none;

  border:none;

  color:#d4a72c;

  font-size:11px;

  font-weight:bold;

  cursor:pointer;
}

.register-btn{
  width:100%;

  height:53px;

  margin-top:6px;

  border:none;

  border-radius:13px;

  background:
    linear-gradient(
      135deg,
      #ffe082,
      #d4a72c,
      #a77b17
    );

  color:#080808;

  font-size:15px;

  font-weight:900;

  cursor:pointer;

  box-shadow:
    0 10px 25px
    rgba(212,167,44,.16);
}

.register-btn:active{
  transform:scale(.98);
}

.register-btn:disabled{
  opacity:.6;

  cursor:not-allowed;
}

.message{
  display:none;

  margin-top:15px;

  padding:13px;

  border-radius:10px;

  text-align:center;

  font-size:12px;

  line-height:1.5;
}

.message.success{
  display:block;

  background:
    rgba(40,180,100,.10);

  border:
    1px solid
    rgba(40,180,100,.30);

  color:#62df91;
}

.message.error{
  display:block;

  background:
    rgba(220,60,60,.10);

  border:
    1px solid
    rgba(220,60,60,.30);

  color:#ff7777;
}

.message.info{
  display:block;

  background:
    rgba(212,167,44,.08);

  border:
    1px solid
    rgba(212,167,44,.25);

  color:#e6c65c;
}

.login-link{
  text-align:center;

  margin-top:21px;

  padding-top:19px;

  border-top:1px solid #222;

  color:#777;

  font-size:13px;
}

.login-link a{
  color:#e0b83e;

  text-decoration:none;

  font-weight:bold;
}

.back{
  display:block;

  text-align:center;

  margin-top:17px;

  color:#686868;

  text-decoration:none;

  font-size:12px;
}

.footer{
  text-align:center;

  margin-top:17px;

  color:#444;

  font-size:11px;
}

.code-box{
  display:flex;
  align-items:center;
  gap:8px;
}

.code-box input{
  flex:1;
}

.generate{
  height:49px;

  padding:0 12px;

  border:1px solid #3b3b3b;

  border-radius:11px;

  background:#171717;

  color:#d4a72c;

  font-size:11px;

  font-weight:bold;

  cursor:pointer;
}

.small-note{
  margin-top:6px;

  color:#555;

  font-size:10px;
}

</style>

</head>


<body>


<div class="wrapper">


<!-- BRAND -->

<div class="brand">

  <div class="logo">
    LC
  </div>

  <h1>
    LINKCASH
  </h1>

  <p>
    Simple. Secure. Connected.
  </p>

</div>


<!-- CARD -->

<div class="card">


  <div class="title">

    <h2>
      Create Account
    </h2>

    <p>
      Create your LINKCASH account to get started.
    </p>

  </div>


  <form id="registerForm">


    <!-- FULL NAME -->

    <div class="field">

      <label>
        Full Name
      </label>

      <input
        type="text"
        id="fullname"
        placeholder="Enter your full name"
        autocomplete="name"
        required
      >

    </div>


    <!-- USERNAME -->

    <div class="field">

      <label>
        Username
      </label>

      <input
        type="text"
        id="username"
        placeholder="Choose your username"
        autocomplete="username"
        required
      >

    </div>


    <!-- PHONE -->

    <div class="field">

      <label>
        Phone Number
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="Enter your phone number"
        autocomplete="tel"
        required
      >

    </div>


    <!-- REFERRER -->

    <div class="field">

      <label>
        Referral Username
      </label>

      <input
        type="text"
        id="referrer"
        placeholder="Enter referral username (optional)"
      >

    </div>


    <!-- PASSWORD -->

    <div class="field">

      <label>
        Password
      </label>

      <div class="password-wrap">

        <input
          type="password"
          id="password"
          placeholder="Create password"
          autocomplete="new-password"
          required
        >

        <button
          type="button"
          class="show-password"
          id="showPassword"
        >
          SHOW
        </button>

      </div>

    </div>


    <!-- CONFIRM PASSWORD -->

    <div class="field">

      <label>
        Confirm Password
      </label>

      <div class="password-wrap">

        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm password"
          autocomplete="new-password"
          required
        >

        <button
          type="button"
          class="show-password"
          id="showConfirmPassword"
        >
          SHOW
        </button>

      </div>

    </div>


    <!-- REGISTER CODE -->

    <div class="field">

      <label>
        Register Code
      </label>

      <div class="code-box">

        <input
          type="text"
          id="registerCode"
          readonly
        >

        <button
          type="button"
          class="generate"
          id="generateCode"
        >
          NEW CODE
        </button>

      </div>

      <div class="small-note">
        Your unique LINKCASH registration code.
      </div>

    </div>


    <!-- BUTTON -->

    <button
      type="submit"
      class="register-btn"
      id="registerBtn"
    >
      CREATE ACCOUNT
    </button>


  </form>


  <!-- MESSAGE -->

  <div
    class="message"
    id="message"
  ></div>


  <!-- LOGIN -->

  <div class="login-link">

    Already have an account?

    <a href="login.html">
      Login
    </a>

  </div>


</div>


<!-- BACK -->

<a
  href="index.html"
  class="back"
>
  ← Back to Home
</a>


<div class="footer">
  © 2026 LINKCASH
</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://vrrglcpixeqnqqdlqtot.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_CyKL7kpQ2K5AdosXfebJCg_k-uF8OpV";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   ELEMENTS
===================================================== */

const form =
  document.getElementById(
    "registerForm"
  );

const button =
  document.getElementById(
    "registerBtn"
  );

const message =
  document.getElementById(
    "message"
  );

const password =
  document.getElementById(
    "password"
  );

const confirmPassword =
  document.getElementById(
    "confirmPassword"
  );

const showPassword =
  document.getElementById(
    "showPassword"
  );

const showConfirmPassword =
  document.getElementById(
    "showConfirmPassword"
  );

const registerCode =
  document.getElementById(
    "registerCode"
  );

const generateCode =
  document.getElementById(
    "generateCode"
  );


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  type
){

  message.className =
    "message " + type;

  message.textContent =
    text;

  message.style.display =
    "block";

}


function clearMessage(){

  message.style.display =
    "none";

  message.textContent =
    "";

}


/* =====================================================
   PASSWORD SHOW/HIDE
===================================================== */

showPassword.addEventListener(
  "click",
  function(){

    if(
      password.type ===
      "password"
    ){

      password.type =
        "text";

      showPassword.textContent =
        "HIDE";

    }else{

      password.type =
        "password";

      showPassword.textContent =
        "SHOW";

    }

  }
);


showConfirmPassword.addEventListener(
  "click",
  function(){

    if(
      confirmPassword.type ===
      "password"
    ){

      confirmPassword.type =
        "text";

      showConfirmPassword.textContent =
        "HIDE";

    }else{

      confirmPassword.type =
        "password";

      showConfirmPassword.textContent =
        "SHOW";

    }

  }
);


/* =====================================================
   GENERATE REGISTER CODE
===================================================== */

function createRegisterCode(){

  const random =
    Math.random()
      .toString(36)
      .substring(2,8)
      .toUpperCase();

  return "LC-" + random;

}


function setRegisterCode(){

  registerCode.value =
    createRegisterCode();

}


generateCode.addEventListener(
  "click",
  function(){

    setRegisterCode();

  }
);


/* =====================================================
   INITIAL CODE
===================================================== */

setRegisterCode();


/* =====================================================
   NORMALIZE USERNAME
===================================================== */

function cleanUsername(
  value
){

  return value
    .trim()
    .toLowerCase()
    .replace(/\s+/g,"");

}


/* =====================================================
   REGISTER
===================================================== */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    clearMessage();


    /* ===============================================
       GET VALUES
    =============================================== */

    const fullname =
      document
      .getElementById("fullname")
      .value
      .trim();

    const username =
      cleanUsername(
        document
        .getElementById("username")
        .value
      );

    const phone =
      document
      .getElementById("phone")
      .value
      .trim();

    const referrer =
      cleanUsername(
        document
        .getElementById("referrer")
        .value
      );

    const pass =
      password.value;

    const confirm =
      confirmPassword.value;

    const code =
      registerCode.value;


    /* ===============================================
       VALIDATION
    =============================================== */

    if(!fullname){

      showMessage(
        "Please enter your full name.",
        "error"
      );

      return;

    }


    if(!username){

      showMessage(
        "Please choose a username.",
        "error"
      );

      return;

    }


    if(username.length < 3){

      showMessage(
        "Username must contain at least 3 characters.",
        "error"
      );

      return;

    }


    if(!phone){

      showMessage(
        "Please enter your phone number.",
        "error"
      );

      return;

    }


    if(!pass){

      showMessage(
        "Please create a password.",
        "error"
      );

      return;

    }


    if(pass.length < 6){

      showMessage(
        "Password must contain at least 6 characters.",
        "error"
      );

      return;

    }


    if(pass !== confirm){

      showMessage(
        "Passwords do not match.",
        "error"
      );

      return;

    }


    /* ===============================================
       LOADING
    =============================================== */

    button.disabled =
      true;

    button.textContent =
      "CREATING ACCOUNT...";


    try{


      /* =============================================
         CHECK USERNAME
         
         We only query after validation.
      ============================================= */

      const existing =
        await supabaseClient
        .from("users")
        .select("id")
        .eq(
          "username",
          username
        )
        .limit(1);


      if(existing.error){

        console.error(
          existing.error
        );

        throw new Error(
          "Cannot connect to LINKCASH database. Please check your Supabase table and RLS policies."
        );

      }


      if(
        existing.data &&
        existing.data.length > 0
      ){

        throw new Error(
          "This username is already registered."
        );

      }


      /* =============================================
         CREATE USER
      ============================================= */

      const insertResult =
        await supabaseClient
        .from("users")
        .insert([

          {

            full_name:
              fullname,

            username:
              username,

            phone:
              phone,

            password:
              pass,

            referrer:
              referrer || null,

            status:
              "pending",

            balance:
              0,

            commission:
              0,

            activation_fee:
              14500,

            payment_status:
              "unpaid"

          }

        ])
        .select()
        .single();


      /* =============================================
         INSERT ERROR
      ============================================= */

      if(insertResult.error){

        console.error(
          "REGISTER ERROR:",
          insertResult.error
        );


        let errorText =
          insertResult.error.message ||
          "Registration failed.";


        if(
          errorText
          .toLowerCase()
          .includes("row-level security")
        ){

          errorText =
            "Registration blocked by Supabase RLS policy. Enable INSERT permission for the users table.";

        }


        throw new Error(
          errorText
        );

      }


      /* =============================================
         SUCCESS
      ============================================= */

      showMessage(
        "Account created successfully ✓ Your account is waiting for CEO approval.",
        "success"
      );


      button.textContent =
        "ACCOUNT CREATED ✓";


      /* =============================================
         SAVE BASIC REGISTRATION INFO
      ============================================= */

      localStorage.setItem(
        "linkcashRegistrationCode",
        code
      );


      localStorage.setItem(
        "linkcashRegisteredUsername",
        username
      );


      /* =============================================
         REDIRECT LOGIN
      ============================================= */

      setTimeout(
        function(){

          window.location.href =
            "login.html";

        },
        1800
      );


    }catch(error){

      console.error(
        "LINKCASH REGISTRATION FAILED:",
        error
      );


      showMessage(
        error.message ||
        "Registration failed. Please try again.",
        "error"
      );


      button.disabled =
        false;

      button.textContent =
        "CREATE ACCOUNT";

    }

  });

</script>

</body>

</html>
