<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LINKCASH - Create Account</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,Helvetica,sans-serif;
}

body{
min-height:100vh;
background:#050505;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.wrapper{
width:100%;
max-width:430px;
}

.brand{
text-align:center;
margin-bottom:24px;
}

.logo{
width:68px;
height:68px;
margin:auto;
border-radius:19px;
background:linear-gradient(
145deg,
#ffe082,
#d4a72c,
#8f6b12
);
display:flex;
align-items:center;
justify-content:center;
color:#080808;
font-size:23px;
font-weight:900;
box-shadow:0 0 30px rgba(212,167,44,.20);
}

.brand h1{
margin-top:12px;
font-size:27px;
letter-spacing:3px;
}

.brand p{
margin-top:7px;
color:#777;
font-size:12px;
}

.card{
background:#101010;
border:1px solid #292929;
border-radius:23px;
padding:27px 22px;
box-shadow:0 25px 70px rgba(0,0,0,.65);
}

.title{
margin-bottom:21px;
}

.title h2{
font-size:22px;
margin-bottom:7px;
}

.title p{
color:#777;
font-size:13px;
line-height:1.5;
}

.fee-box{
margin-bottom:18px;
padding:14px;
border-radius:13px;
background:rgba(212,167,44,.06);
border:1px solid rgba(212,167,44,.18);
text-align:center;
}

.fee-box small{
display:block;
color:#777;
font-size:9px;
margin-bottom:5px;
}

.fee-box strong{
color:#d4a72c;
font-size:20px;
}

.field{
margin-bottom:15px;
}

.field label{
display:block;
color:#ccc;
font-size:13px;
margin-bottom:7px;
}

input{
width:100%;
height:49px;
background:#070707;
border:1px solid #292929;
border-radius:11px;
color:#fff;
outline:none;
padding:0 14px;
font-size:14px;
}

input::placeholder{
color:#555;
}

input:focus{
border-color:#d4a72c;
box-shadow:
0 0 0 2px rgba(212,167,44,.08);
}

.password-wrap{
position:relative;
}

.password-wrap input{
padding-right:60px;
}

.show-password{
position:absolute;
right:11px;
top:50%;
transform:translateY(-50%);
border:none;
background:none;
color:#d4a72c;
font-size:11px;
font-weight:bold;
cursor:pointer;
}

.register-btn{
width:100%;
height:52px;
margin-top:4px;
border:none;
border-radius:13px;
background:linear-gradient(
135deg,
#ffe082,
#d4a72c,
#a77b17
);
color:#080808;
font-size:15px;
font-weight:900;
cursor:pointer;
}

.register-btn:active{
transform:scale(.98);
}

.register-btn:disabled{
opacity:.6;
cursor:not-allowed;
}

.message{
display:none;
margin-top:14px;
padding:12px;
border-radius:10px;
text-align:center;
font-size:12px;
line-height:1.5;
}

.message.success{
display:block;
color:#62df91;
background:rgba(40,180,100,.08);
border:1px solid rgba(40,180,100,.25);
}

.message.error{
display:block;
color:#ff7777;
background:rgba(220,60,60,.08);
border:1px solid rgba(220,60,60,.25);
}

.login{
text-align:center;
margin-top:21px;
padding-top:19px;
border-top:1px solid #222;
color:#777;
font-size:13px;
}

.login a{
color:#e0b83e;
text-decoration:none;
font-weight:bold;
}

.back{
display:block;
text-align:center;
margin-top:18px;
color:#666;
text-decoration:none;
font-size:12px;
}

.back:hover{
color:#d4a72c;
}

.footer{
text-align:center;
margin-top:17px;
color:#444;
font-size:10px;
}

</style>

</head>

<body>

<div class="wrapper">

<div class="brand">

<div class="logo">
LC
</div>

<h1>LINKCASH</h1>

<p>Create your account</p>

</div>


<div class="card">

<div class="title">

<h2>Create Account</h2>

<p>
Create your LINKCASH account and continue to activation.
</p>

</div>


<div class="fee-box">

<small>ACTIVATION FEE</small>

<strong>TSh 14,500</strong>

</div>


<form id="registerForm">


<div class="field">

<label>Full Name</label>

<input
type="text"
id="fullname"
placeholder="Enter your full name"
autocomplete="name"
required
>

</div>


<div class="field">

<label>Username</label>

<input
type="text"
id="username"
placeholder="Choose a username"
autocomplete="username"
required
>

</div>


<div class="field">

<label>Phone Number</label>

<input
type="tel"
id="phone"
placeholder="Enter your phone number"
autocomplete="tel"
required
>

</div>


<div class="field">

<label>Password</label>

<div class="password-wrap">

<input
type="password"
id="password"
placeholder="Create a password"
autocomplete="new-password"
required
>

<button
type="button"
class="show-password"
id="showPassword"
>
SHOW
</button>

</div>

</div>


<div class="field">

<label>Confirm Password</label>

<div class="password-wrap">

<input
type="password"
id="confirmPassword"
placeholder="Confirm your password"
autocomplete="new-password"
required
>

<button
type="button"
class="show-password"
id="showConfirmPassword"
>
SHOW
</button>

</div>

</div>


<button
type="submit"
class="register-btn"
id="registerBtn"
>
CREATE ACCOUNT
</button>

</form>


<div
id="message"
class="message"
></div>


<div class="login">

Already have an account?

<a href="login.html">
Log In
</a>

</div>

</div>


<a
href="index.html"
class="back"
>
← Back to Home
</a>


<div class="footer">
© 2026 LINKCASH
</div>

</div>


<script>

/* =========================================
   ELEMENTS
========================================= */

const form =
document.getElementById("registerForm");

const fullname =
document.getElementById("fullname");

const username =
document.getElementById("username");

const phone =
document.getElementById("phone");

const password =
document.getElementById("password");

const confirmPassword =
document.getElementById("confirmPassword");

const registerBtn =
document.getElementById("registerBtn");

const message =
document.getElementById("message");

const showPassword =
document.getElementById("showPassword");

const showConfirmPassword =
document.getElementById("showConfirmPassword");


/* =========================================
   SHOW PASSWORD
========================================= */

showPassword.onclick = function(){

if(password.type === "password"){

password.type = "text";

showPassword.textContent =
"HIDE";

}else{

password.type = "password";

showPassword.textContent =
"SHOW";

}

};


/* =========================================
   SHOW CONFIRM PASSWORD
========================================= */

showConfirmPassword.onclick = function(){

if(confirmPassword.type === "password"){

confirmPassword.type = "text";

showConfirmPassword.textContent =
"HIDE";

}else{

confirmPassword.type = "password";

showConfirmPassword.textContent =
"SHOW";

}

};


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type){

message.className =
"message " + type;

message.textContent =
text;

message.style.display =
"block";

}


/* =========================================
   REGISTER
========================================= */

form.addEventListener(
"submit",
function(event){

event.preventDefault();


const name =
fullname.value.trim();

const user =
username.value.trim().toLowerCase();

const number =
phone.value.trim();

const pass =
password.value;

const confirm =
confirmPassword.value;


/* =========================================
   VALIDATION
========================================= */

if(!name){

showMessage(
"Please enter your full name.",
"error"
);

fullname.focus();

return;

}


if(!user){

showMessage(
"Please choose a username.",
"error"
);

username.focus();

return;

}


if(!number){

showMessage(
"Please enter your phone number.",
"error"
);

phone.focus();

return;

}


if(!pass){

showMessage(
"Please create a password.",
"error"
);

password.focus();

return;

}


if(pass.length < 6){

showMessage(
"Password must be at least 6 characters.",
"error"
);

password.focus();

return;

}


if(pass !== confirm){

showMessage(
"Passwords do not match.",
"error"
);

confirmPassword.focus();

return;

}


/* =========================================
   CHECK EXISTING ACCOUNT
========================================= */

const oldAccount =
localStorage.getItem(
"linkcashAccount"
);

if(oldAccount){

try{

const existing =
JSON.parse(oldAccount);

const existingUsername =
String(
existing.username || ""
)
.trim()
.toLowerCase();

if(existingUsername === user){

showMessage(
"This username already exists. Please choose another username.",
"error"
);

username.focus();

return;

}

}catch(error){

/* Ignore invalid old data */

}

}


/* =========================================
   CREATE NEW ACCOUNT
   IMPORTANT:
   NEW USER = PENDING
========================================= */

const account = {

id:
"USER-" +
Date.now(),

fullname:
name,

username:
user,

phone:
number,

password:
pass,

/*
   ACCOUNT IS NOT ACTIVE
*/

status:
"pending",

/*
   PAYMENT IS NOT COMPLETED
*/

paymentStatus:
"pending",

/*
   ACTIVATION IS NOT COMPLETED
*/

activationStatus:
"pending",

activationFee:
14500,

paymentSubmitted:
false,

paymentReference:
"",

paymentMethod:
"",

submittedAt:
null,

createdAt:
new Date().toISOString()

};


/* =========================================
   SAVE ACCOUNT
========================================= */

localStorage.setItem(
"linkcashAccount",
JSON.stringify(account)
);


/* =========================================
   SAVE USER SESSION DATA
========================================= */

localStorage.setItem(
"linkcashUser",
JSON.stringify(account)
);


/*
   USER IS NOT LOGGED IN AS ACTIVE
*/

localStorage.removeItem(
"linkcashLoggedIn"
);


/* =========================================
   SAVE PENDING USER
========================================= */

localStorage.setItem(
"linkcashPendingUser",
JSON.stringify(account)
);


/* =========================================
   SUCCESS
========================================= */

registerBtn.disabled =
true;

registerBtn.textContent =
"ACCOUNT CREATED ✓";


showMessage(
"Account created successfully. Opening activation page...",
"success"
);


/* =========================================
   GO TO PENDING DASHBOARD
========================================= */

setTimeout(function(){

window.location.href =
"pending-dashboard.html";

},900);

});

</script>

</body>
</html>
