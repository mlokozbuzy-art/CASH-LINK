<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - LINKCASH</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #07111f, #102a43);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .back {
      display: inline-block;
      color: #9db0c5;
      text-decoration: none;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 22px;
      padding: 28px 22px;
      backdrop-filter: blur(10px);
    }

    .logo {
      width: 65px;
      height: 65px;
      border-radius: 18px;
      background: linear-gradient(135deg, #00e5ff, #006eff);
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 24px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .description {
      color: #9db0c5;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      color: #dce7f2;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 17px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 11px;
      background: rgba(0,0,0,0.25);
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #00c6ff;
    }

    input::placeholder {
      color: #71849a;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 11px;
      background: #00c6ff;
      color: #00121d;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: #9db0c5;
      font-size: 14px;
    }

    .login a {
      color: #00c6ff;
      text-decoration: none;
      font-weight: bold;
    }

    #message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(0,198,255,0.12);
      color: #7de5ff;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">

    <a href="index.html" class="back">← Back to Home</a>

    <div class="card">

      <div class="logo">LC</div>

      <h1>Create Account</h1>

      <p class="description">
        Create your LINKCASH account to continue.
      </p>

      <form id="registerForm">

        <label for="fullname">Full Name</label>
        <input
          type="text"
          id="fullname"
          placeholder="Enter your full name"
          required
        >

        <label for="phone">Phone Number</label>
        <input
          type="tel"
          id="phone"
          placeholder="Enter phone number"
          required
        >

        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter email address"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Create password"
          minlength="6"
          required
        >

        <button type="submit">
          CREATE ACCOUNT
        </button>

      </form>

      <div id="message">
        Account created successfully!
      </div>

      <div class="login">
        Already have an account?
        <a href="login.html">Login</a>
      </div>

    </div>

  </div>

  <script>
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const fullname = document.getElementById("fullname").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const user = {
        fullname: fullname,
        phone: phone,
        email: email,
        password: password
      };

      localStorage.setItem("linkcashUser", JSON.stringify(user));

      message.style.display = "block";

      setTimeout(function() {
        window.location.href = "login.html";
      }, 1200);
    });
  </script>

</body>
</html>
