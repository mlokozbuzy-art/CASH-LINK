<script>

/* =========================
   ELEMENTS
========================= */

const form =
document.getElementById("registerForm");

const fullname =
document.getElementById("fullname");

const username =
document.getElementById("username");

const phone =
document.getElementById("phone");

const password =
document.getElementById("password");

const confirmPassword =
document.getElementById("confirmPassword");

const registerBtn =
document.getElementById("registerBtn");

const message =
document.getElementById("message");

const showPassword =
document.getElementById("showPassword");

const showConfirmPassword =
document.getElementById("showConfirmPassword");


/* =========================
   SHOW PASSWORD
========================= */

showPassword.addEventListener("click", function(){

    if(password.type === "password"){

        password.type = "text";
        showPassword.textContent = "HIDE";

    }else{

        password.type = "password";
        showPassword.textContent = "SHOW";

    }

});


/* =========================
   SHOW CONFIRM PASSWORD
========================= */

showConfirmPassword.addEventListener("click", function(){

    if(confirmPassword.type === "password"){

        confirmPassword.type = "text";
        showConfirmPassword.textContent = "HIDE";

    }else{

        confirmPassword.type = "password";
        showConfirmPassword.textContent = "SHOW";

    }

});


/* =========================
   MESSAGE
========================= */

function showMessage(text,type){

    message.className = "message " + type;
    message.textContent = text;
    message.style.display = "block";

}


/* =========================
   REGISTER
========================= */

form.addEventListener("submit", function(event){

    event.preventDefault();

    const name =
        fullname.value.trim();

    const user =
        username.value.trim().toLowerCase();

    const number =
        phone.value.trim();

    const pass =
        password.value;

    const confirm =
        confirmPassword.value;


    /* =========================
       VALIDATION
    ========================= */

    if(!name){

        showMessage(
            "Please enter your full name.",
            "error"
        );

        fullname.focus();
        return;

    }


    if(!user){

        showMessage(
            "Please choose a username.",
            "error"
        );

        username.focus();
        return;

    }


    if(!number){

        showMessage(
            "Please enter your phone number.",
            "error"
        );

        phone.focus();
        return;

    }


    if(!pass){

        showMessage(
            "Please create a password.",
            "error"
        );

        password.focus();
        return;

    }


    if(pass.length < 6){

        showMessage(
            "Password must be at least 6 characters.",
            "error"
        );

        password.focus();
        return;

    }


    if(pass !== confirm){

        showMessage(
            "Passwords do not match.",
            "error"
        );

        confirmPassword.focus();
        return;

    }


    /* =========================
       CHECK EXISTING ACCOUNT
    ========================= */

    const existingAccount =
        localStorage.getItem("linkcashAccount");

    if(existingAccount){

        try{

            const oldAccount =
                JSON.parse(existingAccount);

            if(
                oldAccount.username === user
            ){

                showMessage(
                    "Username already exists. Please choose another.",
                    "error"
                );

                username.focus();
                return;

            }

        }catch(error){

            localStorage.removeItem(
                "linkcashAccount"
            );

        }

    }


    /* =========================
       CREATE ACCOUNT
    ========================= */

    const account = {

        fullname: name,

        username: user,

        phone: number,

        password: pass,

        createdAt:
            new Date().toISOString(),

        status: "active"

    };


    /* =========================
       SAVE ACCOUNT
    ========================= */

    localStorage.setItem(
        "linkcashAccount",
        JSON.stringify(account)
    );


    /* =========================
       SAVE LOGIN STATE
    ========================= */

    localStorage.removeItem(
        "linkcashLoggedIn"
    );

    localStorage.removeItem(
        "linkcashUser"
    );


    /* =========================
       SUCCESS
    ========================= */

    registerBtn.disabled = true;

    registerBtn.textContent =
        "ACCOUNT CREATED ✓";


    showMessage(
        "Account created successfully ✓ Redirecting to login...",
        "success"
    );


    /* =========================
       GO TO LOGIN
    ========================= */

    setTimeout(function(){

        window.location.href =
            "login.html";

    },1000);

});

</script>
