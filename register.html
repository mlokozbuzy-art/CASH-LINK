<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LINKCASH | Create Account</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #123d69 0%, transparent 35%),
        radial-gradient(circle at bottom right, #075b68 0%, transparent 35%),
        #050b14;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }

    .page {
      width: 100%;
      max-width: 430px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: linear-gradient(135deg, #00e5ff, #087cff);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #00111b;
      font-size: 16px;
    }

    .home {
      color: #91a4b8;
      text-decoration: none;
      font-size: 13px;
    }

    .card {
      background: rgba(12, 23, 38, .88);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 26px;
      padding: 28px 22px;
      box-shadow: 0 25px 70px rgba(0,0,0,.35);
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #8fa2b7;
      font-size: 14px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;
      font-size: 13px;
      color: #b9c7d6;
      margin-bottom: 8px;
    }

    .input-box {
      position: relative;
    }

    .input-box span {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #647b91;
      font-size: 15px;
    }

    input {
      width: 100%;
      height: 50px;
      padding: 0 14px 0 42px;
      background: #081321;
      border: 1px solid #1b2b3e;
      border-radius: 13px;
      outline: none;
      color: white;
      font-size: 14px;
      transition: .2s;
    }

    input:focus {
      border-color: #00c6ff;
      box-shadow: 0 0 0 3px rgba(0,198,255,.08);
    }

    input::placeholder {
      color: #53677c;
    }

    .password-note {
      margin-top: 7px;
      color: #60758a;
      font-size: 11px;
    }

    button {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, #00d9ff, #087cff);
      color: #00111b;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 6px;
      box-shadow: 0 12px 25px rgba(0,150,255,.18);
    }

    button:active {
      transform: scale(.98);
    }

    .terms {
      margin-top: 15px;
      color: #65798e;
      text-align: center;
      font-size: 11px;
      line-height: 1.5;
    }

    .login {
      text-align: center;
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,.07);
      color: #7e91a5;
      font-size: 13px;
    }

    .login a {
      color: #00c6ff;
      text-decoration: none;
      font-weight: 700;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      background: rgba(0, 210, 150, .1);
      border: 1px solid rgba(0, 210, 150, .2);
      color: #63e6be;
      font-size: 13px;
    }

    .footer {
      text-align: center;
      color: #405267;
      font-size: 11px;
      margin-top: 18px;
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="top">

      <div class="brand">
        <div class="brand-icon">LC</div>
        <span>LINKCASH</span>
      </div>

      <a href="index.html" class="home">Home</a>

    </div>

    <div class="card">

      <div class="welcome">
        <h1>Create account</h1>
        <p>
          Join LINKCASH and create your personal account.
        </p>
      </div>

      <form id="registerForm">

        <div class="field">
          <label>Full name</label>

          <div class="input-box">
            <span>👤</span>
            <input
              type="text"
              id="fullname"
              placeholder="Your full name"
              required
            >
          </div>
        </div>

        <div class="field">
          <label>Phone number</label>

          <div class="input-box">
            <span>📱</span>
            <input
              type="tel"
              id="phone"
              placeholder="07XXXXXXXX"
              required
            >
          </div>
        </div>

        <div class="field">
          <label>Email address</label>

          <div class="input-box">
            <span>✉</span>
            <input
              type="email"
              id="email"
              placeholder="example@email.com"
              required
            >
          </div>
        </div>

        <div class="field">
          <label>Password</label>

          <div class="input-box">
            <span>🔒</span>
            <input
              type="password"
              id="password"
              placeholder="Create a password"
              minlength="6"
              required
            >
          </div>

          <div class="password-note">
            Use at least 6 characters.
          </div>
        </div>

        <button type="submit">
          CREATE ACCOUNT →
        </button>

      </form>

      <div class="message" id="message">
        Account created successfully ✓
      </div>

      <div class="terms">
        By creating an account, you agree to use LINKCASH responsibly.
      </div>

      <div class="login">
        Already have an account?
        <a href="login.html">Login</a>
      </div>

    </div>

    <div class="footer">
      © 2026 LINKCASH
    </div>

  </div>

  <script>

    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {

      event.preventDefault();

      const user = {
        fullname: document.getElementById("fullname").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      };

      localStorage.setItem(
        "linkcashUser",
        JSON.stringify(user)
      );

      message.style.display = "block";

      setTimeout(() => {
        window.location.href = "login.html";
      }, 1200);

    });

  </script>

</body>
</html>
