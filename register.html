<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>LINKCASH - Register</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:#050505;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.wrapper{
  width:100%;
  max-width:430px;
}

.brand{
  text-align:center;
  margin-bottom:25px;
}

.logo{
  width:70px;
  height:70px;
  margin:auto;
  border-radius:20px;
  background:linear-gradient(
    145deg,
    #ffe082,
    #d4a72c,
    #8f6b12
  );
  display:flex;
  align-items:center;
  justify-content:center;
  color:#090909;
  font-size:24px;
  font-weight:900;
  box-shadow:0 0 25px rgba(212,167,44,.25);
}

.brand h1{
  margin-top:13px;
  font-size:28px;
  letter-spacing:3px;
}

.brand p{
  margin-top:7px;
  color:#8d8d8d;
  font-size:13px;
}

.card{
  background:#101010;
  border:1px solid #292929;
  border-radius:24px;
  padding:28px 22px;
  box-shadow:0 25px 70px rgba(0,0,0,.6);
}

.title{
  margin-bottom:23px;
}

.title h2{
  font-size:23px;
  margin-bottom:7px;
}

.title p{
  color:#858585;
  font-size:13px;
  line-height:1.5;
}

.ref-box{
  display:none;
  margin-bottom:18px;
  padding:13px;
  border-radius:12px;
  background:rgba(212,167,44,.08);
  border:1px solid rgba(212,167,44,.25);
}

.ref-box small{
  color:#777;
  font-size:10px;
  display:block;
  margin-bottom:5px;
}

.ref-box strong{
  color:#e0b83e;
  font-size:13px;
}

.field{
  margin-bottom:17px;
}

.field label{
  display:block;
  color:#cfcfcf;
  font-size:13px;
  margin-bottom:8px;
}

input{
  width:100%;
  height:50px;
  background:#070707;
  border:1px solid #292929;
  border-radius:12px;
  color:white;
  outline:none;
  padding:0 15px;
  font-size:14px;
}

input::placeholder{
  color:#555;
}

input:focus{
  border-color:#d4a72c;
  box-shadow:0 0 0 2px rgba(212,167,44,.08);
}

.username-note{
  margin-top:6px;
  color:#666;
  font-size:11px;
}

.register-btn{
  width:100%;
  height:53px;
  margin-top:5px;
  border:none;
  border-radius:13px;
  background:linear-gradient(
    135deg,
    #ffe082,
    #d4a72c,
    #a77b17
  );
  color:#080808;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
}

.register-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.message{
  display:none;
  margin-top:15px;
  padding:13px;
  border-radius:10px;
  text-align:center;
  background:rgba(212,167,44,.08);
  border:1px solid rgba(212,167,44,.25);
  color:#e6c65c;
  font-size:13px;
  line-height:1.6;
}

.login{
  text-align:center;
  margin-top:23px;
  padding-top:20px;
  border-top:1px solid #222;
  color:#777;
  font-size:13px;
}

.login a{
  color:#e0b83e;
  text-decoration:none;
  font-weight:bold;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#686868;
  text-decoration:none;
  font-size:12px;
}

.footer{
  text-align:center;
  margin-top:18px;
  color:#444;
  font-size:11px;
}

</style>

</head>

<body>

<div class="wrapper">

  <div class="brand">

    <div class="logo">
      LC
    </div>

    <h1>LINKCASH</h1>

    <p>
      Simple. Secure. Connected.
    </p>

  </div>


  <div class="card">

    <div class="title">

      <h2>
        Create Account
      </h2>

      <p>
        Create your LINKCASH account to get started.
      </p>

    </div>


    <!-- REFERRER -->

    <div
      class="ref-box"
      id="refBox"
    >

      <small>
        INVITED BY
      </small>

      <strong id="refUsername">
        —
      </strong>

    </div>


    <!-- REGISTER FORM -->

    <form id="registerForm">

      <div class="field">

        <label>
          Full Name
        </label>

        <input
          type="text"
          id="fullname"
          placeholder="Enter your full name"
          required
        >

      </div>


      <div class="field">

        <label>
          Username
        </label>

        <input
          type="text"
          id="username"
          placeholder="Choose a username"
          minlength="3"
          maxlength="20"
          required
        >

        <div class="username-note">
          3–20 characters. Letters, numbers and underscore only.
        </div>

      </div>


      <div class="field">

        <label>
          Phone Number
        </label>

        <input
          type="tel"
          id="phone"
          placeholder="07XXXXXXXX"
          required
        >

      </div>


      <div class="field">

        <label>
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

      </div>


      <div class="field">

        <label>
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Create your password"
          minlength="6"
          required
        >

      </div>


      <button
        type="submit"
        class="register-btn"
        id="registerButton"
      >
        CREATE ACCOUNT
      </button>

    </form>


    <div
      class="message"
      id="message"
    ></div>


    <div class="login">

      Already have an account?

      <a href="login.html">
        Login
      </a>

    </div>

  </div>


  <a
    href="index.html"
    class="back"
  >
    ← Back to Home
  </a>


  <div class="footer">
    © 2026 LINKCASH
  </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

/*
  PROJECT URL
*/

const SUPABASE_URL =
  "https://plmasvzxgcwnxgbeaurc.supabase.co";


/*
  WEKA PUBLISHABLE KEY YAKO HAPA.

  MFANO:

  const SUPABASE_KEY =
    "sb_publishable_xxxxxxxxxxxxx";

  Usitumie Secret Key.
*/

const SUPABASE_KEY =
  "WEKA_PUBLISHABLE_KEY_YAKO_HAPA";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   REFERRER
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const referrer =
  String(
    params.get("ref") || ""
  )
  .trim()
  .toLowerCase();


if(referrer){

  document.getElementById(
    "refBox"
  ).style.display =
    "block";

  document.getElementById(
    "refUsername"
  ).textContent =
    "@" + referrer;

}


/* =====================================================
   ELEMENTS
===================================================== */

const form =
  document.getElementById(
    "registerForm"
  );

const message =
  document.getElementById(
    "message"
  );

const button =
  document.getElementById(
    "registerButton"
  );


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  error=false
){

  message.style.display =
    "block";

  message.innerHTML =
    text;

  if(error){

    message.style.color =
      "#ff7777";

    message.style.borderColor =
      "rgba(255,80,80,.3)";

  }else{

    message.style.color =
      "#e6c65c";

    message.style.borderColor =
      "rgba(212,167,44,.25)";

  }

}


/* =====================================================
   REGISTER
===================================================== */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    button.disabled =
      true;

    button.textContent =
      "CREATING ACCOUNT...";


    try{


      /* ===============================================
         GET VALUES
      =============================================== */

      const fullname =
        document
          .getElementById("fullname")
          .value
          .trim();


      const username =
        document
          .getElementById("username")
          .value
          .trim()
          .toLowerCase();


      const phone =
        document
          .getElementById("phone")
          .value
          .trim();


      const email =
        document
          .getElementById("email")
          .value
          .trim()
          .toLowerCase();


      const password =
        document
          .getElementById("password")
          .value;


      /* ===============================================
         VALIDATION
      =============================================== */

      const usernamePattern =
        /^[a-zA-Z0-9_]+$/;


      if(
        !usernamePattern.test(
          username
        )
      ){

        throw new Error(
          "Username can only contain letters, numbers and underscore."
        );

      }


      if(
        password.length < 6
      ){

        throw new Error(
          "Password must contain at least 6 characters."
        );

      }


      /* ===============================================
         CREATE AUTH USER
      =============================================== */

      const {
        data,
        error
      } =
        await supabaseClient.auth.signUp({

          email:
            email,

          password:
            password,

          options:{

            data:{

              fullname:
                fullname,

              username:
                username,

              phone:
                phone

            }

          }

        });


      if(error){

        throw error;

      }


      if(!data.user){

        throw new Error(
          "Account was not created."
        );

      }


      const userId =
        data.user.id;


      /* ===============================================
         FIND REFERRER
      =============================================== */

      let referrerId =
        null;


      if(referrer){

        const {
          data:refUser,
          error:refError
        } =
          await supabaseClient

            .from("profiles")

            .select(
              "id,username"
            )

            .eq(
              "username",
              referrer
            )
            
            .maybeSingle();


        if(
          !refError &&
          refUser
        ){

          referrerId =
            refUser.id;

        }

      }


      /* ===============================================
         CREATE PROFILE
      =============================================== */

      const {
        error:profileError
      } =
        await supabaseClient

          .from("profiles")

          .insert({

            id:
              userId,

            fullname:
              fullname,

            username:
              username,

            phone:
              phone,

            email:
              email,

            referrer_id:
              referrerId,

            status:
              "pending",

            balance:
              0,

            commission:
              0,

            activation_fee:
              14500

          });


      if(profileError){

        throw profileError;

      }


      /* ===============================================
         SUCCESS
      =============================================== */

      showMessage(

        "Account created successfully ✓"

        +

        "<br><br>"

        +

        "STATUS: PENDING"

        +

        "<br>"

        +

        "Activation fee: TZS 14,500"

        +

        "<br><br>"

        +

        "Opening your pending dashboard..."

      );


      /* ===============================================
         SAVE USER ID
      =============================================== */

      localStorage.setItem(
        "linkcashUserId",
        userId
      );


      localStorage.setItem(
        "linkcashLoggedIn",
        "true"
      );


      /* ===============================================
         GO PENDING DASHBOARD
      =============================================== */

      setTimeout(
        function(){

          window.location.href =
            "pending-dashboard.html";

        },
        1500
      );


    }catch(error){

      console.error(
        "LINKCASH ERROR:",
        error
      );


      let errorMessage =
        error.message ||
        "Registration failed.";


      if(
        errorMessage
          .toLowerCase()
          .includes("invalid api key")
      ){

        errorMessage =
          "Invalid Supabase API key. " +
          "Open this file and replace " +
          "SUPABASE_KEY with your current Publishable key.";

      }


      if(
        errorMessage
          .toLowerCase()
          .includes("user already registered")
      ){

        errorMessage =
          "This email is already registered. Please use another email or login.";

      }


      if(
        errorMessage
          .toLowerCase()
          .includes("duplicate")
      ){

        errorMessage =
          "This username already exists. Please choose another.";

      }


      showMessage(
        errorMessage,
        true
      );


      button.disabled =
        false;

      button.textContent =
        "CREATE ACCOUNT";

    }

  }
);

</script>

</body>
</html>
