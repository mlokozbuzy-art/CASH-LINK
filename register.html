<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LINKCASH - Create Account</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:#050505;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.wrapper{
  width:100%;
  max-width:440px;
}

.brand{
  text-align:center;
  margin-bottom:22px;
}

.logo{
  width:70px;
  height:70px;
  margin:auto;
  border-radius:20px;
  background:linear-gradient(
    145deg,
    #ffe082,
    #d4a72c,
    #8f6b12
  );
  display:flex;
  align-items:center;
  justify-content:center;
  color:#080808;
  font-size:24px;
  font-weight:900;
  box-shadow:0 0 30px rgba(212,167,44,.22);
}

.brand h1{
  margin-top:13px;
  font-size:28px;
  letter-spacing:3px;
}

.brand p{
  margin-top:7px;
  color:#777;
  font-size:12px;
}

.card{
  background:#101010;
  border:1px solid #292929;
  border-radius:24px;
  padding:25px 21px;
  box-shadow:0 25px 70px rgba(0,0,0,.55);
}

.title h2{
  font-size:23px;
}

.title p{
  color:#777;
  font-size:12px;
  line-height:1.5;
  margin-top:7px;
}

.ref-box{
  display:none;
  margin:18px 0;
  padding:13px;
  border-radius:13px;
  background:rgba(212,167,44,.08);
  border:1px solid rgba(212,167,44,.3);
}

.ref-box small{
  display:block;
  color:#777;
  font-size:9px;
  margin-bottom:5px;
}

.ref-box strong{
  color:#e4bd4b;
  font-size:13px;
}

.field{
  margin-top:16px;
}

.field label{
  display:block;
  color:#ccc;
  font-size:12px;
  margin-bottom:7px;
}

input{
  width:100%;
  height:49px;
  background:#070707;
  border:1px solid #292929;
  border-radius:11px;
  color:white;
  outline:none;
  padding:0 14px;
  font-size:14px;
}

input:focus{
  border-color:#d4a72c;
  box-shadow:0 0 0 2px rgba(212,167,44,.08);
}

input::placeholder{
  color:#555;
}

.note{
  color:#555;
  font-size:10px;
  margin-top:5px;
}

.fee-box{
  margin-top:18px;
  padding:14px;
  border-radius:13px;
  background:#0a0a0a;
  border:1px solid #292929;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.fee-label{
  color:#777;
  font-size:11px;
}

.fee{
  color:#e4bd4b;
  font-weight:900;
  font-size:17px;
}

.register-btn{
  width:100%;
  height:53px;
  margin-top:19px;
  border:none;
  border-radius:13px;
  background:linear-gradient(
    135deg,
    #ffe082,
    #d4a72c,
    #a77b17
  );
  color:#080808;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
}

.register-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.message{
  display:none;
  margin-top:14px;
  padding:12px;
  border-radius:10px;
  text-align:center;
  font-size:12px;
  line-height:1.5;
}

.message.error{
  display:block;
  background:rgba(255,70,70,.08);
  border:1px solid rgba(255,70,70,.25);
  color:#ff8d8d;
}

.message.success{
  display:block;
  background:rgba(70,220,130,.08);
  border:1px solid rgba(70,220,130,.25);
  color:#6ee7a0;
}

.login{
  text-align:center;
  margin-top:20px;
  padding-top:18px;
  border-top:1px solid #222;
  color:#777;
  font-size:12px;
}

.login a{
  color:#e0b83e;
  text-decoration:none;
  font-weight:bold;
}

.back{
  display:block;
  text-align:center;
  margin-top:17px;
  color:#666;
  text-decoration:none;
  font-size:11px;
}

.footer{
  text-align:center;
  margin-top:16px;
  color:#444;
  font-size:10px;
}

.loader{
  display:none;
  width:16px;
  height:16px;
  border:2px solid rgba(0,0,0,.3);
  border-top-color:#080808;
  border-radius:50%;
  animation:spin .7s linear infinite;
  margin:auto;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="brand">
    <div class="logo">LC</div>

    <h1>LINKCASH</h1>

    <p>Simple. Secure. Connected.</p>
  </div>


  <div class="card">

    <div class="title">

      <h2>Create Account</h2>

      <p>
        Create your LINKCASH account and continue
        to activation.
      </p>

    </div>


    <!-- REFERRER -->

    <div
      class="ref-box"
      id="refBox"
    >

      <small>INVITED BY</small>

      <strong id="refUsername">—</strong>

    </div>


    <form id="registerForm">

      <!-- FULL NAME -->

      <div class="field">

        <label>Full Name</label>

        <input
          type="text"
          id="fullname"
          placeholder="Enter your full name"
          autocomplete="name"
          required
        >

      </div>


      <!-- USERNAME -->

      <div class="field">

        <label>Username</label>

        <input
          type="text"
          id="username"
          placeholder="Choose username"
          minlength="3"
          maxlength="20"
          autocomplete="username"
          required
        >

        <div class="note">
          3–20 characters. Letters, numbers and underscore only.
        </div>

      </div>


      <!-- PHONE -->

      <div class="field">

        <label>Phone Number</label>

        <input
          type="tel"
          id="phone"
          placeholder="07XXXXXXXX"
          autocomplete="tel"
          required
        >

      </div>


      <!-- EMAIL -->

      <div class="field">

        <label>Email Address</label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

      </div>


      <!-- PASSWORD -->

      <div class="field">

        <label>Password</label>

        <input
          type="password"
          id="password"
          placeholder="Create your password"
          minlength="6"
          autocomplete="new-password"
          required
        >

      </div>


      <!-- ACTIVATION FEE -->

      <div class="fee-box">

        <div class="fee-label">
          Account Activation Fee
        </div>

        <div class="fee">
          TZS 14,500
        </div>

      </div>


      <!-- BUTTON -->

      <button
        type="submit"
        class="register-btn"
        id="registerBtn"
      >

        <span id="buttonText">
          CREATE ACCOUNT
        </span>

        <span
          class="loader"
          id="loader"
        ></span>

      </button>

    </form>


    <div
      class="message"
      id="message"
    ></div>


    <div class="login">

      Already have an account?

      <a href="login.html">
        Login
      </a>

    </div>

  </div>


  <a
    href="index.html"
    class="back"
  >
    ← Back to Home
  </a>


  <div class="footer">
    © 2026 LINKCASH
  </div>

</div>


<script>

/* =================================================
   SUPABASE CONFIG
================================================= */

const SUPABASE_URL =
  "https://plmasvzxgcwnxgbeaurc.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_QUoRhZ-o_TqxKEveIXERDQ_IRIvWQWG";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =================================================
   REFERRER
   Example:
   register.html?ref=mussa
================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const ref =
  (
    params.get("ref") || ""
  )
  .trim()
  .toLowerCase();


let referrerId = null;
let validReferrerUsername = null;


/* =================================================
   CHECK REFERRER
================================================= */

async function loadReferrer(){

  if(!ref){

    return;

  }


  const { data, error } =
    await supabaseClient
      .from("profiles")
      .select("id,username")
      .eq("username",ref)
      .maybeSingle();


  if(error){

    console.log(
      "Referrer check:",
      error.message
    );

    return;

  }


  if(data){

    referrerId =
      data.id;

    validReferrerUsername =
      data.username;

    document.getElementById(
      "refBox"
    ).style.display = "block";

    document.getElementById(
      "refUsername"
    ).textContent =
      "@" + data.username;

  }

}


loadReferrer();


/* =================================================
   ELEMENTS
================================================= */

const form =
  document.getElementById(
    "registerForm"
  );

const message =
  document.getElementById(
    "message"
  );

const registerBtn =
  document.getElementById(
    "registerBtn"
  );

const buttonText =
  document.getElementById(
    "buttonText"
  );

const loader =
  document.getElementById(
    "loader"
  );


/* =================================================
   MESSAGE
================================================= */

function showMessage(
  text,
  type
){

  message.className =
    "message " + type;

  message.textContent =
    text;

}


/* =================================================
   LOADING
================================================= */

function setLoading(
  loading
){

  registerBtn.disabled =
    loading;

  if(loading){

    buttonText.style.display =
      "none";

    loader.style.display =
      "block";

  }else{

    buttonText.style.display =
      "inline";

    loader.style.display =
      "none";

  }

}


/* =================================================
   REGISTER
================================================= */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    showMessage(
      "",
      ""
    );

    message.style.display =
      "none";


    const fullname =
      document
        .getElementById("fullname")
        .value
        .trim();


    const username =
      document
        .getElementById("username")
        .value
        .trim()
        .toLowerCase();


    const phone =
      document
        .getElementById("phone")
        .value
        .trim();


    const email =
      document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();


    const password =
      document
        .getElementById("password")
        .value;


    /* ============================================
       VALIDATION
    ============================================ */

    if(
      !fullname ||
      !username ||
      !phone ||
      !email ||
      !password
    ){

      showMessage(
        "Please fill in all fields.",
        "error"
      );

      return;

    }


    const usernamePattern =
      /^[a-z0-9_]+$/;


    if(
      !usernamePattern.test(username)
    ){

      showMessage(
        "Username can only contain letters, numbers and underscore.",
        "error"
      );

      return;

    }


    if(
      username.length < 3 ||
      username.length > 20
    ){

      showMessage(
        "Username must be between 3 and 20 characters.",
        "error"
      );

      return;

    }


    if(
      password.length < 6
    ){

      showMessage(
        "Password must contain at least 6 characters.",
        "error"
      );

      return;

    }


    setLoading(true);


    try{

      /* =========================================
         CHECK USERNAME FIRST
      ========================================= */

      const {
        data: existingUser,
        error: usernameError
      } =
        await supabaseClient
          .from("profiles")
          .select("id")
          .eq("username",username)
          .maybeSingle();


      if(usernameError){

        throw usernameError;

      }


      if(existingUser){

        throw new Error(
          "This username already exists. Please choose another."
        );

      }


      /* =========================================
         CREATE SUPABASE AUTH ACCOUNT
      ========================================= */

      const {
        data: authData,
        error: authError
      } =
        await supabaseClient.auth.signUp({

          email:email,

          password:password,

          options:{
            data:{
              fullname:fullname,
              username:username,
              phone:phone
            }
          }

        });


      if(authError){

        throw authError;

      }


      if(
        !authData ||
        !authData.user
      ){

        throw new Error(
          "Account could not be created."
        );

      }


      const userId =
        authData.user.id;


      /* =========================================
         CREATE PROFILE
      ========================================= */

      const {
        error: profileError
      } =
        await supabaseClient
          .from("profiles")
          .insert({

            id:userId,

            fullname:fullname,

            username:username,

            phone:phone,

            email:email,

            referrer_id:
              referrerId,

            status:"pending",

            balance:0,

            commission:0,

            activation_fee:14500

          });


      if(profileError){

        console.error(
          "PROFILE ERROR:",
          profileError
        );

        throw new Error(
          "Account was created in Auth, but the profile could not be created. Check your profiles INSERT policy."
        );

      }


      /* =========================================
         SUCCESS
      ========================================= */

      showMessage(
        "Account created successfully ✓ Redirecting to activation...",
        "success"
      );


      setTimeout(
        function(){

          window.location.href =
            "pending-dashboard.html";

        },
        1200
      );


    }catch(error){

      console.error(
        "REGISTRATION ERROR:",
        error
      );


      let errorMessage =
        error.message ||
        "Registration failed.";


      if(
        errorMessage
          .toLowerCase()
          .includes("duplicate")
      ){

        errorMessage =
          "This username or account already exists.";

      }


      showMessage(
        errorMessage,
        "error"
      );


      setLoading(false);

    }

  }
);

</script>

</body>
</html>
