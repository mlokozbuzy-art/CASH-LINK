<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LINKCASH - Register</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:#050505;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.wrapper{
  width:100%;
  max-width:430px;
}

.brand{
  text-align:center;
  margin-bottom:25px;
}

.logo{
  width:70px;
  height:70px;
  margin:auto;
  border-radius:20px;
  background:linear-gradient(145deg,#ffe082,#d4a72c,#8f6b12);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#090909;
  font-size:24px;
  font-weight:900;
  box-shadow:0 0 25px rgba(212,167,44,.25);
}

.brand h1{
  margin-top:13px;
  font-size:28px;
  letter-spacing:3px;
}

.brand p{
  margin-top:7px;
  color:#8d8d8d;
  font-size:13px;
}

.card{
  background:#101010;
  border:1px solid #292929;
  border-radius:24px;
  padding:28px 22px;
  box-shadow:0 25px 70px rgba(0,0,0,.6);
}

.title{
  margin-bottom:23px;
}

.title h2{
  font-size:23px;
  margin-bottom:7px;
}

.title p{
  color:#858585;
  font-size:13px;
  line-height:1.5;
}

.ref-box{
  display:none;
  margin-bottom:18px;
  padding:13px;
  border-radius:12px;
  background:rgba(212,167,44,.08);
  border:1px solid rgba(212,167,44,.25);
}

.ref-box small{
  color:#777;
  font-size:10px;
  display:block;
  margin-bottom:4px;
}

.ref-box strong{
  color:#e0b83e;
  font-size:13px;
}

.field{
  margin-bottom:17px;
}

.field label{
  display:block;
  color:#cfcfcf;
  font-size:13px;
  margin-bottom:8px;
}

input{
  width:100%;
  height:50px;
  background:#070707;
  border:1px solid #292929;
  border-radius:12px;
  color:white;
  outline:none;
  padding:0 15px;
  font-size:14px;
}

input::placeholder{
  color:#555;
}

input:focus{
  border-color:#d4a72c;
  box-shadow:0 0 0 2px rgba(212,167,44,.08);
}

.username-note{
  margin-top:6px;
  color:#666;
  font-size:11px;
}

.register-btn{
  width:100%;
  height:53px;
  margin-top:5px;
  border:none;
  border-radius:13px;
  background:linear-gradient(135deg,#ffe082,#d4a72c,#a77b17);
  color:#080808;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
}

.register-btn:disabled{
  opacity:.65;
  cursor:not-allowed;
}

.message{
  display:none;
  margin-top:15px;
  padding:13px;
  border-radius:10px;
  text-align:center;
  font-size:12px;
  line-height:1.5;
}

.message.success{
  display:block;
  background:rgba(40,180,100,.10);
  border:1px solid rgba(40,180,100,.3);
  color:#62df91;
}

.message.error{
  display:block;
  background:rgba(220,60,60,.10);
  border:1px solid rgba(220,60,60,.3);
  color:#ff7777;
}

.login{
  text-align:center;
  margin-top:23px;
  padding-top:20px;
  border-top:1px solid #222;
  color:#777;
  font-size:13px;
}

.login a{
  color:#e0b83e;
  text-decoration:none;
  font-weight:bold;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#686868;
  text-decoration:none;
  font-size:12px;
}

.footer{
  text-align:center;
  margin-top:18px;
  color:#444;
  font-size:11px;
}

.loading{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.spinner{
  width:16px;
  height:16px;
  border:2px solid rgba(0,0,0,.25);
  border-top-color:#080808;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="brand">
    <div class="logo">LC</div>
    <h1>LINKCASH</h1>
    <p>Simple. Secure. Connected.</p>
  </div>

  <div class="card">

    <div class="title">
      <h2>Create Account</h2>
      <p>
        Create your LINKCASH account to get started.
      </p>
    </div>

    <div class="ref-box" id="refBox">
      <small>INVITED BY</small>
      <strong id="refUsername">—</strong>
    </div>

    <form id="registerForm">

      <div class="field">
        <label>Full Name</label>

        <input
          type="text"
          id="fullname"
          placeholder="Enter your full name"
          autocomplete="name"
          required
        >
      </div>

      <div class="field">
        <label>Username</label>

        <input
          type="text"
          id="username"
          placeholder="Choose a username"
          minlength="3"
          maxlength="20"
          autocomplete="username"
          required
        >

        <div class="username-note">
          3–20 characters. Letters, numbers and underscore only.
        </div>
      </div>

      <div class="field">
        <label>Phone Number</label>

        <input
          type="tel"
          id="phone"
          placeholder="07XXXXXXXX"
          autocomplete="tel"
          required
        >
      </div>

      <div class="field">
        <label>Email Address</label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">
        <label>Password</label>

        <input
          type="password"
          id="password"
          placeholder="Create your password"
          minlength="6"
          autocomplete="new-password"
          required
        >
      </div>

      <button
        type="submit"
        class="register-btn"
        id="registerBtn"
      >
        CREATE ACCOUNT
      </button>

    </form>

    <div class="message" id="message"></div>

    <div class="login">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

  </div>

  <a href="index.html" class="back">
    ← Back to Home
  </a>

  <div class="footer">
    © 2026 LINKCASH
  </div>

</div>


<script>

/* ==================================================
   SUPABASE CONFIGURATION
   ================================================== */

const SUPABASE_URL =
  "https://plmasvzxgcwnxgbeaurc.supabase.co";

/*
   WEKA PUBLISHABLE KEY YAKO HAPA
   Usitumie service_role key.
*/

const SUPABASE_KEY =
  "WEKA_PUBLISHABLE_KEY_YAKO_HAPA";


/* ==================================================
   SUPABASE CLIENT
   ================================================== */

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==================================================
   ELEMENTS
   ================================================== */

const form =
  document.getElementById("registerForm");

const message =
  document.getElementById("message");

const button =
  document.getElementById("registerBtn");


/* ==================================================
   REFERRER
   Example:
   register.html?ref=mussa
   ================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const referrerUsername =
  (
    params.get("ref") || ""
  )
  .trim()
  .toLowerCase();


if(referrerUsername){

  document.getElementById(
    "refBox"
  ).style.display = "block";

  document.getElementById(
    "refUsername"
  ).textContent =
    "@" + referrerUsername;

}


/* ==================================================
   MESSAGE
   ================================================== */

function showMessage(text,type){

  message.className =
    "message " + type;

  message.textContent =
    text;

  message.style.display =
    "block";

}


function clearMessage(){

  message.className =
    "message";

  message.textContent =
    "";

  message.style.display =
    "none";

}


/* ==================================================
   BUTTON LOADING
   ================================================== */

function setLoading(loading){

  if(loading){

    button.disabled = true;

    button.innerHTML =
      `
      <span class="loading">
        <span class="spinner"></span>
        CREATING ACCOUNT...
      </span>
      `;

  }else{

    button.disabled = false;

    button.textContent =
      "CREATE ACCOUNT";

  }

}


/* ==================================================
   TIMEOUT
   ================================================== */

function withTimeout(
  promise,
  milliseconds = 20000
){

  return Promise.race([

    promise,

    new Promise(
      (_,reject) => {

        setTimeout(
          () => {

            reject(
              new Error(
                "Request timed out. Check your internet connection and Supabase configuration."
              )
            );

          },
          milliseconds
        );

      }
    )

  ]);

}


/* ==================================================
   GET REFERRER ID
   ================================================== */

async function findReferrer(){

  if(!referrerUsername){

    return null;

  }


  const {
    data,
    error
  } =
    await withTimeout(

      supabaseClient
        .from("profiles")
        .select(
          "id,username"
        )
        .ilike(
          "username",
          referrerUsername
        )
        .maybeSingle()

    );


  if(error){

    throw error;

  }


  return data || null;

}


/* ==================================================
   CHECK USERNAME
   ================================================== */

async function usernameExists(username){

  const {
    data,
    error
  } =
    await withTimeout(

      supabaseClient
        .from("profiles")
        .select("id")
        .ilike(
          "username",
          username
        )
        .limit(1)

    );


  if(error){

    throw error;

  }


  return Array.isArray(data)
    && data.length > 0;

}


/* ==================================================
   REGISTER
   ================================================== */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    clearMessage();

    setLoading(true);


    try{

      /* ------------------------------------------
         GET VALUES
         ------------------------------------------ */

      const fullname =
        document
          .getElementById("fullname")
          .value
          .trim();


      const username =
        document
          .getElementById("username")
          .value
          .trim()
          .toLowerCase();


      const phone =
        document
          .getElementById("phone")
          .value
          .trim();


      const email =
        document
          .getElementById("email")
          .value
          .trim()
          .toLowerCase();


      const password =
        document
          .getElementById("password")
          .value;


      /* ------------------------------------------
         VALIDATION
         ------------------------------------------ */

      if(
        !fullname ||
        !username ||
        !phone ||
        !email ||
        !password
      ){

        throw new Error(
          "Please fill in all fields."
        );

      }


      if(
        username.length < 3 ||
        username.length > 20
      ){

        throw new Error(
          "Username must be 3–20 characters."
        );

      }


      const usernamePattern =
        /^[a-zA-Z0-9_]+$/;


      if(
        !usernamePattern.test(username)
      ){

        throw new Error(
          "Username can only contain letters, numbers and underscore."
        );

      }


      if(password.length < 6){

        throw new Error(
          "Password must contain at least 6 characters."
        );

      }


      /* ------------------------------------------
         CHECK USERNAME
         ------------------------------------------ */

      const exists =
        await usernameExists(
          username
        );


      if(exists){

        throw new Error(
          "This username already exists. Please choose another."
        );

      }


      /* ------------------------------------------
         FIND REFERRER
         ------------------------------------------ */

      let referrer = null;


      if(referrerUsername){

        referrer =
          await findReferrer();

      }


      /* ------------------------------------------
         CREATE AUTH USER
         ------------------------------------------ */

      const {
        data: authData,
        error: authError
      } =
        await withTimeout(

          supabaseClient.auth.signUp({

            email: email,

            password: password,

            options:{

              data:{

                fullname:fullname,

                username:username,

                phone:phone

              }

            }

          })

        );


      if(authError){

        throw authError;

      }


      if(
        !authData ||
        !authData.user
      ){

        throw new Error(
          "Supabase did not return a user account."
        );

      }


      const userId =
        authData.user.id;


      /* ------------------------------------------
         CREATE PROFILE
         ------------------------------------------ */

      const profile = {

        id:userId,

        fullname:fullname,

        username:username,

        phone:phone,

        email:email,

        referrer_id:
          referrer
            ? referrer.id
            : null,

        status:"pending",

        balance:0,

        commission:0,

        activation_fee:14500

      };


      const {
        error:profileError
      } =
        await withTimeout(

          supabaseClient
            .from("profiles")
            .insert(profile)

        );


      if(profileError){

        /*
          If profile creation fails,
          show the actual Supabase error.
        */

        throw new Error(
          "Account was created in Authentication, but profile creation failed: " +
          profileError.message
        );

      }


      /* ------------------------------------------
         SUCCESS
         ------------------------------------------ */

      showMessage(
        "Account created successfully ✓ Your account is PENDING activation.",
        "success"
      );


      form
        .querySelectorAll("input")
        .forEach(
          input => {
            input.disabled = true;
          }
        );


      button.disabled = true;


      /* ------------------------------------------
         SAVE LOCAL USER INFO
         ------------------------------------------ */

      localStorage.setItem(
        "linkcashUser",
        JSON.stringify({

          id:userId,

          fullname:fullname,

          username:username,

          phone:phone,

          email:email,

          status:"pending",

          activation_fee:14500,

          referrer:
            referrer
              ? referrer.username
              : null

        })
      );


      /* ------------------------------------------
         REDIRECT
         ------------------------------------------ */

      setTimeout(
        function(){

          window.location.href =
            "pending.html";

        },
        1200
      );


    }catch(error){

      console.error(
        "LINKCASH REGISTER ERROR:",
        error
      );


      let errorMessage =
        error?.message ||
        "Registration failed.";


      /*
        Make common Supabase errors
        easier to understand.
      */

      if(
        errorMessage
          .toLowerCase()
          .includes("row-level security")
      ){

        errorMessage =
          "Supabase RLS is blocking profile creation. Check the profiles INSERT policy.";

      }


      if(
        errorMessage
          .toLowerCase()
          .includes("invalid api key")
      ){

        errorMessage =
          "Invalid Supabase API key. Check your Publishable key.";

      }


      if(
        errorMessage
          .toLowerCase()
          .includes("user already registered")
      ){

        errorMessage =
          "This email is already registered. Please login instead.";

      }


      showMessage(
        errorMessage,
        "error"
      );


      setLoading(false);

    }

  }
);

</script>

</body>
</html>
