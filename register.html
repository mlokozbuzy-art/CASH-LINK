<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>LINKCASH - Register</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:#050505;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.wrapper{
  width:100%;
  max-width:430px;
}

.brand{
  text-align:center;
  margin-bottom:25px;
}

.logo{
  width:70px;
  height:70px;
  margin:auto;
  border-radius:20px;

  background:
    linear-gradient(
      145deg,
      #ffe082,
      #d4a72c,
      #8f6b12
    );

  display:flex;
  align-items:center;
  justify-content:center;

  color:#090909;
  font-size:24px;
  font-weight:900;

  box-shadow:
    0 0 25px rgba(212,167,44,.25);
}

.brand h1{
  margin-top:13px;
  font-size:28px;
  letter-spacing:3px;
}

.brand p{
  margin-top:7px;
  color:#8d8d8d;
  font-size:13px;
}

.card{
  background:#101010;
  border:1px solid #292929;
  border-radius:24px;
  padding:28px 22px;

  box-shadow:
    0 25px 70px rgba(0,0,0,.6);
}

.title{
  margin-bottom:23px;
}

.title h2{
  font-size:23px;
  margin-bottom:7px;
}

.title p{
  color:#858585;
  font-size:13px;
  line-height:1.5;
}

.ref-box{
  display:none;
  margin-bottom:18px;
  padding:13px;
  border-radius:12px;

  background:rgba(212,167,44,.08);
  border:1px solid rgba(212,167,44,.25);
}

.ref-box small{
  color:#777;
  font-size:10px;
  display:block;
  margin-bottom:5px;
}

.ref-box strong{
  color:#e0b83e;
  font-size:13px;
}

.field{
  margin-bottom:17px;
}

.field label{
  display:block;
  color:#cfcfcf;
  font-size:13px;
  margin-bottom:8px;
}

input{
  width:100%;
  height:50px;

  background:#070707;
  border:1px solid #292929;
  border-radius:12px;

  color:white;
  outline:none;

  padding:0 15px;
  font-size:14px;

  transition:.2s;
}

input::placeholder{
  color:#555;
}

input:focus{
  border-color:#d4a72c;

  box-shadow:
    0 0 0 2px
    rgba(212,167,44,.08);
}

.username-note{
  margin-top:6px;
  color:#666;
  font-size:11px;
}

.register-btn{
  width:100%;
  height:53px;

  margin-top:5px;

  border:none;
  border-radius:13px;

  background:
    linear-gradient(
      135deg,
      #ffe082,
      #d4a72c,
      #a77b17
    );

  color:#080808;

  font-size:15px;
  font-weight:900;
  letter-spacing:.5px;

  cursor:pointer;

  box-shadow:
    0 10px 25px
    rgba(212,167,44,.16);
}

.register-btn:active{
  transform:scale(.98);
}

.register-btn:disabled{
  cursor:not-allowed;
  opacity:.65;
}

.message{
  display:none;

  margin-top:15px;

  padding:12px;

  border-radius:10px;

  text-align:center;

  background:
    rgba(212,167,44,.08);

  border:
    1px solid
    rgba(212,167,44,.25);

  color:#e6c65c;

  font-size:13px;

  line-height:1.5;
}

.message.error{
  color:#ff7777;

  background:
    rgba(255,80,80,.07);

  border-color:
    rgba(255,80,80,.25);
}

.login{
  text-align:center;

  margin-top:23px;

  padding-top:20px;

  border-top:1px solid #222;

  color:#777;

  font-size:13px;
}

.login a{
  color:#e0b83e;

  text-decoration:none;

  font-weight:bold;
}

.back{
  display:block;

  text-align:center;

  margin-top:18px;

  color:#686868;

  text-decoration:none;

  font-size:12px;
}

.footer{
  text-align:center;

  margin-top:18px;

  color:#444;

  font-size:11px;
}

</style>

</head>


<body>


<div class="wrapper">


  <!-- ================= BRAND ================= -->

  <div class="brand">

    <div class="logo">
      LC
    </div>

    <h1>
      LINKCASH
    </h1>

    <p>
      Simple. Secure. Connected.
    </p>

  </div>



  <!-- ================= CARD ================= -->

  <div class="card">


    <div class="title">

      <h2>
        Create Account
      </h2>

      <p>
        Create your LINKCASH account to get started.
      </p>

    </div>



    <!-- ================= REFERRER ================= -->

    <div
      class="ref-box"
      id="refBox"
    >

      <small>
        INVITED BY
      </small>

      <strong
        id="refUsername"
      >
        —
      </strong>

    </div>



    <!-- ================= FORM ================= -->

    <form
      id="registerForm"
    >


      <!-- FULL NAME -->

      <div class="field">

        <label>
          Full Name
        </label>

        <input
          type="text"
          id="fullname"
          placeholder="Enter your full name"
          autocomplete="name"
          required
        >

      </div>



      <!-- USERNAME -->

      <div class="field">

        <label>
          Username
        </label>

        <input
          type="text"
          id="username"
          placeholder="Choose a username"
          minlength="3"
          maxlength="20"
          autocomplete="username"
          required
        >

        <div class="username-note">

          Username must be 3–20 characters.

          <br>

          Letters, numbers and underscore only.

        </div>

      </div>



      <!-- PHONE -->

      <div class="field">

        <label>
          Phone Number
        </label>

        <input
          type="tel"
          id="phone"
          placeholder="07XXXXXXXX"
          autocomplete="tel"
          required
        >

      </div>



      <!-- PASSWORD -->

      <div class="field">

        <label>
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Create your password"
          minlength="6"
          autocomplete="new-password"
          required
        >

      </div>



      <!-- REGISTER -->

      <button
        type="submit"
        class="register-btn"
        id="registerButton"
      >

        CREATE ACCOUNT

      </button>


    </form>



    <!-- ================= MESSAGE ================= -->

    <div
      class="message"
      id="message"
    ></div>



    <!-- ================= LOGIN ================= -->

    <div class="login">

      Already have an account?

      <a href="login.html">
        Login
      </a>

    </div>


  </div>



  <!-- ================= BACK ================= -->

  <a
    href="index.html"
    class="back"
  >

    ← Back to Home

  </a>



  <div class="footer">

    © 2026 LINKCASH

  </div>


</div>



<script>

/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

const SUPABASE_URL =
  "https://vrrglcpixeqnqqdlqtot.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_CyKL7kpQ2K5AdosXfebJCg_k-uF8OpV";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   REFERRER
===================================================== */

const urlParams =
  new URLSearchParams(
    window.location.search
  );


const referrer =
  String(
    urlParams.get("ref") || ""
  )
  .trim()
  .toLowerCase();


if(referrer){

  document.getElementById(
    "refBox"
  ).style.display = "block";


  document.getElementById(
    "refUsername"
  ).textContent =
    "@" + referrer;

}


/* =====================================================
   ELEMENTS
===================================================== */

const form =
  document.getElementById(
    "registerForm"
  );


const message =
  document.getElementById(
    "message"
  );


const registerButton =
  document.getElementById(
    "registerButton"
  );


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(
  text,
  error = false
){

  message.style.display =
    "block";

  message.className =
    error
      ? "message error"
      : "message";

  message.innerHTML =
    text;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}


/* =====================================================
   FORM SUBMIT
===================================================== */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    /* ===============================================
       BUTTON LOADING
    =============================================== */

    registerButton.disabled =
      true;

    registerButton.textContent =
      "CREATING ACCOUNT...";


    message.style.display =
      "none";


    try{


      /* =============================================
         GET FORM VALUES
      ============================================= */

      const fullname =
        document
          .getElementById("fullname")
          .value
          .trim();


      const username =
        document
          .getElementById("username")
          .value
          .trim()
          .toLowerCase();


      const phone =
        document
          .getElementById("phone")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      /* =============================================
         VALIDATION
      ============================================= */

      if(
        !fullname ||
        !username ||
        !phone ||
        !password
      ){

        throw new Error(
          "Please fill in all fields."
        );

      }


      if(
        fullname.length < 2
      ){

        throw new Error(
          "Please enter a valid full name."
        );

      }


      if(
        username.length < 3 ||
        username.length > 20
      ){

        throw new Error(
          "Username must be 3–20 characters."
        );

      }


      if(
        !/^[a-zA-Z0-9_]+$/.test(
          username
        )
      ){

        throw new Error(
          "Username can only contain letters, numbers and underscore."
        );

      }


      if(
        password.length < 6
      ){

        throw new Error(
          "Password must be at least 6 characters."
        );

      }


      /* =============================================
         CHECK USERNAME
      ============================================= */

      const usernameCheck =
        await supabaseClient
          .from("users")
          .select("id, username")
          .eq(
            "username",
            username
          )
          .maybeSingle();


      if(usernameCheck.error){

        console.error(
          "USERNAME CHECK:",
          usernameCheck.error
        );

        throw new Error(
          usernameCheck.error.message
        );

      }


      if(usernameCheck.data){

        throw new Error(
          "This username already exists. Please choose another."
        );

      }


      /* =============================================
         CHECK PHONE
      ============================================= */

      const phoneCheck =
        await supabaseClient
          .from("users")
          .select("id, phone")
          .eq(
            "phone",
            phone
          )
          .maybeSingle();


      if(phoneCheck.error){

        console.error(
          "PHONE CHECK:",
          phoneCheck.error
        );

        throw new Error(
          phoneCheck.error.message
        );

      }


      if(phoneCheck.data){

        throw new Error(
          "This phone number is already registered."
        );

      }


      /* =============================================
         CHECK REFERRER
      ============================================= */

      let validReferrer =
        null;


      if(referrer){

        const refCheck =
          await supabaseClient
            .from("users")
            .select("username")
            .eq(
              "username",
              referrer
            )
            .maybeSingle();


        if(refCheck.error){

          console.error(
            "REFERRER CHECK:",
            refCheck.error
          );

          throw new Error(
            refCheck.error.message
          );

        }


        if(refCheck.data){

          validReferrer =
            refCheck.data.username;

        }

      }


      /* =============================================
         CREATE USER DATA

         IMPORTANT:
         These are the column names
         we are using:

         fullname
         username
         phone
         password
         referrer
         joined_at
         balance
         commission
         status
         activation_fee
         payment_status
         payment_method
         payment_reference
      ============================================= */

      const newUser = {

        fullname:
          fullname,

        username:
          username,

        phone:
          phone,

        password:
          password,

        referrer:
          validReferrer,

        joined_at:
          new Date().toISOString(),

        balance:
          0,

        commission:
          0,

        status:
          "pending",

        activation_fee:
          14500,

        payment_status:
          "unpaid",

        payment_method:
          null,

        payment_reference:
          null

      };


      /* =============================================
         INSERT USER INTO SUPABASE
      ============================================= */

      const result =
        await supabaseClient
          .from("users")
          .insert(
            [newUser]
          )
          .select()
          .single();


      if(result.error){

        console.error(
          "SUPABASE INSERT ERROR:",
          result.error
        );

        throw new Error(
          result.error.message
        );

      }


      /* =============================================
         CREATED USER
      ============================================= */

      const createdUser =
        result.data;


      /* =============================================
         SAVE SAFE LOCAL USER DATA
      ============================================= */

      localStorage.setItem(
        "linkcashUser",
        JSON.stringify({

          id:
            createdUser.id,

          fullname:
            createdUser.fullname,

          username:
            createdUser.username,

          phone:
            createdUser.phone,

          referrer:
            createdUser.referrer,

          status:
            createdUser.status,

          balance:
            createdUser.balance,

          commission:
            createdUser.commission,

          activation_fee:
            createdUser.activation_fee,

          payment_status:
            createdUser.payment_status

        })
      );


      localStorage.setItem(
        "linkcashLoggedIn",
        "true"
      );


      /* =============================================
         SUCCESS MESSAGE
      ============================================= */

      showMessage(

        "Account created successfully ✓"

        +

        "<br><br>"

        +

        "Your account is now waiting for CEO approval."

        +

        "<br>"

        +

        "Opening your account..."

      );


      registerButton.textContent =
        "ACCOUNT CREATED ✓";


      /* =============================================
         OPEN PENDING DASHBOARD
      ============================================= */

      setTimeout(
        function(){

          window.location.href =
            "pending-dashboard.html";

        },
        1200
      );


    }catch(error){

      console.error(
        "REGISTRATION FAILED:",
        error
      );


      showMessage(

        "Registration failed:<br>" +

        escapeHTML(
          error.message ||
          "Unknown error"
        ),

        true

      );


      registerButton.disabled =
        false;

      registerButton.textContent =
        "CREATE ACCOUNT";

    }

  });


</script>

</body>

</html>
