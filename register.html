<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>LINKCASH - Create Account</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:#050505;
  color:#fff;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:20px;
}

.wrapper{
  width:100%;
  max-width:430px;
}

.brand{
  text-align:center;
  margin-bottom:22px;
}

.logo{
  width:70px;
  height:70px;

  margin:auto;

  border-radius:20px;

  background:
    linear-gradient(
      145deg,
      #ffe082,
      #d4a72c,
      #8f6b12
    );

  display:flex;
  align-items:center;
  justify-content:center;

  color:#090909;

  font-size:24px;
  font-weight:900;

  box-shadow:
    0 0 25px
    rgba(212,167,44,.25);
}

.brand h1{
  margin-top:13px;

  font-size:28px;

  letter-spacing:3px;
}

.brand p{
  margin-top:7px;

  color:#8d8d8d;

  font-size:13px;
}

.card{
  background:#101010;

  border:1px solid #292929;

  border-radius:24px;

  padding:27px 22px;

  box-shadow:
    0 25px 70px
    rgba(0,0,0,.6);
}

.title{
  margin-bottom:22px;
}

.title h2{
  font-size:23px;

  margin-bottom:7px;
}

.title p{
  color:#858585;

  font-size:13px;

  line-height:1.5;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;

  color:#cfcfcf;

  font-size:13px;

  margin-bottom:8px;
}

input{
  width:100%;

  height:49px;

  background:#070707;

  border:1px solid #292929;

  border-radius:12px;

  color:#fff;

  outline:none;

  padding:0 15px;

  font-size:14px;
}

input::placeholder{
  color:#555;
}

input:focus{
  border-color:#d4a72c;

  box-shadow:
    0 0 0 2px
    rgba(212,167,44,.08);
}

.password-wrap{
  position:relative;
}

.password-wrap input{
  padding-right:65px;
}

.show-password{
  position:absolute;

  right:12px;

  top:50%;

  transform:translateY(-50%);

  background:none;

  border:none;

  color:#d4a72c;

  font-size:12px;

  font-weight:bold;

  cursor:pointer;
}

.register-btn{
  width:100%;

  height:53px;

  margin-top:6px;

  border:none;

  border-radius:13px;

  background:
    linear-gradient(
      135deg,
      #ffe082,
      #d4a72c,
      #a77b17
    );

  color:#080808;

  font-size:15px;

  font-weight:900;

  cursor:pointer;

  box-shadow:
    0 10px 25px
    rgba(212,167,44,.16);
}

.register-btn:active{
  transform:scale(.98);
}

.register-btn:disabled{
  opacity:.6;

  cursor:not-allowed;
}

.message{
  display:none;

  margin-top:15px;

  padding:13px;

  border-radius:10px;

  text-align:center;

  font-size:12px;

  line-height:1.5;
}

.message.success{
  display:block;

  background:
    rgba(40,180,100,.10);

  border:
    1px solid
    rgba(40,180,100,.3);

  color:#62df91;
}

.message.error{
  display:block;

  background:
    rgba(220,60,60,.10);

  border:
    1px solid
    rgba(220,60,60,.3);

  color:#ff7777;
}

.message.info{
  display:block;

  background:
    rgba(212,167,44,.08);

  border:
    1px solid
    rgba(212,167,44,.25);

  color:#e6c65c;
}

.login-link{
  text-align:center;

  margin-top:22px;

  padding-top:20px;

  border-top:1px solid #222;

  color:#777;

  font-size:13px;
}

.login-link a{
  color:#e0b83e;

  text-decoration:none;

  font-weight:bold;
}

.back{
  display:block;

  text-align:center;

  margin-top:18px;

  color:#686868;

  text-decoration:none;

  font-size:12px;
}

.footer{
  text-align:center;

  margin-top:18px;

  color:#444;

  font-size:11px;
}

.connection{
  display:flex;

  align-items:center;

  justify-content:center;

  gap:7px;

  margin-top:13px;

  color:#555;

  font-size:9px;
}

.connection-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#777;
}

.connection-dot.online{
  background:#58d88a;

  box-shadow:
    0 0 8px
    rgba(88,216,138,.5);
}

.connection-dot.error{
  background:#ff5555;
}

</style>

</head>


<body>


<div class="wrapper">


<!-- BRAND -->

<div class="brand">

  <div class="logo">
    LC
  </div>

  <h1>
    LINKCASH
  </h1>

  <p>
    Simple. Secure. Connected.
  </p>

</div>


<!-- CARD -->

<div class="card">


  <div class="title">

    <h2>
      Create Account
    </h2>

    <p>
      Register your LINKCASH account.
    </p>

  </div>


  <!-- FORM -->

  <form
    id="registerForm"
    novalidate
  >


    <!-- FULL NAME -->

    <div class="field">

      <label>
        Full Name
      </label>

      <input
        type="text"
        id="fullname"
        placeholder="Enter your full name"
        autocomplete="name"
        required
      >

    </div>


    <!-- USERNAME -->

    <div class="field">

      <label>
        Username
      </label>

      <input
        type="text"
        id="username"
        placeholder="Choose your username"
        autocomplete="username"
        required
      >

    </div>


    <!-- PHONE -->

    <div class="field">

      <label>
        Phone Number
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="Enter phone number"
        autocomplete="tel"
        required
      >

    </div>


    <!-- EMAIL -->

    <div class="field">

      <label>
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
      >

    </div>


    <!-- REFERRER -->

    <div class="field">

      <label>
        Referral Username
      </label>

      <input
        type="text"
        id="referrer"
        placeholder="Enter referral username"
      >

    </div>


    <!-- PASSWORD -->

    <div class="field">

      <label>
        Password
      </label>

      <div class="password-wrap">

        <input
          type="password"
          id="password"
          placeholder="Create password"
          autocomplete="new-password"
          required
        >

        <button
          type="button"
          class="show-password"
          id="showPassword"
        >
          SHOW
        </button>

      </div>

    </div>


    <!-- CONFIRM PASSWORD -->

    <div class="field">

      <label>
        Confirm Password
      </label>

      <div class="password-wrap">

        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm password"
          autocomplete="new-password"
          required
        >

        <button
          type="button"
          class="show-password"
          id="showConfirmPassword"
        >
          SHOW
        </button>

      </div>

    </div>


    <!-- BUTTON -->

    <button
      type="submit"
      class="register-btn"
      id="registerBtn"
    >
      CREATE ACCOUNT
    </button>

  </form>


  <!-- MESSAGE -->

  <div
    class="message"
    id="message"
  ></div>


  <!-- CONNECTION -->

  <div class="connection">

    <div
      class="connection-dot"
      id="connectionDot"
    ></div>

    <span id="connectionText">
      CHECKING SUPABASE...
    </span>

  </div>


  <!-- LOGIN -->

  <div class="login-link">

    Already have an account?

    <a href="login.html">
      Login
    </a>

  </div>


</div>


<!-- BACK -->

<a
  href="index.html"
  class="back"
>
  ← Back to Home
</a>


<div class="footer">
  © 2026 LINKCASH
</div>


<script>

/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

const SUPABASE_URL =
  "https://vrrglcpixeqnqqdlqtot.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_CyKL7kpQ2K5AdosXfebJCg-k-uF8OpV";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   ELEMENTS
===================================================== */

const form =
  document.getElementById(
    "registerForm"
  );

const button =
  document.getElementById(
    "registerBtn"
  );

const message =
  document.getElementById(
    "message"
  );

const connectionDot =
  document.getElementById(
    "connectionDot"
  );

const connectionText =
  document.getElementById(
    "connectionText"
  );


/* =====================================================
   PASSWORD BUTTONS
===================================================== */

document
.getElementById("showPassword")
.addEventListener(
  "click",
  function(){

    const input =
      document.getElementById(
        "password"
      );

    if(
      input.type === "password"
    ){

      input.type = "text";

      this.textContent =
        "HIDE";

    }else{

      input.type = "password";

      this.textContent =
        "SHOW";

    }

  }
);


document
.getElementById("showConfirmPassword")
.addEventListener(
  "click",
  function(){

    const input =
      document.getElementById(
        "confirmPassword"
      );

    if(
      input.type === "password"
    ){

      input.type = "text";

      this.textContent =
        "HIDE";

    }else{

      input.type = "password";

      this.textContent =
        "SHOW";

    }

  }
);


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  type
){

  message.className =
    "message " + type;

  message.textContent =
    text;

  message.style.display =
    "block";

}


function clearMessage(){

  message.className =
    "message";

  message.textContent =
    "";

  message.style.display =
    "none";

}


/* =====================================================
   TEST SUPABASE CONNECTION
===================================================== */

async function testConnection(){

  connectionText.textContent =
    "CHECKING SUPABASE...";

  connectionDot.className =
    "connection-dot";


  try{

    const result =
      await supabaseClient
      .from("users")
      .select("id")
      .limit(1);


    if(result.error){

      console.error(
        "DATABASE CONNECTION ERROR:",
        result.error
      );

      connectionDot.className =
        "connection-dot error";

      connectionText.textContent =
        "DATABASE CONNECTION ERROR";

      return false;

    }


    connectionDot.className =
      "connection-dot online";

    connectionText.textContent =
      "SUPABASE CONNECTED";

    return true;


  }catch(error){

    console.error(
      error
    );

    connectionDot.className =
      "connection-dot error";

    connectionText.textContent =
      "SUPABASE CONNECTION FAILED";

    return false;

  }

}


/* =====================================================
   CHECK USERNAME
===================================================== */

async function usernameExists(
  username
){

  const result =
    await supabaseClient
    .from("users")
    .select("id")
    .eq(
      "username",
      username
    )
    .maybeSingle();


  if(result.error){

    throw new Error(
      result.error.message
    );

  }


  return !!result.data;

}


/* =====================================================
   REGISTER
===================================================== */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    clearMessage();


    /* ===============================================
       GET VALUES
    =============================================== */

    const fullname =
      document
      .getElementById("fullname")
      .value
      .trim();

    const username =
      document
      .getElementById("username")
      .value
      .trim()
      .toLowerCase();

    const phone =
      document
      .getElementById("phone")
      .value
      .trim();

    const email =
      document
      .getElementById("email")
      .value
      .trim()
      .toLowerCase();

    const referrer =
      document
      .getElementById("referrer")
      .value
      .trim()
      .toLowerCase();

    const password =
      document
      .getElementById("password")
      .value;

    const confirmPassword =
      document
      .getElementById("confirmPassword")
      .value;


    /* ===============================================
       VALIDATION
    =============================================== */

    if(!fullname){

      showMessage(
        "Please enter your full name.",
        "error"
      );

      return;

    }


    if(!username){

      showMessage(
        "Please choose a username.",
        "error"
      );

      return;

    }


    if(username.length < 3){

      showMessage(
        "Username must contain at least 3 characters.",
        "error"
      );

      return;

    }


    if(!phone){

      showMessage(
        "Please enter your phone number.",
        "error"
      );

      return;

    }


    if(!password){

      showMessage(
        "Please create a password.",
        "error"
      );

      return;

    }


    if(password.length < 6){

      showMessage(
        "Password must contain at least 6 characters.",
        "error"
      );

      return;

    }


    if(password !== confirmPassword){

      showMessage(
        "Passwords do not match.",
        "error"
      );

      return;

    }


    /* ===============================================
       LOADING
    =============================================== */

    button.disabled =
      true;

    button.textContent =
      "CREATING ACCOUNT...";


    try{


      /* =============================================
         CHECK USERNAME
      ============================================= */

      const exists =
        await usernameExists(
          username
        );


      if(exists){

        throw new Error(
          "This username is already registered."
        );

      }


      /* =============================================
         PREPARE USER
      ============================================= */

      const userData = {

        full_name:
          fullname,

        username:
          username,

        phone:
          phone,

        email:
          email || null,

        password:
          password,

        referrer:
          referrer || null,

        status:
          "pending",

        balance:
          0,

        commission:
          0,

        activation_fee:
          14500,

        payment_status:
          "unpaid"

      };


      /* =============================================
         INSERT USER
      ============================================= */

      const result =
        await supabaseClient
        .from("users")
        .insert([
          userData
        ])
        .select()
        .single();


      /* =============================================
         DATABASE ERROR
      ============================================= */

      if(result.error){

        console.error(
          "REGISTRATION DATABASE ERROR:",
          result.error
        );

        throw new Error(
          result.error.message
        );

      }


      /* =============================================
         SUCCESS
      ============================================= */

      showMessage(
        "Account created successfully ✓ Redirecting to login...",
        "success"
      );


      button.textContent =
        "ACCOUNT CREATED ✓";


      /* =============================================
         REDIRECT
      ============================================= */

      setTimeout(
        function(){

          window.location.href =
            "login.html";

        },
        1200
      );


    }catch(error){

      console.error(
        "LINKCASH REGISTRATION ERROR:",
        error
      );


      showMessage(
        error.message ||
        "Registration failed. Please try again.",
        "error"
      );


      button.disabled =
        false;

      button.textContent =
        "CREATE ACCOUNT";

    }

  });


/* =====================================================
   START CONNECTION TEST
===================================================== */

testConnection();

</script>

</body>
</html>
