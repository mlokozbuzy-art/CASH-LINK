<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LINKCASH - Register</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #050505;
      color: white;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .wrapper {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 70px;
      height: 70px;

      margin: auto;

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          #ffe082,
          #d4a72c,
          #8f6b12
        );

      display: flex;
      align-items: center;
      justify-content: center;

      color: #090909;

      font-size: 24px;
      font-weight: 900;

      box-shadow:
        0 0 25px rgba(212,167,44,.25);
    }

    .brand h1 {
      margin-top: 13px;

      font-size: 28px;

      letter-spacing: 3px;
    }

    .brand p {
      margin-top: 7px;

      color: #8d8d8d;

      font-size: 13px;
    }

    .card {
      background: #101010;

      border: 1px solid #292929;

      border-radius: 24px;

      padding: 28px 22px;

      box-shadow:
        0 25px 70px rgba(0,0,0,.6);
    }

    .title {
      margin-bottom: 23px;
    }

    .title h2 {
      font-size: 23px;

      margin-bottom: 7px;
    }

    .title p {
      color: #858585;

      font-size: 13px;
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;

      color: #cfcfcf;

      font-size: 13px;

      margin-bottom: 8px;
    }

    input {
      width: 100%;

      height: 50px;

      background: #070707;

      border: 1px solid #292929;

      border-radius: 12px;

      color: white;

      outline: none;

      padding: 0 15px;

      font-size: 14px;

      transition: .2s;
    }

    input::placeholder {
      color: #555;
    }

    input:focus {
      border-color: #d4a72c;

      box-shadow:
        0 0 0 2px rgba(212,167,44,.08);
    }

    .username-note {
      margin-top: 6px;

      color: #666;

      font-size: 11px;
    }

    .register-btn {
      width: 100%;

      height: 53px;

      margin-top: 5px;

      border: none;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          #ffe082,
          #d4a72c,
          #a77b17
        );

      color: #080808;

      font-size: 15px;

      font-weight: 900;

      letter-spacing: .5px;

      cursor: pointer;

      box-shadow:
        0 10px 25px rgba(212,167,44,.16);
    }

    .register-btn:active {
      transform: scale(.98);
    }

    .message {
      display: none;

      margin-top: 15px;

      padding: 12px;

      border-radius: 10px;

      text-align: center;

      background:
        rgba(212,167,44,.08);

      border:
        1px solid rgba(212,167,44,.25);

      color: #e6c65c;

      font-size: 13px;
    }

    .login {
      text-align: center;

      margin-top: 23px;

      padding-top: 20px;

      border-top:
        1px solid #222;

      color: #777;

      font-size: 13px;
    }

    .login a {
      color: #e0b83e;

      text-decoration: none;

      font-weight: bold;
    }

    .back {
      display: block;

      text-align: center;

      margin-top: 18px;

      color: #686868;

      text-decoration: none;

      font-size: 12px;
    }

    .footer {
      text-align: center;

      margin-top: 18px;

      color: #444;

      font-size: 11px;
    }
  </style>
</head>

<body>

  <div class="wrapper">

    <!-- BRAND -->

    <div class="brand">

      <div class="logo">
        LC
      </div>

      <h1>LINKCASH</h1>

      <p>Simple. Secure. Connected.</p>

    </div>


    <!-- REGISTER -->

    <div class="card">

      <div class="title">

        <h2>Create Account</h2>

        <p>
          Create your LINKCASH account to get started.
        </p>

      </div>


      <form id="registerForm">

        <!-- FULL NAME -->

        <div class="field">

          <label>
            Full Name
          </label>

          <input
            type="text"
            id="fullname"
            placeholder="Enter your full name"
            required
          >

        </div>


        <!-- USERNAME -->

        <div class="field">

          <label>
            Username
          </label>

          <input
            type="text"
            id="username"
            placeholder="Choose a username"
            minlength="3"
            maxlength="20"
            required
          >

          <div class="username-note">
            Username must be 3–20 characters.
          </div>

        </div>


        <!-- PHONE -->

        <div class="field">

          <label>
            Phone Number
          </label>

          <input
            type="tel"
            id="phone"
            placeholder="07XXXXXXXX"
            required
          >

        </div>


        <!-- EMAIL -->

        <div class="field">

          <label>
            Email Address
          </label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          >

        </div>


        <!-- PASSWORD -->

        <div class="field">

          <label>
            Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="Create your password"
            minlength="6"
            required
          >

        </div>


        <!-- BUTTON -->

        <button
          type="submit"
          class="register-btn"
        >
          CREATE ACCOUNT
        </button>

      </form>


      <!-- MESSAGE -->

      <div
        class="message"
        id="message"
      ></div>


      <!-- LOGIN -->

      <div class="login">

        Already have an account?

        <a href="login.html">
          Login
        </a>

      </div>

    </div>


    <!-- BACK -->

    <a
      href="index.html"
      class="back"
    >
      ← Back to Home
    </a>


    <div class="footer">
      © 2026 LINKCASH
    </div>

  </div>


  <script>

    const form =
      document.getElementById("registerForm");

    const message =
      document.getElementById("message");


    form.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();


        const fullname =
          document
            .getElementById("fullname")
            .value
            .trim();


        const username =
          document
            .getElementById("username")
            .value
            .trim()
            .toLowerCase();


        const phone =
          document
            .getElementById("phone")
            .value
            .trim();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        /* VALIDATION */

        if (
          !fullname ||
          !username ||
          !phone ||
          !email ||
          !password
        ) {

          alert(
            "Please fill in all fields."
          );

          return;

        }


        if (username.length < 3) {

          alert(
            "Username must contain at least 3 characters."
          );

          return;

        }


        /* CHECK EXISTING USER */

        const existingUser =
          localStorage.getItem(
            "linkcashUser"
          );


        if (existingUser) {

          const oldUser =
            JSON.parse(existingUser);


          if (
            oldUser.username === username
          ) {

            alert(
              "This username already exists."
            );

            return;

          }

        }


        /* CREATE USER */

        const user = {

          fullname:
            fullname,

          username:
            username,

          phone:
            phone,

          email:
            email,

          password:
            password

        };


        /* SAVE ACCOUNT */

        localStorage.setItem(
          "linkcashUser",
          JSON.stringify(user)
        );


        /* REMOVE OLD LOGIN */

        localStorage.removeItem(
          "linkcashLoggedIn"
        );


        /* SUCCESS */

        message.style.display =
          "block";


        message.textContent =
          "Account created successfully ✓";


        form.reset();


        /* GO LOGIN */

        setTimeout(
          function() {

            window.location.href =
              "login.html";

          },
          1200
        );

      }
    );

  </script>

</body>
</html>
