<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LINKCASH - Create Account</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:#050505;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.wrapper{
  width:100%;
  max-width:440px;
}

.brand{
  text-align:center;
  margin-bottom:22px;
}

.logo{
  width:68px;
  height:68px;
  margin:auto;
  border-radius:19px;
  background:linear-gradient(145deg,#ffe082,#d4a72c,#8f6b12);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#080808;
  font-size:23px;
  font-weight:900;
  box-shadow:0 0 28px rgba(212,167,44,.2);
}

.brand h1{
  margin-top:12px;
  font-size:27px;
  letter-spacing:3px;
}

.brand p{
  margin-top:6px;
  color:#777;
  font-size:12px;
}

.card{
  background:#101010;
  border:1px solid #292929;
  border-radius:23px;
  padding:25px 21px;
  box-shadow:0 25px 70px rgba(0,0,0,.6);
}

.title{
  margin-bottom:20px;
}

.title h2{
  font-size:22px;
  margin-bottom:6px;
}

.title p{
  color:#777;
  font-size:12px;
  line-height:1.5;
}

.ref-box{
  display:none;
  margin-bottom:17px;
  padding:12px;
  border-radius:12px;
  background:rgba(212,167,44,.08);
  border:1px solid rgba(212,167,44,.25);
}

.ref-box small{
  display:block;
  color:#666;
  font-size:9px;
  margin-bottom:4px;
}

.ref-box strong{
  color:#e0b83e;
  font-size:13px;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  color:#ccc;
  font-size:12px;
  margin-bottom:7px;
}

input{
  width:100%;
  height:49px;
  background:#070707;
  border:1px solid #292929;
  border-radius:11px;
  color:white;
  outline:none;
  padding:0 14px;
  font-size:14px;
}

input::placeholder{
  color:#555;
}

input:focus{
  border-color:#d4a72c;
  box-shadow:0 0 0 2px rgba(212,167,44,.07);
}

.note{
  color:#555;
  font-size:9px;
  margin-top:5px;
}

.register-btn{
  width:100%;
  height:52px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#ffe082,#d4a72c,#a77b17);
  color:#080808;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
  margin-top:4px;
}

.register-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.message{
  display:none;
  margin-top:14px;
  padding:12px;
  border-radius:10px;
  text-align:center;
  font-size:12px;
  line-height:1.5;
}

.message.error{
  display:block;
  background:rgba(255,70,70,.08);
  border:1px solid rgba(255,70,70,.25);
  color:#ff8585;
}

.message.success{
  display:block;
  background:rgba(70,220,130,.08);
  border:1px solid rgba(70,220,130,.25);
  color:#69df9b;
}

.login{
  text-align:center;
  margin-top:20px;
  padding-top:18px;
  border-top:1px solid #222;
  color:#777;
  font-size:12px;
}

.login a{
  color:#e0b83e;
  text-decoration:none;
  font-weight:bold;
}

.back{
  display:block;
  text-align:center;
  margin-top:17px;
  color:#666;
  text-decoration:none;
  font-size:11px;
}

.footer{
  text-align:center;
  margin-top:15px;
  color:#3f3f3f;
  font-size:10px;
}

.loading{
  display:none;
  text-align:center;
  margin-top:12px;
  color:#d4a72c;
  font-size:11px;
}

@media(max-width:360px){
  .card{
    padding:22px 17px;
  }
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="brand">
    <div class="logo">LC</div>
    <h1>LINKCASH</h1>
    <p>Simple. Secure. Connected.</p>
  </div>

  <div class="card">

    <div class="title">
      <h2>Create Account</h2>
      <p>
        Create your LINKCASH account and continue to activation.
      </p>
    </div>

    <!-- REFERRER -->

    <div class="ref-box" id="refBox">
      <small>INVITED BY</small>
      <strong id="refUsername">—</strong>
    </div>

    <form id="registerForm">

      <div class="field">
        <label>Full Name</label>
        <input
          type="text"
          id="fullname"
          placeholder="Enter your full name"
          autocomplete="name"
          required
        >
      </div>

      <div class="field">
        <label>Username</label>
        <input
          type="text"
          id="username"
          placeholder="Choose a username"
          minlength="3"
          maxlength="20"
          autocomplete="username"
          required
        >
        <div class="note">
          3–20 characters. Letters, numbers and underscore only.
        </div>
      </div>

      <div class="field">
        <label>Phone Number</label>
        <input
          type="tel"
          id="phone"
          placeholder="07XXXXXXXX"
          autocomplete="tel"
          required
        >
      </div>

      <div class="field">
        <label>Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">
