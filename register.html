<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LINKCASH - Create Account</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:#050505;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.wrapper{
  width:100%;
  max-width:430px;
}

.brand{
  text-align:center;
  margin-bottom:25px;
}

.logo{
  width:70px;
  height:70px;
  margin:auto;
  border-radius:20px;

  background:linear-gradient(
    145deg,
    #ffe082,
    #d4a72c,
    #8f6b12
  );

  display:flex;
  align-items:center;
  justify-content:center;

  color:#090909;
  font-size:24px;
  font-weight:900;

  box-shadow:
    0 0 25px rgba(212,167,44,.25);
}

.brand h1{
  margin-top:13px;
  font-size:28px;
  letter-spacing:3px;
}

.brand p{
  margin-top:7px;
  color:#8d8d8d;
  font-size:13px;
}

.card{
  background:#101010;
  border:1px solid #292929;
  border-radius:24px;
  padding:28px 22px;

  box-shadow:
    0 25px 70px rgba(0,0,0,.6);
}

.title{
  margin-bottom:23px;
}

.title h2{
  font-size:23px;
  margin-bottom:7px;
}

.title p{
  color:#858585;
  font-size:13px;
  line-height:1.5;
}

.field{
  margin-bottom:16px;
}

.field label{
  display:block;
  color:#cfcfcf;
  font-size:13px;
  margin-bottom:8px;
}

input{
  width:100%;
  height:50px;

  background:#070707;

  border:1px solid #292929;
  border-radius:12px;

  color:#fff;

  outline:none;

  padding:0 15px;

  font-size:14px;
}

input::placeholder{
  color:#555;
}

input:focus{
  border-color:#d4a72c;

  box-shadow:
    0 0 0 2px rgba(212,167,44,.08);
}

.password-wrap{
  position:relative;
}

.password-wrap input{
  padding-right:65px;
}

.show-password{
  position:absolute;

  right:12px;
  top:50%;

  transform:translateY(-50%);

  background:none;
  border:none;

  color:#d4a72c;

  font-size:12px;
  font-weight:bold;

  cursor:pointer;
}

.referral-box{

  margin-bottom:18px;

  padding:13px;

  border-radius:12px;

  background:
    rgba(212,167,44,.07);

  border:
    1px solid rgba(212,167,44,.22);

}

.referral-title{

  color:#d4a72c;

  font-size:11px;

  font-weight:bold;

  margin-bottom:5px;

  text-transform:uppercase;

  letter-spacing:.5px;

}

.referral-value{

  color:#fff;

  font-size:14px;

  font-weight:bold;

  word-break:break-word;

}

.referral-box.none{

  display:none;
}

.register-btn{

  width:100%;

  height:53px;

  margin-top:5px;

  border:none;

  border-radius:13px;

  background:
    linear-gradient(
      135deg,
      #ffe082,
      #d4a72c,
      #a77b17
    );

  color:#080808;

  font-size:15px;

  font-weight:900;

  cursor:pointer;
}

.register-btn:active{
  transform:scale(.98);
}

.register-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{

  display:none;

  margin-top:15px;

  padding:13px;

  border-radius:10px;

  text-align:center;

  font-size:12px;

  line-height:1.5;
}

.message.success{

  display:block;

  background:
    rgba(40,180,100,.10);

  border:
    1px solid rgba(40,180,100,.3);

  color:#62df91;
}

.message.error{

  display:block;

  background:
    rgba(220,60,60,.10);

  border:
    1px solid rgba(220,60,60,.3);

  color:#ff7777;
}

.message.info{

  display:block;

  background:
    rgba(212,167,44,.08);

  border:
    1px solid rgba(212,167,44,.25);

  color:#e6c65c;
}

.login{

  text-align:center;

  margin-top:23px;

  padding-top:20px;

  border-top:1px solid #222;

  color:#777;

  font-size:13px;
}

.login a{

  color:#e0b83e;

  text-decoration:none;

  font-weight:bold;
}

.back{

  display:block;

  text-align:center;

  margin-top:18px;

  color:#686868;

  text-decoration:none;

  font-size:12px;
}

.footer{

  text-align:center;

  margin-top:18px;

  color:#444;

  font-size:11px;
}

.connection{

  display:flex;

  justify-content:center;

  align-items:center;

  gap:7px;

  margin-top:13px;

  color:#555;

  font-size:9px;
}

.connection-dot{

  width:7px;
  height:7px;

  border-radius:50%;

  background:#777;
}

.connection-dot.online{

  background:#58d88a;

  box-shadow:
    0 0 8px rgba(88,216,138,.5);
}

.connection-dot.error{

  background:#ff5555;
}

</style>

</head>

<body>

<div class="wrapper">

  <!-- BRAND -->

  <div class="brand">

    <div class="logo">
      LC
    </div>

    <h1>
      LINKCASH
    </h1>

    <p>
      Simple. Secure. Connected.
    </p>

  </div>


  <!-- CARD -->

  <div class="card">

    <div class="title">

      <h2>
        Create Account
      </h2>

      <p>
        Create your LINKCASH account below.
      </p>

    </div>


    <!-- REFERRAL -->

    <div
      class="referral-box none"
      id="referralBox"
    >

      <div class="referral-title">
        Referred by
      </div>

      <div
        class="referral-value"
        id="referralValue"
      >
      </div>

    </div>


    <!-- FORM -->

    <form
      id="registerForm"
      novalidate
    >


      <!-- FULL NAME -->

      <div class="field">

        <label>
          Full Name
        </label>

        <input
          type="text"
          id="fullname"
          placeholder="Enter your full name"
          autocomplete="name"
          required
        >

      </div>


      <!-- USERNAME -->

      <div class="field">

        <label>
          Username
        </label>

        <input
          type="text"
          id="username"
          placeholder="Choose a username"
          autocomplete="username"
          required
        >

      </div>


      <!-- PHONE -->

      <div class="field">

        <label>
          Phone Number
        </label>

        <input
          type="tel"
          id="phone"
          placeholder="Enter phone number"
          autocomplete="tel"
          required
        >

      </div>


      <!-- PASSWORD -->

      <div class="field">

        <label>
          Password
        </label>

        <div class="password-wrap">

          <input
            type="password"
            id="password"
            placeholder="Create a password"
            autocomplete="new-password"
            required
          >

          <button
            type="button"
            class="show-password"
            id="showPassword"
          >
            SHOW
          </button>

        </div>

      </div>


      <!-- CONFIRM PASSWORD -->

      <div class="field">

        <label>
          Confirm Password
        </label>

        <div class="password-wrap">

          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            autocomplete="new-password"
            required
          >

          <button
            type="button"
            class="show-password"
            id="showConfirmPassword"
          >
            SHOW
          </button>

        </div>

      </div>


      <!-- BUTTON -->

      <button
        type="submit"
        class="register-btn"
        id="registerBtn"
      >
        CREATE ACCOUNT
      </button>

    </form>


    <!-- MESSAGE -->

    <div
      class="message"
      id="message"
    ></div>


    <!-- CONNECTION -->

    <div class="connection">

      <div
        class="connection-dot"
        id="connectionDot"
      ></div>

      <span id="connectionText">
        CHECKING SUPABASE...
      </span>

    </div>


    <!-- LOGIN -->

    <div class="login">

      Already have an account?

      <a href="login.html">
        Login
      </a>

    </div>

  </div>


  <!-- BACK -->

  <a
    href="index.html"
    class="back"
  >
    ← Back to Home
  </a>


  <!-- FOOTER -->

  <div class="footer">
    © 2026 LINKCASH
  </div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://vrrglcpixeqnqqdlqtot.supabase.co";

const SUPABASE_KEY =
"sb_publishable_CyKL7kpQ2K5AdosXfebCGk-uF8OpV";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================
   ELEMENTS
========================================= */

const form =
document.getElementById(
  "registerForm"
);

const fullnameInput =
document.getElementById(
  "fullname"
);

const usernameInput =
document.getElementById(
  "username"
);

const phoneInput =
document.getElementById(
  "phone"
);

const passwordInput =
document.getElementById(
  "password"
);

const confirmPasswordInput =
document.getElementById(
  "confirmPassword"
);

const registerBtn =
document.getElementById(
  "registerBtn"
);

const message =
document.getElementById(
  "message"
);

const referralBox =
document.getElementById(
  "referralBox"
);

const referralValue =
document.getElementById(
  "referralValue"
);

const connectionDot =
document.getElementById(
  "connectionDot"
);

const connectionText =
document.getElementById(
  "connectionText"
);


/* =========================================
   GET REFERRER FROM URL
========================================= */

const urlParams =
new URLSearchParams(
  window.location.search
);

const referralUsername =
(
  urlParams.get("ref") ||
  ""
)
.trim()
.toLowerCase();


/* =========================================
   SHOW REFERRER
========================================= */

if(referralUsername){

  referralBox.classList.remove(
    "none"
  );

  referralValue.textContent =
    referralUsername;

}


/* =========================================
   SHOW PASSWORD
========================================= */

document
.getElementById("showPassword")
.addEventListener(
  "click",
  function(){

    if(
      passwordInput.type ===
      "password"
    ){

      passwordInput.type =
        "text";

      this.textContent =
        "HIDE";

    }else{

      passwordInput.type =
        "password";

      this.textContent =
        "SHOW";

    }

  }
);


/* =========================================
   SHOW CONFIRM PASSWORD
========================================= */

document
.getElementById("showConfirmPassword")
.addEventListener(
  "click",
  function(){

    if(
      confirmPasswordInput.type ===
      "password"
    ){

      confirmPasswordInput.type =
        "text";

      this.textContent =
        "HIDE";

    }else{

      confirmPasswordInput.type =
        "password";

      this.textContent =
        "SHOW";

    }

  }
);


/* =========================================
   MESSAGE
========================================= */

function showMessage(
  text,
  type
){

  message.className =
    "message " + type;

  message.textContent =
    text;

  message.style.display =
    "block";

}


function clearMessage(){

  message.className =
    "message";

  message.textContent =
    "";

  message.style.display =
    "none";

}


/* =========================================
   CONNECTION CHECK
========================================= */

async function checkConnection(){

  try{

    const result =
      await supabaseClient
      .from("users")
      .select("id")
      .limit(1);


    if(result.error){

      connectionDot.className =
        "connection-dot error";

      connectionText.textContent =
        "DATABASE CONNECTION ERROR";

      console.error(
        result.error
      );

      return;

    }


    connectionDot.className =
      "connection-dot online";

    connectionText.textContent =
      "SUPABASE CONNECTED";


  }catch(error){

    connectionDot.className =
      "connection-dot error";

    connectionText.textContent =
      "SUPABASE CONNECTION FAILED";

    console.error(error);

  }

}


/* =========================================
   CHECK REFERRER
========================================= */

async function getReferrer(){

  if(!referralUsername){

    return null;

  }


  const result =
    await supabaseClient
    .from("users")
    .select(
      "id,username,status"
    )
    .eq(
      "username",
      referralUsername
    )
    .maybeSingle();


  if(result.error){

    console.error(
      "REFERRER ERROR:",
      result.error
    );

    return null;

  }


  return result.data || null;

}


/* =========================================
   CHECK USERNAME
========================================= */

async function usernameExists(
  username
){

  const result =
    await supabaseClient
    .from("users")
    .select("id")
    .eq(
      "username",
      username
    )
    .maybeSingle();


  if(result.error){

    throw new Error(
      result.error.message
    );

  }


  return !!result.data;

}


/* =========================================
   REGISTER
========================================= */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    clearMessage();


    const fullname =
      fullnameInput.value
      .trim();

    const username =
      usernameInput.value
      .trim()
      .toLowerCase();

    const phone =
      phoneInput.value
      .trim();

    const password =
      passwordInput.value;

    const confirmPassword =
      confirmPasswordInput.value;


    /* ==============================
       VALIDATION
    ============================== */

    if(!fullname){

      showMessage(
        "Please enter your full name.",
        "error"
      );

      fullnameInput.focus();

      return;

    }


    if(!username){

      showMessage(
        "Please choose a username.",
        "error"
      );

      usernameInput.focus();

      return;

    }


    if(
      username.length < 3
    ){

      showMessage(
        "Username must be at least 3 characters.",
        "error"
      );

      usernameInput.focus();

      return;

    }


    if(
      !/^[a-z0-9_]+$/.test(
        username
      )
    ){

      showMessage(
        "Username can contain only letters, numbers and underscore.",
        "error"
      );

      usernameInput.focus();

      return;

    }


    if(!phone){

      showMessage(
        "Please enter your phone number.",
        "error"
      );

      phoneInput.focus();

      return;

    }


    if(!password){

      showMessage(
        "Please create a password.",
        "error"
      );

      passwordInput.focus();

      return;

    }


    if(
      password.length < 6
    ){

      showMessage(
        "Password must be at least 6 characters.",
        "error"
      );

      passwordInput.focus();

      return;

    }


    if(
      password !==
      confirmPassword
    ){

      showMessage(
        "Passwords do not match.",
        "error"
      );

      confirmPasswordInput.focus();

      return;

    }


    registerBtn.disabled =
      true;

    registerBtn.textContent =
      "CREATING ACCOUNT...";


    try{


      /* ==============================
         CHECK USERNAME
      ============================== */

      const exists =
        await usernameExists(
          username
        );


      if(exists){

        throw new Error(
          "This username is already registered."
        );

      }


      /* ==============================
         REFERRER
      ============================== */

      let referrer = null;

      let referrerUser = null;


      if(referralUsername){

        referrerUser =
          await getReferrer();


        if(!referrerUser){

          throw new Error(
            "Referral link is invalid. Please check the referral link."
          );

        }


        if(
          String(
            referrerUser.status
          ).toLowerCase()
          !==
          "active"
        ){

          throw new Error(
            "This referral account is not active."
          );

        }


        referrer =
          referrerUser.username;

      }


      /* ==============================
         CREATE USER
      ============================== */

      const insertResult =
        await supabaseClient
        .from("users")
        .insert({

          username:
            username,

          fullname:
            fullname,

          phone:
            phone,

          password:
            password,

          role:
            "user",

          status:
            "pending",

          balance:
            0,

          commission:
            0,

          referrer:
            referrer,

          activation_fee:
            0,

          payment_status:
            "pending"

        })
        .select()
        .single();


      if(insertResult.error){

        console.error(
          "REGISTER ERROR:",
          insertResult.error
        );

        throw new Error(
          insertResult.error.message
        );

      }


      const newUser =
        insertResult.data;


      /* ==============================
         CREATE LEVEL 1 REFERRAL
      ============================== */

      if(
        referrerUser &&
        newUser
      ){

        const referralResult =
          await supabaseClient
          .from("referrals")
          .insert({

            referrer_id:
              referrerUser.id,

            referred_user_id:
              newUser.id,

            level:
              1

          });


        if(referralResult.error){

          console.error(
            "REFERRAL ERROR:",
            referralResult.error
          );

          /*
           * Account tayari imetengenezwa.
           * Hatutafuta account kwa sababu
           * referral inaweza kurekebishwa baadaye.
           */

        }

      }


      /* ==============================
         SAVE LOCAL DATA
      ============================== */

      localStorage.setItem(
        "linkcashUser",
        JSON.stringify({

          id:
            newUser.id,

          username:
            newUser.username,

          fullname:
            newUser.fullname,

          phone:
            newUser.phone,

          role:
            "user",

          status:
            "pending",

          balance:
            0,

          commission:
            0,

          referrer:
            referrer

        })
      );


      localStorage.setItem(
        "linkcashLoggedIn",
        "true"
      );


      /* ==============================
         SUCCESS
      ============================== */

      showMessage(
        "Account created successfully ✓ Your account is waiting for CEO approval.",
        "success"
      );


      registerBtn.textContent =
        "ACCOUNT CREATED ✓";


      setTimeout(
        function(){

          window.location.replace(
            "pending-dashboard.html"
          );

        },
        1200
      );


    }catch(error){

      console.error(
        "REGISTRATION ERROR:",
        error
      );


      showMessage(
        error.message ||
        "Registration failed. Please try again.",
        "error"
      );


      registerBtn.disabled =
        false;

      registerBtn.textContent =
        "CREATE ACCOUNT";

    }

  }
);


/* =========================================
   START
========================================= */

checkConnection();

</script>

</body>
</html>
