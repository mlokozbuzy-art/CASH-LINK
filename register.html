/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

const SUPABASE_URL =
  "https://vrrglcpixeqnqqdlqtot.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_CyKL7kpQ2K5AdosXfebJCg_k-uF8OpV";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   ELEMENTS
===================================================== */

const form =
  document.getElementById(
    "registerForm"
  );

const message =
  document.getElementById(
    "message"
  );

const registerButton =
  document.getElementById(
    "registerButton"
  );


/* =====================================================
   REFERRER
===================================================== */

const urlParams =
  new URLSearchParams(
    window.location.search
  );


const referrer =
  String(
    urlParams.get("ref") || ""
  )
  .trim()
  .toLowerCase();


if(referrer){

  document.getElementById(
    "refBox"
  ).style.display =
    "block";

  document.getElementById(
    "refUsername"
  ).textContent =
    "@" + referrer;

}


/* =====================================================
   MESSAGE FUNCTION
===================================================== */

function showMessage(
  text,
  error = false
){

  message.style.display =
    "block";

  message.classList.toggle(
    "error",
    error
  );

  message.innerHTML =
    text;

}


/* =====================================================
   NORMALIZE PHONE
===================================================== */

function normalizePhone(phone){

  return String(phone)
    .replace(/\s+/g,"")
    .replace(/-/g,"");

}


/* =====================================================
   VALIDATE PHONE
===================================================== */

function validPhone(phone){

  const clean =
    normalizePhone(phone);

  /*
    Tanzania examples:

    0712345678
    0755123456
    +255712345678
  */

  return (
    /^0[67]\d{8}$/.test(clean) ||
    /^\+255[67]\d{8}$/.test(clean)
  );

}


/* =====================================================
   CHECK USERNAME
===================================================== */

async function usernameExists(
  username
){

  const result =
    await supabaseClient
      .from("users")
      .select("id")
      .eq("username",username)
      .limit(1);

  if(result.error){

    throw result.error;

  }

  return (
    result.data &&
    result.data.length > 0
  );

}


/* =====================================================
   CHECK EMAIL
===================================================== */

async function emailExists(
  email
){

  const result =
    await supabaseClient
      .from("users")
      .select("id")
      .eq("email",email)
      .limit(1);

  if(result.error){

    throw result.error;

  }

  return (
    result.data &&
    result.data.length > 0
  );

}


/* =====================================================
   CHECK PHONE
===================================================== */

async function phoneExists(
  phone
){

  const result =
    await supabaseClient
      .from("users")
      .select("id")
      .eq("phone",phone)
      .limit(1);

  if(result.error){

    throw result.error;

  }

  return (
    result.data &&
    result.data.length > 0
  );

}


/* =====================================================
   FIND REFERRER
===================================================== */

async function findReferrer(
  username
){

  if(!username){

    return null;

  }

  const result =
    await supabaseClient
      .from("users")
      .select("id,username")
      .eq("username",username)
      .limit(1);

  if(result.error){

    throw result.error;

  }

  if(
    !result.data ||
    result.data.length === 0
  ){

    return null;

  }

  return result.data[0];

}


/* =====================================================
   SUBMIT
===================================================== */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    /* ---------------------------------------------
       GET VALUES
    --------------------------------------------- */

    const fullname =
      document
        .getElementById("fullname")
        .value
        .trim();


    const username =
      document
        .getElementById("username")
        .value
        .trim()
        .toLowerCase();


    const phone =
      normalizePhone(
        document
          .getElementById("phone")
          .value
          .trim()
      );


    const email =
      document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();


    const password =
      document
        .getElementById("password")
        .value;


    /* ---------------------------------------------
       BASIC VALIDATION
    --------------------------------------------- */

    if(
      !fullname ||
      !username ||
      !phone ||
      !email ||
      !password
    ){

      showMessage(
        "Please fill in all fields.",
        true
      );

      return;

    }


    if(
      username.length < 3 ||
      username.length > 20
    ){

      showMessage(
        "Username must be 3–20 characters.",
        true
      );

      return;

    }


    const usernamePattern =
      /^[a-zA-Z0-9_]+$/;


    if(
      !usernamePattern.test(username)
    ){

      showMessage(
        "Username can only contain letters, numbers and underscore.",
        true
      );

      return;

    }


    if(
      !validPhone(phone)
    ){

      showMessage(
        "Enter a valid Tanzania phone number.",
        true
      );

      return;

    }


    if(
      password.length < 6
    ){

      showMessage(
        "Password must contain at least 6 characters.",
        true
      );

      return;

    }


    /* ---------------------------------------------
       LOADING
    --------------------------------------------- */

    registerButton.disabled =
      true;

    registerButton.innerHTML =

      `
        <span class="loading">
          <span class="spinner"></span>
          CREATING ACCOUNT...
        </span>
      `;


    message.style.display =
      "none";


    try{


      /* -------------------------------------------
         CHECK USERNAME
      ------------------------------------------- */

      if(
        await usernameExists(
          username
        )
      ){

        throw new Error(
          "This username already exists. Please choose another."
        );

      }


      /* -------------------------------------------
         CHECK EMAIL
      ------------------------------------------- */

      if(
        await emailExists(
          email
        )
      ){

        throw new Error(
          "This email is already registered."
        );

      }


      /* -------------------------------------------
         CHECK PHONE
      ------------------------------------------- */

      if(
        await phoneExists(
          phone
        )
      ){

        throw new Error(
          "This phone number is already registered."
        );

      }


      /* -------------------------------------------
         FIND REFERRER
      ------------------------------------------- */

      let validReferrer =
        null;


      if(referrer){

        const refUser =
          await findReferrer(
            referrer
          );


        if(refUser){

          validReferrer =
            refUser.username;

        }

      }


      /* -------------------------------------------
         CREATE USER ID
      ------------------------------------------- */

      const userId =
        "LC-" +
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2,8);


      /* -------------------------------------------
         INSERT INTO SUPABASE
      ------------------------------------------- */

      const insertData = {

        id:
          userId,

        fullname:
          fullname,

        username:
          username,

        phone:
          phone,

        email:
          email,

        password:
          password,

        referrer:
          validReferrer,

        balance:
          0,

        commission:
          0,

        status:
          "pending",

        activationFee:
          14500,

        paymentStatus:
          "unpaid",

        paymentMethod:
          null,

        paymentReference:
          null

      };


      const result =
        await supabaseClient
          .from("users")
          .insert(
            insertData
          )
          .select()
          .single();


      /* -------------------------------------------
         SUPABASE ERROR
      ------------------------------------------- */

      if(result.error){

        console.error(
          "SUPABASE REGISTER ERROR:",
          result.error
        );

        throw new Error(
          result.error.message
        );

      }


      /* -------------------------------------------
         SAVE LOCAL COPY
         FOR PENDING DASHBOARD
      ------------------------------------------- */

      const newUser =
        result.data;


      localStorage.setItem(
        "linkcashUser",
        JSON.stringify(
          newUser
        )
      );


      localStorage.setItem(
        "linkcashLoggedIn",
        "true"
      );


      /*
        Keep a local copy too,
        so existing parts of the
        LINKCASH frontend continue
        working.
      */

      let localUsers = [];


      try{

        localUsers =
          JSON.parse(
            localStorage.getItem(
              "linkcashUsers"
            ) || "[]"
          );


        if(
          !Array.isArray(localUsers)
        ){

          localUsers = [];

        }

      }catch{

        localUsers = [];

      }


      localUsers.push(
        newUser
      );


      localStorage.setItem(
        "linkcashUsers",
        JSON.stringify(
          localUsers
        )
      );


      /* -------------------------------------------
         SUCCESS
      ------------------------------------------- */

      showMessage(

        validReferrer

        ?

        `
          Account created successfully ✓
          <br>
          Invited by @${escapeHTML(validReferrer)}
          <br><br>
          Your account is waiting for CEO activation.
          <br>
          Opening your account...
        `

        :

        `
          Account created successfully ✓
          <br><br>
          Your account is waiting for CEO activation.
          <br>
          Opening your account...
        `

      );


      /* -------------------------------------------
         BUTTON
      ------------------------------------------- */

      registerButton.innerHTML =
        "ACCOUNT CREATED ✓";


      /* -------------------------------------------
         OPEN PENDING DASHBOARD
      ------------------------------------------- */

      setTimeout(
        function(){

          window.location.href =
            "pending-dashboard.html";

        },
        1200
      );


    }catch(error){

      console.error(
        "REGISTER ERROR:",
        error
      );


      showMessage(

        "Registration failed:<br>" +
        escapeHTML(
          error.message ||
          "Something went wrong."
        ),

        true

      );


      registerButton.disabled =
        false;


      registerButton.innerHTML =
        "CREATE ACCOUNT";

    }

  }
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}
