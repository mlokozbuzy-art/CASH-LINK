/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

const SUPABASE_URL =
  "https://vrrglcpixeqnqqdlqtot.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_CyKL7kpQ2K5AdosXfebJCg_k-uF8OpV";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   ELEMENTS
===================================================== */

const form =
  document.getElementById(
    "loginForm"
  );


const button =
  document.getElementById(
    "loginBtn"
  );


const message =
  document.getElementById(
    "message"
  );


const usernameInput =
  document.getElementById(
    "username"
  );


const passwordInput =
  document.getElementById(
    "password"
  );


const showPassword =
  document.getElementById(
    "showPassword"
  );


const connectionDot =
  document.getElementById(
    "connectionDot"
  );


const connectionText =
  document.getElementById(
    "connectionText"
  );


/* =====================================================
   SHOW / HIDE PASSWORD
===================================================== */

showPassword.addEventListener(
  "click",
  function(){

    if(
      passwordInput.type ===
      "password"
    ){

      passwordInput.type =
        "text";

      showPassword.textContent =
        "HIDE";

    }else{

      passwordInput.type =
        "password";

      showPassword.textContent =
        "SHOW";

    }

  }
);


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(
  text,
  type
){

  message.className =
    "message " + type;

  message.textContent =
    text;

  message.style.display =
    "block";

}


/* =====================================================
   HIDE MESSAGE
===================================================== */

function hideMessage(){

  message.style.display =
    "none";

}


/* =====================================================
   CONNECTION TEST
===================================================== */

async function testConnection(){

  connectionText.textContent =
    "CHECKING SUPABASE...";

  connectionDot.className =
    "connection-dot";


  try{

    const result =
      await supabaseClient
      .from("users")
      .select("id")
      .limit(1);


    if(result.error){

      console.error(
        "SUPABASE CONNECTION ERROR:",
        result.error
      );

      connectionDot.className =
        "connection-dot error";

      connectionText.textContent =
        "DATABASE CONNECTION ERROR";

      return false;

    }


    connectionDot.className =
      "connection-dot online";

    connectionText.textContent =
      "SUPABASE CONNECTED";

    return true;


  }catch(error){

    console.error(
      error
    );

    connectionDot.className =
      "connection-dot error";

    connectionText.textContent =
      "SUPABASE CONNECTION FAILED";

    return false;

  }

}


/* =====================================================
   NORMALIZE USER DATA
===================================================== */

function normalizeUser(
  user
){

  return {

    id:
      user.id || "",

    fullname:
      user.full_name ||
      user.fullname ||
      "",

    username:
      user.username ||
      "",

    phone:
      user.phone ||
      "",

    email:
      user.email ||
      "",

    referrer:
      user.referrer ||
      null,

    status:
      String(
        user.status ||
        "pending"
      )
      .trim()
      .toLowerCase(),

    balance:
      Number(
        user.balance || 0
      ),

    commission:
      Number(
        user.commission || 0
      ),

    activation_fee:
      Number(
        user.activation_fee || 14500
      ),

    payment_status:
      user.payment_status ||
      "unpaid"

  };

}


/* =====================================================
   LOGIN
===================================================== */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    hideMessage();


    const username =
      usernameInput
      .value
      .trim()
      .toLowerCase();


    const password =
      passwordInput
      .value;


    /* ===============================================
       VALIDATION
    =============================================== */

    if(!username){

      showMessage(
        "Please enter your username.",
        "error"
      );

      usernameInput.focus();

      return;

    }


    if(!password){

      showMessage(
        "Please enter your password.",
        "error"
      );

      passwordInput.focus();

      return;

    }


    /* ===============================================
       LOADING
    =============================================== */

    button.disabled =
      true;

    button.textContent =
      "LOGGING IN...";


    try{


      /* =============================================
         CEO LOGIN
         
         This is kept as the existing CEO route.
      ============================================= */

      if(
        username === "ceo" &&
        password === "CEO@2026"
      ){

        localStorage.setItem(
          "linkcashCEOLoggedIn",
          "true"
        );


        localStorage.setItem(
          "linkcashCEO",
          JSON.stringify({

            username:"CEO",

            role:"CEO"

          })
        );


        showMessage(
          "CEO login successful ✓",
          "success"
        );


        button.textContent =
          "LOGIN SUCCESSFUL ✓";


        setTimeout(
          function(){

            window.location.href =
              "ceodashboard.html";

          },
          600
        );


        return;

      }


      /* =============================================
         FIND USER FROM SUPABASE
      ============================================= */

      const result =
        await supabaseClient
        .from("users")
        .select("*")
        .eq("username",username)
        .maybeSingle();


      if(result.error){

        console.error(
          "LOGIN DATABASE ERROR:",
          result.error
        );


        throw new Error(
          result.error.message
        );

      }


      /* =============================================
         USER NOT FOUND
      ============================================= */

      if(!result.data){

        throw new Error(
          "Incorrect username or password."
        );

      }


      /* =============================================
         USER
      ============================================= */

      const user =
        result.data;


      /* =============================================
         CHECK PASSWORD
      ============================================= */

      if(
        String(
          user.password || ""
        ) !==
        password
      ){

        throw new Error(
          "Incorrect username or password."
        );

      }


      /* =============================================
         NORMALIZE
      ============================================= */

      const normalizedUser =
        normalizeUser(
          user
        );


      const status =
        normalizedUser.status;


      /* =============================================
         SAVE CURRENT USER
      ============================================= */

      localStorage.setItem(
        "linkcashUser",
        JSON.stringify(
          normalizedUser
        )
      );


      localStorage.setItem(
        "linkcashLoggedIn",
        "true"
      );


      /* =============================================
         SUCCESS MESSAGE
      ============================================= */

      showMessage(
        "Login successful ✓",
        "success"
      );


      button.textContent =
        "LOGIN SUCCESSFUL ✓";


      /* =============================================
         ROUTING
      ============================================= */

      setTimeout(
        function(){


          /* =========================
             ACTIVE
          ========================= */

          if(
            status === "active" ||
            status === "activated"
          ){

            window.location.href =
              "dashboard.html";

            return;

          }


          /* =========================
             PENDING
          ========================= */

          if(
            status === "pending" ||
            status === "payment_pending" ||
            status === "inactive" ||
            status === "non-active" ||
            status === "not_activated"
          ){

            window.location.href =
              "pending-dashboard.html";

            return;

          }


          /* =========================
             DEFAULT
          ========================= */

          window.location.href =
            "pending-dashboard.html";


        },
        700
      );


    }catch(error){

      console.error(
        "LINKCASH LOGIN ERROR:",
        error
      );


      showMessage(
        error.message ||
        "Login failed.",
        "error"
      );


      button.disabled =
        false;

      button.textContent =
        "LOGIN";

    }

  }
);


/* =====================================================
   START CONNECTION CHECK
===================================================== */

testConnection();

</script></body></html>
