</style></head><body><div class="wrapper">  <div class="brand"><div class="logo">LC</div>

<h1>LINKCASH</h1>

<p>Simple. Secure. Connected.</p>

  </div>  <div class="card"><div class="title">

  <h2>Create Account</h2>

  <p>
    Create your LINKCASH account to get started.
  </p>

</div>


<!-- REFERRER -->

<div
  class="ref-box"
  id="refBox"
>

  <small>INVITED BY</small>

  <strong id="refUsername">—</strong>

</div>


<!-- FORM -->

<form id="registerForm">

  <div class="field">

    <label>Full Name</label>

    <input
      type="text"
      id="fullname"
      placeholder="Enter your full name"
      autocomplete="name"
      required
    >

  </div>


  <div class="field">

    <label>Username</label>

    <input
      type="text"
      id="username"
      placeholder="Choose a username"
      minlength="3"
      maxlength="20"
      autocomplete="username"
      required
    >

    <div class="username-note">

      Username must be 3–20 characters.<br>
      Letters, numbers and underscore only.

    </div>

  </div>


  <div class="field">

    <label>Phone Number</label>

    <input
      type="tel"
      id="phone"
      placeholder="07XXXXXXXX"
      autocomplete="tel"
      required
    >

  </div>


  <div class="field">

    <label>Email Address</label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      autocomplete="email"
      required
    >

  </div>


  <div class="field">

    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Create your password"
      minlength="6"
      autocomplete="new-password"
      required
    >

  </div>


  <button
    type="submit"
    class="register-btn"
    id="registerButton"
  >
    CREATE ACCOUNT
  </button>

  class="message"
  id="message"
></div>

  </div></div><script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
  "https://vrrglcpixeqnqqdlqtot.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_CyKL7kpQ2K5AdosXfebJCg_k-uF8OpV";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   REFERRER
===================================================== */

const urlParams =
  new URLSearchParams(
    window.location.search
  );


const referrer =
  String(
    urlParams.get("ref") || ""
  )
  .trim()
  .toLowerCase();


if(referrer){

  document.getElementById("refBox")
    .style.display = "block";

  document.getElementById("refUsername")
    .textContent = "@" + referrer;

}


/* =====================================================
   ELEMENTS
===================================================== */

const form =
  document.getElementById("registerForm");

const message =
  document.getElementById("message");

const registerButton =
  document.getElementById("registerButton");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type=""){

  message.style.display = "block";

  message.className =
    "message " + type;

  message.innerHTML = text;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   NORMALIZE PHONE
===================================================== */

function normalizePhone(phone){

  let value =
    String(phone)
      .replace(/\s+/g,"")
      .replace(/-/g,"");

  if(value.startsWith("+255")){
    return "0" + value.substring(4);
  }

  if(value.startsWith("255")){
    return "0" + value.substring(3);
  }

  return value;

}


/* =====================================================
   FORM SUBMIT
===================================================== */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    registerButton.disabled = true;

    registerButton.textContent =
      "CREATING ACCOUNT...";

    message.style.display = "none";


    try{

      /* ===============================================
         READ VALUES
      =============================================== */

      const fullname =
        document.getElementById("fullname")
          .value
          .trim();


      const username =
        document.getElementById("username")
          .value
          .trim()
          .toLowerCase();


      const phone =
        normalizePhone(
          document.getElementById("phone")
            .value
        );


      const email =
        document.getElementById("email")
          .value
          .trim()
          .toLowerCase();


      const password =
        document.getElementById("password")
          .value;


      /* ===============================================
         VALIDATION
      =============================================== */

      if(
        !fullname ||
        !username ||
        !phone ||
        !email ||
        !password
      ){

        throw new Error(
          "Please fill in all fields."
        );

      }


      if(
        username.length < 3 ||
        username.length > 20
      ){

        throw new Error(
          "Username must be 3–20 characters."
        );

      }


      if(
        !/^[a-zA-Z0-9_]+$/.test(username)
      ){

        throw new Error(
          "Username can only contain letters, numbers and underscore."
        );

      }


      if(
        !/^0[67]\d{8}$/.test(phone)
      ){

        throw new Error(
          "Enter a valid Tanzanian phone number, e.g. 0712345678."
        );

      }


      if(password.length < 6){

        throw new Error(
          "Password must be at least 6 characters."
        );

      }


      /* ===============================================
         CHECK USERNAME
      =============================================== */

      const usernameCheck =
        await supabaseClient
          .from("users")
          .select("id")
          .eq("username",username)
          .maybeSingle();


      if(usernameCheck.error){

        throw new Error(
          "Username check failed: " +
          usernameCheck.error.message
        );

      }


      if(usernameCheck.data){

        throw new Error(
          "This username already exists."
        );

      }


      /* ===============================================
         CHECK PHONE
      =============================================== */

      const phoneCheck =
        await supabaseClient
          .from("users")
          .select("id")
          .eq("phone",phone)
          .maybeSingle();


      if(phoneCheck.error){

        throw new Error(
          "Phone check failed: " +
          phoneCheck.error.message
        );

      }


      if(phoneCheck.data){

        throw new Error(
          "This phone number is already registered."
        );

      }


      /* ===============================================
         CHECK EMAIL
      =============================================== */

      const emailCheck =
        await supabaseClient
          .from("users")
          .select("id")
          .eq("email",email)
          .maybeSingle();


      if(emailCheck.error){

        throw new Error(
          "Email check failed: " +
          emailCheck.error.message
        );

      }


      if(emailCheck.data){

        throw new Error(
          "This email is already registered."
        );

      }


      /* ===============================================
         CHECK REFERRER
      =============================================== */

      let validReferrer = null;


      if(referrer){

        const refCheck =
          await supabaseClient
            .from("users")
            .select("username")
            .eq("username",referrer)
            .maybeSingle();


        if(refCheck.error){

          throw new Error(
            "Referral check failed: " +
            refCheck.error.message
          );

        }


        if(refCheck.data){

          validReferrer =
            refCheck.data.username;

        }

      }


      /* ===============================================
         CREATE DATABASE RECORD
         
         IMPORTANT:
         Column names are snake_case.
      =============================================== */

      const newUser = {

        full_name:
          fullname,

        username:
          username,

        phone:
          phone,

        email:
          email,

        password:
          password,

        referrer:
          validReferrer,

        joined_at:
          new Date().toISOString(),

        balance:
          0,

        commission:
          0,

        status:
          "pending",

        activation_fee:
          14500,

        payment_status:
          "unpaid",

        payment_method:
          null,

        payment_reference:
          null

      };


      /* ===============================================
         INSERT
      =============================================== */

      const result =
        await supabaseClient
          .from("users")
          .insert(newUser)
          .select()
          .single();


      if(result.error){

        console.error(
          "SUPABASE REGISTRATION ERROR:",
          result.error
        );

        throw new Error(
          result.error.message
        );

      }


      /* ===============================================
         CREATED USER
      =============================================== */

      const createdUser =
        result.data;


      /* ===============================================
         SAVE SAFE USER DATA LOCALLY
      =============================================== */

      localStorage.setItem(
        "linkcashUser",
        JSON.stringify({

          id:
            createdUser.id,

          full_name:
            createdUser.full_name,

          username:
            createdUser.username,

          phone:
            createdUser.phone,

          email:
            createdUser.email,

          referrer:
            createdUser.referrer,

          status:
            createdUser.status,

          balance:
            createdUser.balance,

          commission:
            createdUser.commission,

          activation_fee:
            createdUser.activation_fee,

          payment_status:
            createdUser.payment_status

        })
      );


      localStorage.setItem(
        "linkcashLoggedIn",
        "true"
      );


      /* ===============================================
         SUCCESS
      =============================================== */

      showMessage(
        "Account created successfully ✓" +
        "<br><br>" +
        "Your account is now <b>PENDING</b>." +
        "<br>" +
        "The CEO can review your registration.",
        "success"
      );


      registerButton.textContent =
        "ACCOUNT CREATED ✓";


      /* ===============================================
         GO TO PENDING DASHBOARD
      =============================================== */

      setTimeout(
        function(){

          window.location.href =
            "pending-dashboard.html";

        },
        1500
      );


    }catch(error){

      console.error(
        "REGISTRATION FAILED:",
        error
      );


      showMessage(
        "Registration failed:<br><br>" +
        escapeHTML(
          error.message ||
          "Unknown error"
        ),
        "error"
      );


      registerButton.disabled =
        false;

      registerButton.textContent =
        "CREATE ACCOUNT";

    }

  });

</script></body>
</html>
