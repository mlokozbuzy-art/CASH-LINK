<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>LINKCASH - CEO Dashboard</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:#050505;
  color:#fff;
  padding-bottom:30px;
}

/* =========================
   TOPBAR
========================= */

.topbar{
  height:68px;
  background:#0b0b0b;
  border-bottom:1px solid #252525;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 17px;
  position:sticky;
  top:0;
  z-index:100;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:41px;
  height:41px;
  border-radius:12px;
  background:
    linear-gradient(
      145deg,
      #ffe082,
      #d4a72c,
      #8f6b12
    );
  color:#050505;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:900;
}

.brand-name{
  font-size:16px;
  font-weight:900;
  letter-spacing:1.5px;
}

.ceo-badge{
  padding:8px 12px;
  border-radius:20px;
  background:rgba(212,167,44,.08);
  border:1px solid rgba(212,167,44,.25);
  color:#d4a72c;
  font-size:9px;
  font-weight:900;
}

/* =========================
   CONTAINER
========================= */

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:24px 16px 40px;
}

/* =========================
   HEADER
========================= */

.header{
  margin-bottom:20px;
}

.header small{
  color:#777;
  font-size:10px;
  letter-spacing:1px;
}

.header h1{
  font-size:25px;
  margin-top:6px;
}

.header h1 span{
  color:#d4a72c;
}

.header p{
  color:#666;
  font-size:11px;
  margin-top:6px;
  line-height:1.5;
}

/* =========================
   STATS
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:22px;
}

.stat{
  background:#101010;
  border:1px solid #282828;
  border-radius:17px;
  padding:16px 11px;
}

.stat-icon{
  width:35px;
  height:35px;
  border-radius:11px;
  background:#1b1b1b;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
}

.stat-value{
  font-size:21px;
  font-weight:900;
}

.stat-name{
  color:#666;
  font-size:9px;
  margin-top:4px;
}

/* =========================
   ACTION BAR
========================= */

.action-bar{
  display:flex;
  gap:9px;
  margin-bottom:17px;
}

.action-btn{
  flex:1;
  height:43px;
  border-radius:10px;
  border:1px solid #292929;
  background:#101010;
  color:#aaa;
  font-size:10px;
  font-weight:bold;
  cursor:pointer;
}

.action-btn:hover{
  border-color:#d4a72c;
  color:#d4a72c;
}

.refresh-btn{
  color:#d4a72c;
}

/* =========================
   SECTION
========================= */

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:20px 0 11px;
}

.section-title h2{
  font-size:16px;
}

.section-title span{
  color:#d4a72c;
  font-size:9px;
}

/* =========================
   REQUEST LIST
========================= */

.requests{
  display:grid;
  gap:12px;
}

/* =========================
   REQUEST CARD
========================= */

.request{
  background:
    linear-gradient(
      145deg,
      #151515,
      #0a0a0a
    );
  border:1px solid #2b2b2b;
  border-radius:19px;
  padding:17px;
}

.request.pending{
  border-color:#393329;
}

.request.active{
  border-color:rgba(88,216,138,.25);
}

.request.rejected{
  border-color:rgba(255,80,80,.2);
}

.request-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px;
}

.user-info{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
}

.avatar{
  width:44px;
  height:44px;
  min-width:44px;
  border-radius:13px;
  background:#1d1d1d;
  color:#d4a72c;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}

.user-name{
  font-size:13px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.user-username{
  color:#666;
  font-size:9px;
  margin-top:4px;
}

.status{
  padding:7px 9px;
  border-radius:15px;
  font-size:8px;
  font-weight:900;
  white-space:nowrap;
}

.status.pending{
  color:#d4a72c;
  background:rgba(212,167,44,.08);
  border:1px solid rgba(212,167,44,.2);
}

.status.active{
  color:#58d88a;
  background:rgba(88,216,138,.08);
  border:1px solid rgba(88,216,138,.2);
}

.status.rejected{
  color:#ff7777;
  background:rgba(255,80,80,.07);
  border:1px solid rgba(255,80,80,.18);
}

/* =========================
   PAYMENT DETAILS
========================= */

.details{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.detail{
  background:#090909;
  border:1px solid #202020;
  border-radius:11px;
  padding:11px;
  min-width:0;
}

.detail-label{
  color:#555;
  font-size:8px;
  margin-bottom:5px;
}

.detail-value{
  color:#ddd;
  font-size:11px;
  font-weight:bold;
  word-break:break-word;
}

.detail-value.gold{
  color:#d4a72c;
}

/* =========================
   ACTIONS
========================= */

.request-actions{
  display:flex;
  gap:8px;
  margin-top:13px;
}

.activate-btn,
.reject-btn{
