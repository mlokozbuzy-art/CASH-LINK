<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LINKCASH - CEO Dashboard</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:#050505;
  color:#fff;
  padding-bottom:30px;
}

.topbar{
  height:68px;
  background:#0b0b0b;
  border-bottom:1px solid #252525;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 17px;
  position:sticky;
  top:0;
  z-index:100;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:41px;
  height:41px;
  border-radius:12px;
  background:linear-gradient(145deg,#ffe082,#d4a72c,#8f6b12);
  color:#050505;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:900;
}

.brand-name{
  font-size:16px;
  font-weight:900;
  letter-spacing:1.5px;
}

.ceo-badge{
  padding:8px 12px;
  border-radius:20px;
  background:rgba(212,167,44,.08);
  border:1px solid rgba(212,167,44,.25);
  color:#d4a72c;
  font-size:9px;
  font-weight:900;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:24px 16px 40px;
}

.header{
  margin-bottom:20px;
}

.header small{
  color:#777;
  font-size:10px;
  letter-spacing:1px;
}

.header h1{
  font-size:25px;
  margin-top:6px;
}

.header h1 span{
  color:#d4a72c;
}

.header p{
  color:#666;
  font-size:11px;
  margin-top:6px;
  line-height:1.5;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:22px;
}

.stat{
  background:#101010;
  border:1px solid #282828;
  border-radius:17px;
  padding:16px 11px;
}

.stat-icon{
  width:35px;
  height:35px;
  border-radius:11px;
  background:#1b1b1b;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
}

.stat-value{
  font-size:21px;
  font-weight:900;
}

.stat-name{
  color:#666;
  font-size:9px;
  margin-top:4px;
}

.action-bar{
  display:flex;
  gap:9px;
  margin-bottom:17px;
  flex-wrap:wrap;
}

.action-btn{
  flex:1;
  min-width:110px;
  height:43px;
  border-radius:10px;
  border:1px solid #292929;
  background:#101010;
  color:#aaa;
  font-size:10px;
  font-weight:bold;
  cursor:pointer;
}

.action-btn:hover{
  border-color:#d4a72c;
  color:#d4a72c;
}

.refresh-btn{
  color:#d4a72c;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:24px 0 11px;
}

.section-title h2{
  font-size:16px;
}

.section-title span{
  color:#d4a72c;
  font-size:9px;
}

/* =========================
   VIDEO ADMIN
========================= */

.video-admin{
  background:linear-gradient(145deg,#151515,#0a0a0a);
  border:1px solid #292929;
  border-radius:19px;
  padding:17px;
}

.video-form{
  display:grid;
  gap:10px;
}

.input,
.select{
  width:100%;
  height:44px;
  border-radius:10px;
  border:1px solid #292929;
  background:#080808;
  color:#fff;
  padding:0 12px;
  outline:none;
  font-size:11px;
}

.input:focus,
.select:focus{
  border-color:#d4a72c;
}

.textarea{
  width:100%;
  min-height:80px;
  resize:vertical;
  border-radius:10px;
  border:1px solid #292929;
  background:#080808;
  color:#fff;
  padding:12px;
  outline:none;
  font-size:11px;
}

.textarea:focus{
  border-color:#d4a72c;
}

.gold-btn{
  width:100%;
  height:44px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#ffe082,#d4a72c);
  color:#080808;
  font-size:11px;
  font-weight:900;
  cursor:pointer;
}

.video-list{
  display:grid;
  gap:10px;
  margin-top:13px;
}

.video-card{
  background:#101010;
  border:1px solid #292929;
  border-radius:15px;
  padding:14px;
}

.video-card-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

.video-platform{
  font-size:9px;
  font-weight:900;
  color:#d4a72c;
  text-transform:uppercase;
}

.video-title{
  font-size:13px;
  font-weight:bold;
  margin-top:5px;
}

.video-description{
  color:#666;
  font-size:10px;
  margin-top:5px;
  line-height:1.5;
}

.video-url{
  color:#777;
  font-size:9px;
  margin-top:10px;
  word-break:break-all;
}

.video-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.video-delete{
  flex:1;
  height:38px;
  border-radius:9px;
  border:1px solid rgba(255,80,80,.25);
  background:rgba(255,80,80,.07);
  color:#ff7777;
  font-size:9px;
  font-weight:900;
}

.video-toggle{
  flex:1;
  height:38px;
  border-radius:9px;
  border:1px solid rgba(88,216,138,.25);
  background:rgba(88,216,138,.07);
  color:#58d88a;
  font-size:9px;
  font-weight:900;
}

/* =========================
   REQUESTS
========================= */

.requests{
  display:grid;
  gap:12px;
}

.request{
  background:linear-gradient(145deg,#151515,#0a0a0a);
  border:1px solid #2b2b2b;
  border-radius:19px;
  padding:17px;
}

.request.pending{
  border-color:#393329;
}

.request.approved{
  border-color:rgba(88,216,138,.25);
}

.request.rejected{
  border-color:rgba(255,80,80,.2);
}

.request-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px;
}

.user-info{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
}

.avatar{
  width:44px;
  height:44px;
  min-width:44px;
  border-radius:13px;
  background:#1d1d1d;
  color:#d4a72c;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}

.user-name{
  font-size:13px;
  font-weight:bold;
}

.user-username{
  color:#666;
  font-size:9px;
  margin-top:4px;
}

.status{
  padding:7px 9px;
  border-radius:15px;
  font-size:8px;
  font-weight:900;
}

.status.pending{
  color:#d4a72c;
  background:rgba(212,167,44,.08);
}

.status.approved{
  color:#58d88a;
  background:rgba(88,216,138,.08);
}

.status.rejected{
  color:#ff7777;
  background:rgba(255,80,80,.07);
}

.details{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.detail{
  background:#090909;
  border:1px solid #202020;
  border-radius:11px;
  padding:11px;
}

.detail-label{
  color:#555;
  font-size:8px;
  margin-bottom:5px;
}

.detail-value{
  color:#ddd;
  font-size:11px;
  font-weight:bold;
  word-break:break-word;
}

.detail-value.gold{
  color:#d4a72c;
}

.request-actions{
  display:flex;
  gap:8px;
  margin-top:13px;
}

.activate-btn,
.reject-btn,
.delete-btn{
  flex:1;
  height:40px;
  border-radius:10px;
  font-size:10px;
  font-weight:900;
  cursor:pointer;
}

.activate-btn{
  border:1px solid rgba(88,216,138,.3);
  background:rgba(88,216,138,.08);
  color:#58d88a;
}

.reject-btn{
  border:1px solid rgba(255,80,80,.25);
  background:rgba(255,80,80,.07);
  color:#ff7777;
}

.delete-btn{
  border:1px solid #292929;
  background:#101010;
  color:#777;
}

/* =========================
   USERS
========================= */

.users-section{
  margin-top:25px;
}

.user-card{
  background:#101010;
  border:1px solid #292929;
  border-radius:15px;
  padding:14px;
  margin-bottom:9px;
}

.user-card-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.user-card-name{
  font-size:12px;
  font-weight:bold;
}

.user-card-username{
  color:#666;
  font-size:9px;
  margin-top:4px;
}

.user-status{
  font-size:8px;
  font-weight:bold;
}

.user-status.active{
  color:#58d88a;
}

.user-status.pending{
  color:#d4a72c;
}

.user-status.rejected{
  color:#ff7777;
}

.search{
  width:100%;
  height:44px;
  margin-bottom:12px;
  border-radius:11px;
  border:1px solid #292929;
  background:#090909;
  color:#fff;
  padding:0 13px;
  outline:none;
  font-size:11px;
}

.empty{
  display:none;
  padding:35px 20px;
  text-align:center;
  background:#101010;
  border:1px solid #292929;
  border-radius:18px;
}

.empty-icon{
  font-size:30px;
  margin-bottom:10px;
}

.empty h3{
  font-size:14px;
}

.empty p{
  margin-top:6px;
  color:#666;
  font-size:10px;
}

.logout{
  width:100%;
  height:45px;
  margin-top:24px;
  border-radius:11px;
  border:1px solid #292929;
  background:#101010;
  color:#999;
  font-size:10px;
  font-weight:bold;
}

.footer{
  text-align:center;
  margin-top:22px;
  color:#444;
  font-size:9px;
}

@media(max-width:600px){

  .stats{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:380px){

  .stats{
    gap:6px;
  }

  .stat{
    padding:13px 8px;
  }

  .stat-value{
    font-size:16px;
  }

  .details{
    grid-template-columns:1fr;
  }

  .request-actions{
    flex-direction:column;
  }

}

</style>
</head>

<body>

<header class="topbar">

  <div class="brand">

    <div class="logo">
      LC
    </div>

    <div class="brand-name">
      LINKCASH
    </div>

  </div>

  <div class="ceo-badge">
    CEO PANEL
  </div>

</header>


<main class="container">

<section class="header">

  <small>ADMINISTRATION</small>

  <h1>
    Welcome,
    <span>CEO</span>
  </h1>

  <p>
    Manage LINKCASH users, payments and social media tasks.
  </p>

</section>


<section class="stats">

  <div class="stat">

    <div class="stat-icon">
      👥
    </div>

    <div
      class="stat-value"
      id="totalUsers"
    >
      0
    </div>

    <div class="stat-name">
      TOTAL USERS
    </div>

  </div>


  <div class="stat">

    <div class="stat-icon">
      ⏳
    </div>

    <div
      class="stat-value"
      id="pendingCount"
    >
      0
    </div>

    <div class="stat-name">
      PENDING
    </div>

  </div>


  <div class="stat">

    <div class="stat-icon">
      🎬
    </div>

    <div
      class="stat-value"
      id="videoCount"
    >
      0
    </div>

    <div class="stat-name">
      SOCIAL TASKS
    </div>

  </div>

</section>


<div class="action-bar">

  <button
    class="action-btn refresh-btn"
    onclick="loadDashboard()"
  >
    ↻ REFRESH
  </button>

  <button
    class="action-btn"
    onclick="showPending()"
  >
    PENDING
  </button>

  <button
    class="action-btn"
    onclick="showAllUsers()"
  >
    USERS
  </button>

</div>


<!-- =========================
     SOCIAL MEDIA TASKS
========================= -->

<div class="section-title">

  <h2>
    Social Media Tasks
  </h2>

  <span>
    CEO CONTROL
  </span>

</div>


<section class="video-admin">

  <div class="video-form">

    <select
      class="select"
      id="videoPlatform"
    >

      <option value="TikTok">
        TikTok
      </option>

      <option value="YouTube">
        YouTube
      </option>

      <option value="Facebook">
        Facebook
      </option>

    </select>


    <input
      class="input"
      id="videoTitle"
      type="text"
      placeholder="Video title"
    >


    <input
      class="input"
