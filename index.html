<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LINKCASH</title><style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;

  background:
    linear-gradient(
      145deg,
      #063d2a,
      #075c3b,
      #04291d
    );

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;
}

.container{
  width:100%;
  max-width:360px;
  text-align:center;
  padding:25px;
}

.logo{
  width:75px;
  height:75px;

  margin:0 auto 18px;

  border-radius:20px;

  background:linear-gradient(
    145deg,
    #ffe082,
    #d4a72c,
    #8f6b12
  );

  color:#050505;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:25px;
  font-weight:900;

  box-shadow:
    0 0 25px rgba(255,224,130,.25);
}

.welcome{
  color:#ffe082;
  font-size:13px;
  font-weight:bold;
  letter-spacing:2px;
  margin-bottom:7px;
}

h1{
  font-size:27px;
  letter-spacing:3px;
  margin-bottom:30px;
}

.buttons{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.btn{
  width:100%;
  height:50px;

  border-radius:12px;

  display:flex;
  align-items:center;
  justify-content:center;

  text-decoration:none;

  font-size:13px;
  font-weight:900;

  transition:.2s;
}

.login{
  background:linear-gradient(
    135deg,
    #ffe082,
    #d4a72c,
    #a77b17
  );

  color:#062719;
}

.register{
  background:rgba(0,0,0,.20);

  color:#ffe082;

  border:1px solid rgba(255,224,130,.45);
}

.btn:hover{
  transform:translateY(-1px);
}

.footer{
  margin-top:25px;
  color:rgba(255,255,255,.45);
  font-size:9px;
}
</style></head><body><div class="container">  <div class="logo">
    LC
  </div>  <div class="welcome">
    WELCOME
  </div>  <h1>
    LINKCASH
  </h1>  <div class="buttons"><a
  href="login.html"
  class="btn login"
>
  LOG IN
</a>

<a
  href="register.html"
  class="btn register"
>
  CREATE ACCOUNT
</a>

  </div>  <div class="footer">
    © 2026 LINKCASH
  </div></div></body>
</html>
