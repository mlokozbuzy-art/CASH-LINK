<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LINKCASH</title><style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:#050505;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.container{
  width:100%;
  max-width:360px;
  text-align:center;
  padding:25px;
}

.logo{
  width:75px;
  height:75px;
  margin:0 auto 18px;
  border-radius:20px;

  background:linear-gradient(
    145deg,
    #ffe082,
    #d4a72c,
    #8f6b12
  );

  color:#050505;
  display:flex;
  align-items:center;
  justify-content:center;

  font-size:25px;
  font-weight:900;

  box-shadow:0 0 25px rgba(212,167,44,.18);
}

h1{
  font-size:27px;
  letter-spacing:3px;
  margin-bottom:30px;
}

.buttons{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.btn{
  width:100%;
  height:50px;
  border-radius:12px;

  display:flex;
  align-items:center;
  justify-content:center;

  text-decoration:none;

  font-size:13px;
  font-weight:900;

  cursor:pointer;
}

.login{
  background:linear-gradient(
    135deg,
    #ffe082,
    #d4a72c,
    #a77b17
  );

  color:#050505;
}

.register{
  background:#101010;
  color:#d4a72c;
  border:1px solid #292929;
}

.btn:hover{
  transform:translateY(-1px);
}

.footer{
  margin-top:25px;
  color:#444;
  font-size:9px;
}
</style></head><body><div class="container">  <div class="logo">
    LC
  </div>  <h1>
    LINKCASH
  </h1>  <div class="buttons"><a
  href="login.html"
  class="btn login"
>
  LOG IN
</a>

<a
  href="register.html"
  class="btn register"
>
  CREATE ACCOUNT
</a>

  </div>  <div class="footer">
    © 2026 LINKCASH
  </div></div></body>
</html>
