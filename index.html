<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINKCASH</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #07111f, #102a43);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border-radius: 22px;
      background: linear-gradient(135deg, #00e5ff, #006eff);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      font-weight: bold;
      box-shadow: 0 10px 35px rgba(0, 174, 255, 0.3);
    }

    h1 {
      font-size: 38px;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #b9c7d8;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 25px;
      border-radius: 22px;
      backdrop-filter: blur(10px);
    }

    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 14px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
    }

    .login {
      background: #00c6ff;
      color: #00121d;
    }

    .register {
      background: transparent;
      border: 1px solid #00c6ff;
      color: #00c6ff;
    }

    .footer {
      margin-top: 25px;
      color: #8293a8;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">LC</div>

    <h1>LINKCASH</h1>

    <p class="subtitle">
      Welcome to LINKCASH.<br>
      Your simple digital platform.
    </p>

    <div class="card">

      <a href="login.html" class="btn login">
        LOGIN
      </a>

      <a href="register.html" class="btn register">
        CREATE ACCOUNT
      </a>

    </div>

    <div class="footer">
      © 2026 LINKCASH
    </div>

  </div>

</body>
</html>
