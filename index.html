<html lang="en">

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;

    }

    body {

      color: #172033;
    }

    header {
      background: #ffffff;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #1167d8;
      letter-spacing: 1px;
    }

    .login-btn {
      text-decoration: none;
      background: #1167d8;
      color: white;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: bold;

    }

      align-items: center;

      text-align: center;
      padding: 50px 20px;
      background:
        linear-gradient(135deg, #eef6ff, #ffffff);
    }

    .hero-content {
      max-width: 700px;
    }

    .badge {
      display: inline-block;
      background: #e5f0ff;
      color: #1167d8;
      padding: 8px 15px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 46px;
      line-height: 1.1;
      margin-bottom: 18px;
    }

    h1 span {
      color: #1167d8;
    }

    .hero p {
      color: #667085;
      font-size: 17px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .primary-btn,
    .secondary-btn {
      padding: 14px 25px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      display: inline-block;
    }

    .primary-btn {
      background: #1167d8;
      color: white;
    }

    .secondary-btn {
      background: white;
      color: #1167d8;
      border: 1px solid #d7e3f5;
    }

    .features {
      padding: 60px 20px;
      max-width: 1100px;
      margin: auto;
    }

    .section-title {
      text-align: center;
      margin-bottom: 35px;
    }

    .section-title h2 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .section-title p {
      color: #667085;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      background: white;
      padding: 28px 22px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.05);
      text-align: center;
    }

    .icon {
      width: 55px;
      height: 55px;
      margin: auto auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #edf5ff;
      border-radius: 15px;
      font-size: 25px;
    }

    .card h3 {
      margin-bottom: 10px;
    }

    .card p {
      color: #667085;
      line-height: 1.6;
      font-size: 14px;
    }

      text-align: center;

      background: #1167d8;
      color: white;
