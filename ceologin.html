<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LINKCASH - CEO Login</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:#050505;
  color:#fff;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:20px;
}

.wrapper{
  width:100%;
  max-width:430px;
}

/* BRAND */

.brand{
  text-align:center;
  margin-bottom:25px;
}

.logo{
  width:70px;
  height:70px;

  margin:auto;

  border-radius:20px;

  background:
    linear-gradient(
      145deg,
      #ffe082,
      #d4a72c,
      #8f6b12
    );

  display:flex;
  align-items:center;
  justify-content:center;

  color:#090909;

  font-size:24px;
  font-weight:900;

  box-shadow:
    0 0 30px rgba(212,167,44,.25);
}

.brand h1{
  margin-top:13px;

  font-size:28px;

  letter-spacing:3px;
}

.brand p{
  margin-top:7px;

  color:#777;

  font-size:13px;
}

/* CARD */

.card{
  background:#101010;

  border:1px solid #292929;

  border-radius:24px;

  padding:28px 22px;

  box-shadow:
    0 25px 70px rgba(0,0,0,.6);
}

/* CEO BADGE */

.ceo-badge{
  width:max-content;

  margin:0 auto 20px;

  padding:7px 13px;

  border-radius:20px;

  background:rgba(212,167,44,.08);

  border:1px solid rgba(212,167,44,.3);

  color:#d4a72c;

  font-size:9px;

  font-weight:900;

  letter-spacing:1px;
}

/* TITLE */

.title{
  margin-bottom:23px;
}

.title h2{
  font-size:23px;

  margin-bottom:7px;
}

.title p{
  color:#858585;

  font-size:13px;

  line-height:1.5;
}

/* FIELD */

.field{
  margin-bottom:17px;
}

.field label{
  display:block;

  color:#cfcfcf;

  font-size:13px;

  margin-bottom:8px;
}

input{
  width:100%;

  height:50px;

  background:#070707;

  border:1px solid #292929;

  border-radius:12px;

  color:#fff;

  outline:none;

  padding:0 15px;

  font-size:14px;
}

input::placeholder{
  color:#555;
}

input:focus{
  border-color:#d4a72c;

  box-shadow:
    0 0 0 2px rgba(212,167,44,.08);
}

/* PASSWORD */

.password-wrap{
  position:relative;
}

.password-wrap input{
  padding-right:65px;
}

.show-password{
  position:absolute;

  right:12px;

  top:50%;

  transform:translateY(-50%);

  background:none;

  border:none;

  color:#d4a72c;

  font-size:12px;

  font-weight:bold;

  cursor:pointer;
}

/* LOGIN */

.login-btn{
  width:100%;

  height:53px;

  margin-top:5px;

  border:none;

  border-radius:13px;

  background:
    linear-gradient(
      135deg,
      #ffe082,
      #d4a72c,
      #a77b17
    );

  color:#080808;

  font-size:15px;

  font-weight:900;

  cursor:pointer;

  transition:.2s;
}

.login-btn:hover{
  filter:brightness(1.08);
}

.login-btn:active{
  transform:scale(.98);
}

.login-btn:disabled{
  opacity:.6;

  cursor:not-allowed;
}

/* MESSAGE */

.message{
  display:none;

  margin-top:15px;

  padding:13px;

  border-radius:10px;

  text-align:center;

  font-size:12px;

  line-height:1.5;
}

.message.success{
  display:block;

  background:rgba(40,180,100,.10);

  border:1px solid rgba(40,180,100,.3);

  color:#62df91;
}

.message.error{
  display:block;

  background:rgba(220,60,60,.10);

  border:1px solid rgba(220,60,60,.3);

  color:#ff7777;
}

/* INFO */

.security{
  margin-top:18px;

  padding:12px;

  border-radius:11px;

  background:#090909;

  border:1px solid #202020;

  text-align:center;

  color:#555;

  font-size:9px;

  line-height:1.5;
}

/* BACK */

.back{
  display:block;

  text-align:center;

  margin-top:18px;

  color:#686868;

  text-decoration:none;

  font-size:12px;
}

.back:hover{
  color:#d4a72c;
}

/* FOOTER */

.footer{
  text-align:center;

  margin-top:18px;

  color:#444;

  font-size:11px;
}

</style>

</head>

<body>

<div class="wrapper">

  <!-- BRAND -->

  <div class="brand">

    <div class="logo">
      LC
    </div>

    <h1>
      LINKCASH
    </h1>

    <p>
      Simple. Secure. Connected.
    </p>

  </div>


  <!-- LOGIN CARD -->

  <div class="card">

    <div class="ceo-badge">
      CEO ACCESS
    </div>


    <div class="title">

      <h2>
        Welcome, CEO
      </h2>

      <p>
        Login to access the LINKCASH CEO Dashboard.
      </p>

    </div>


    <form
      id="loginForm"
      autocomplete="off"
    >

      <!-- USERNAME -->

      <div class="field">

        <label>
          CEO Username
        </label>

        <input
          type="text"
          id="username"
          placeholder="Enter CEO username"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
          required
        >

      </div>


      <!-- PASSWORD -->

      <div class="field">

        <label>
          CEO Password
        </label>

        <div class="password-wrap">

          <input
            type="password"
            id="password"
            placeholder="Enter CEO password"
            autocomplete="new-password"
            required
          >

          <button
            type="button"
            class="show-password"
            id="showPassword"
          >
            SHOW
          </button>

        </div>

      </div>


      <!-- LOGIN BUTTON -->

      <button
        type="submit"
        class="login-btn"
        id="loginBtn"
      >
        LOGIN AS CEO
      </button>

    </form>


    <!-- MESSAGE -->

    <div
      id="message"
      class="message"
    ></div>


    <!-- SECURITY INFO -->

    <div class="security">

      🔐 CEO ADMIN ACCESS<br>

      Authorized LINKCASH administration only.

    </div>

  </div>


  <!-- BACK -->

  <a
    href="index.html"
    class="back"
  >
    ← Back to Home
  </a>


  <!-- FOOTER -->

  <div class="footer">
    © 2026 LINKCASH
  </div>

</div>


<script>

/* =====================================================
   CEO ACCOUNT
   NO DATABASE
   NO SUPABASE
===================================================== */

const CEO_USERNAME = "ceo";

const CEO_PASSWORD = "CEO@2026";


/* =====================================================
   ELEMENTS
===================================================== */

const form =
  document.getElementById("loginForm");

const usernameInput =
  document.getElementById("username");

const passwordInput =
  document.getElementById("password");

const loginButton =
  document.getElementById("loginBtn");

const message =
  document.getElementById("message");

const showPasswordButton =
  document.getElementById("showPassword");


/* =====================================================
   SHOW PASSWORD
===================================================== */

showPasswordButton.addEventListener(
  "click",
  function(){

    if(
      passwordInput.type === "password"
    ){

      passwordInput.type = "text";

      showPasswordButton.textContent =
        "HIDE";

    }else{

      passwordInput.type = "password";

      showPasswordButton.textContent =
        "SHOW";

    }

  }
);


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  type
){

  message.className =
    "message " + type;

  message.textContent =
    text;

  message.style.display =
    "block";

}


function clearMessage(){

  message.className =
    "message";

  message.textContent =
    "";

  message.style.display =
    "none";

}


/* =====================================================
   CLEAR OLD SESSIONS
===================================================== */

function clearOldSessions(){

  localStorage.removeItem(
    "linkcashCEOLoggedIn"
  );

  localStorage.removeItem(
    "linkcashCEO"
  );

}


/* =====================================================
   LOGIN
===================================================== */

form.addEventListener(
  "submit",
  function(event){

    event.preventDefault();

    clearMessage();


    const username =
      usernameInput.value
        .trim()
        .toLowerCase();


    const password =
      passwordInput.value;


    /* ===============================================
       EMPTY USERNAME
    =============================================== */

    if(!username){

      showMessage(
        "Please enter CEO username.",
        "error"
      );

      usernameInput.focus();

      return;

    }


    /* ===============================================
       EMPTY PASSWORD
    =============================================== */

    if(!password){

      showMessage(
        "Please enter CEO password.",
        "error"
      );

      passwordInput.focus();

      return;

    }


    /* ===============================================
       BUTTON
    =============================================== */

    loginButton.disabled = true;

    loginButton.textContent =
      "CHECKING...";


    /* ===============================================
       CLEAR OLD SESSION
    =============================================== */

    clearOldSessions();


    /* ===============================================
       CHECK CEO LOGIN
    =============================================== */

    if(
      username === CEO_USERNAME &&
      password === CEO_PASSWORD
    ){

      /* SAVE CEO SESSION */

      localStorage.setItem(
        "linkcashCEOLoggedIn",
        "true"
      );


      localStorage.setItem(
        "linkcashCEO",
        JSON.stringify({

          username:"ceo",

          role:"ceo",

          status:"active",

          loginTime:
            new Date().toISOString()

        })
      );


      /* SUCCESS */

      showMessage(
        "CEO login successful ✓",
        "success"
      );


      loginButton.textContent =
        "LOGIN SUCCESSFUL ✓";


      /* GO TO DASHBOARD */

      setTimeout(
        function(){

          window.location.replace(
            "ceodashboard.html"
          );

        },
        700
      );


      return;

    }


    /* ===============================================
       WRONG LOGIN
    =============================================== */

    showMessage(
      "Username or password is incorrect.",
      "error"
    );


    loginButton.disabled = false;

    loginButton.textContent =
      "LOGIN AS CEO";

  }
);


/* =====================================================
   AUTO CHECK CEO SESSION
===================================================== */

(function(){

  const loggedIn =
    localStorage.getItem(
      "linkcashCEOLoggedIn"
    );

  if(
    loggedIn === "true"
  ){

    /*
     * Kama CEO tayari amelogin,
     * mpeleke dashboard moja kwa moja.
     */

    window.location.replace(
      "ceodashboard.html"
    );

  }

})();

</script>

</body>
</html>
