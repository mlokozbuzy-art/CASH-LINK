<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LINKCASH - CEO Login</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:#050505;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-card{
  width:100%;
  max-width:410px;
  background:linear-gradient(145deg,#151515,#090909);
  border:1px solid #333;
  border-radius:24px;
  padding:28px 22px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.logo{
  width:58px;
  height:58px;
  border-radius:17px;
  margin:0 auto 15px;
  background:linear-gradient(145deg,#ffe082,#d4a72c,#8f6b12);
  color:#050505;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:900;
}

h1{
  text-align:center;
  font-size:23px;
}

.subtitle{
  text-align:center;
  color:#777;
  font-size:11px;
  margin-top:7px;
  margin-bottom:25px;
}

.badge{
  width:max-content;
  margin:0 auto 22px;
  padding:7px 12px;
  border-radius:20px;
  background:rgba(212,167,44,.08);
  border:1px solid rgba(212,167,44,.25);
  color:#d4a72c;
  font-size:9px;
  font-weight:bold;
}

.field{
  margin-bottom:15px;
}

label{
  display:block;
  color:#aaa;
  font-size:11px;
  margin-bottom:7px;
}

input{
  width:100%;
  height:48px;
  border-radius:11px;
  border:1px solid #292929;
  background:#070707;
  color:#fff;
  padding:0 13px;
  outline:none;
  font-size:12px;
}

input:focus{
  border-color:#d4a72c;
}

.login-btn{
  width:100%;
  height:49px;
  margin-top:5px;
  border:none;
  border-radius:11px;
  background:linear-gradient(135deg,#ffe082,#d4a72c);
  color:#080808;
  font-weight:900;
  font-size:12px;
  cursor:pointer;
}

.login-btn:active{
  transform:scale(.98);
}

.error{
  display:none;
  margin-top:14px;
  padding:11px;
  border-radius:10px;
  background:rgba(255,70,70,.07);
  border:1px solid rgba(255,70,70,.2);
  color:#ff7777;
  text-align:center;
  font-size:10px;
}

.footer{
  text-align:center;
  color:#444;
  font-size:9px;
  margin-top:22px;
}

.credentials{
  margin-top:18px;
  padding:12px;
  border-radius:11px;
  background:#0b0b0b;
  border:1px solid #202020;
  color:#666;
  font-size:9px;
  line-height:1.6;
  text-align:center;
}

.credentials strong{
  color:#d4a72c;
}
</style>
</head>

<body>

<div class="login-card">

  <div class="logo">
    LC
  </div>

  <h1>
    CEO Login
  </h1>

  <div class="subtitle">
    LINKCASH Administration Panel
  </div>

  <div class="badge">
    CEO ACCESS
  </div>

  <form onsubmit="ceoLogin(event)">

    <div class="field">
      <label>
        CEO USERNAME
      </label>

      <input
        type="text"
        id="ceoUsername"
        placeholder="Enter CEO username"
        autocomplete="username"
        required
      >
    </div>

    <div class="field">
      <label>
        CEO PASSWORD
      </label>

      <input
        type="password"
        id="ceoPassword"
        placeholder="Enter CEO password"
        autocomplete="current-password"
        required
      >
    </div>

    <button
      type="submit"
      class="login-btn"
    >
      LOGIN AS CEO
    </button>

  </form>

  <div
    class="error"
    id="errorMessage"
  >
    Invalid CEO username or password.
  </div>

  <div class="credentials">
    Test Username:
    <strong>ceo</strong>
    <br>
    Test Password:
    <strong>CEO@2026</strong>
  </div>

  <div class="footer">
    © 2026 LINKCASH
  </div>

</div>


<script>

function ceoLogin(event){

  event.preventDefault();

  const username =
    document
      .getElementById("ceoUsername")
      .value
      .trim();

  const password =
    document
      .getElementById("ceoPassword")
      .value;

  /*
  =========================================
  CEO TEST CREDENTIALS
  =========================================
  */

  const CEO_USERNAME = "ceo";
  const CEO_PASSWORD = "CEO@2026";


  if(
    username === CEO_USERNAME &&
    password === CEO_PASSWORD
  ){

    /*
    Save CEO login session
    */

    localStorage.setItem(
      "linkcashCEOLoggedIn",
      "true"
    );

    localStorage.setItem(
      "linkcashCEO",
      JSON.stringify({
        username:"ceo",
        role:"CEO"
      })
    );


    /*
    Go to CEO dashboard
    */

    window.location.href =
      "ceodashboard.html";

    return;
  }


  /*
  Wrong credentials
  */

  const error =
    document.getElementById(
      "errorMessage"
    );

  error.style.display =
    "block";


  document.getElementById(
    "ceoPassword"
  ).value = "";

}

</script>

</body>
</html>
