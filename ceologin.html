<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LINKCASH - CEO Login</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:#050505;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.wrapper{
  width:100%;
  max-width:430px;
}

.brand{
  text-align:center;
  margin-bottom:25px;
}

.logo{
  width:70px;
  height:70px;
  margin:auto;
  border-radius:20px;
  background:linear-gradient(145deg,#ffe082,#d4a72c,#8f6b12);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#090909;
  font-size:24px;
  font-weight:900;
}

.brand h1{
  margin-top:13px;
  font-size:28px;
  letter-spacing:3px;
}

.brand p{
  margin-top:7px;
  color:#888;
  font-size:13px;
}

.card{
  background:#101010;
  border:1px solid #292929;
  border-radius:24px;
  padding:28px 22px;
  box-shadow:0 25px 70px rgba(0,0,0,.6);
}

.badge{
  width:max-content;
  margin:0 auto 20px;
  padding:7px 14px;
  border-radius:20px;
  color:#d4a72c;
  background:rgba(212,167,44,.08);
  border:1px solid rgba(212,167,44,.3);
  font-size:9px;
  font-weight:900;
  letter-spacing:1px;
}

.title{
  margin-bottom:22px;
}

.title h2{
  font-size:23px;
  margin-bottom:7px;
}

.title p{
  color:#858585;
  font-size:13px;
  line-height:1.5;
}

.field{
  margin-bottom:17px;
}

.field label{
  display:block;
  color:#ccc;
  font-size:13px;
  margin-bottom:8px;
}

input{
  width:100%;
  height:50px;
  background:#070707;
  border:1px solid #292929;
  border-radius:12px;
  color:#fff;
  outline:none;
  padding:0 15px;
  font-size:14px;
}

input:focus{
  border-color:#d4a72c;
}

.password-box{
  position:relative;
}

.password-box input{
  padding-right:65px;
}

.show{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:none;
  color:#d4a72c;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
}

.login{
  width:100%;
  height:53px;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,#ffe082,#d4a72c,#a77b17);
  color:#080808;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
  margin-top:4px;
}

.login:disabled{
  opacity:.6;
}

.message{
  display:none;
  margin-top:15px;
  padding:13px;
  border-radius:10px;
  text-align:center;
  font-size:12px;
}

.message.success{
  display:block;
  color:#62df91;
  background:rgba(40,180,100,.1);
  border:1px solid rgba(40,180,100,.3);
}

.message.error{
  display:block;
  color:#ff7777;
  background:rgba(220,60,60,.1);
  border:1px solid rgba(220,60,60,.3);
}

.security{
  margin-top:18px;
  padding:12px;
  border-radius:11px;
  background:#090909;
  border:1px solid #202020;
  text-align:center;
  color:#555;
  font-size:9px;
  line-height:1.6;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#686868;
  text-decoration:none;
  font-size:12px;
}

.footer{
  text-align:center;
  margin-top:18px;
  color:#444;
  font-size:11px;
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="brand">

    <div class="logo">
      LC
    </div>

    <h1>LINKCASH</h1>

    <p>Simple. Secure. Connected.</p>

  </div>


  <div class="card">

    <div class="badge">
      CEO ACCESS
    </div>

    <div class="title">

      <h2>Welcome, CEO</h2>

      <p>
        Login to access the LINKCASH CEO Dashboard.
      </p>

    </div>


    <form id="loginForm">

      <div class="field">

        <label>CEO Username</label>

        <input
          id="username"
          type="text"
          placeholder="Enter CEO username"
          autocomplete="off"
          spellcheck="false"
          required
        >

      </div>


      <div class="field">

        <label>CEO Password</label>

        <div class="password-box">

          <input
            id="password"
            type="password"
            placeholder="Enter CEO password"
            autocomplete="off"
            required
          >

          <button
            type="button"
            class="show"
            id="showButton"
          >
            SHOW
          </button>

        </div>

      </div>


      <button
        class="login"
        id="loginButton"
        type="submit"
      >
        LOGIN AS CEO
      </button>

    </form>


    <div
      id="message"
      class="message"
    ></div>


    <div class="security">
      🔐 CEO ADMIN ACCESS
      <br>
      LINKCASH CEO PANEL
    </div>

  </div>


  <a
    href="index.html"
    class="back"
  >
    ← Back to Home
  </a>


  <div class="footer">
    © 2026 LINKCASH
  </div>

</div>


<script>

/* =====================================================
   CEO LOGIN DETAILS
===================================================== */

const CEO_USERNAME = "ceo";
const CEO_PASSWORD = "CEO@2026";


/* =====================================================
   ELEMENTS
===================================================== */

const form =
document.getElementById("loginForm");

const username =
document.getElementById("username");

const password =
document.getElementById("password");

const loginButton =
document.getElementById("loginButton");

const message =
document.getElementById("message");

const showButton =
document.getElementById("showButton");


/* =====================================================
   SHOW PASSWORD
===================================================== */

showButton.onclick = function(){

  if(password.type === "password"){

    password.type = "text";

    showButton.textContent = "HIDE";

  }else{

    password.type = "password";

    showButton.textContent = "SHOW";

  }

};


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

  message.className =
    "message " + type;

  message.textContent =
    text;

  message.style.display =
    "block";

}


/* =====================================================
   LOGIN
===================================================== */

form.onsubmit = function(event){

  event.preventDefault();


  /* Get values */

  const enteredUsername =
    username.value.trim().toLowerCase();

  const enteredPassword =
    password.value;


  /* Check empty */

  if(enteredUsername === ""){

    showMessage(
      "Enter CEO username.",
      "error"
    );

    username.focus();

    return;
  }


  if(enteredPassword === ""){

    showMessage(
      "Enter CEO password.",
      "error"
    );

    password.focus();

    return;
  }


  loginButton.disabled = true;

  loginButton.textContent =
    "CHECKING...";


  /* =================================================
     DIRECT CEO CHECK
  ================================================= */

  if(
    enteredUsername === CEO_USERNAME &&
    enteredPassword === CEO_PASSWORD
  ){

    /* Save CEO login */

    localStorage.setItem(
      "linkcashCEOLoggedIn",
      "true"
    );


    localStorage.setItem(
      "linkcashCEO",
      JSON.stringify({
        username:"ceo",
        role:"ceo",
        status:"active"
      })
    );


    showMessage(
      "CEO login successful ✓",
      "success"
    );


    loginButton.textContent =
      "SUCCESS ✓";


    /* Open dashboard */

    setTimeout(function(){

      window.location.href =
        "ceodashboard.html";

    },500);


  }else{

    /* Wrong credentials */

    showMessage(
      "Username or password is incorrect.",
      "error"
    );


    password.value = "";

    loginButton.disabled =
      false;

    loginButton.textContent =
      "LOGIN AS CEO";

  }

};


/* =====================================================
   IMPORTANT:
   NO SUPABASE
   NO DATABASE
   NO API
===================================================== */

</script>

</body>
</html>
